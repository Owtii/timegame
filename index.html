<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0A0C11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Two pass-and-play duels - blind timing and number deduction - feeding Tic-Tac-Toe or Connect 4.">
<title>Duel Board</title>
</head>
<body>
<!-- ARTIFACT:BEGIN -->
<style>
/* ============================================================
   Duel Board - precision-instrument treatment.
   Single dark visual world, deliberately.
   ============================================================ */

:root{
  --ink:#0A0C11; --panel:#12151D; --panel-2:#171B25; --panel-3:#1D2230;
  --hair:rgba(255,255,255,.085); --hair-2:rgba(255,255,255,.16);
  --text:#EDEFF5; --grey:#8A8FA0; --grey-dim:#5A6072;
  --coin:#E8B44A; --void:#E4A33B; --good:#3ED598;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Mono","Roboto Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --ease:cubic-bezier(.2,.85,.3,1);
  --pc:#8A8FA0;
  color-scheme:dark;
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; height:100%; background:var(--ink); }
body{
  color:var(--text); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior:none; touch-action:manipulation;
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;
}
input{ -webkit-user-select:text; user-select:text; font:inherit; }
button{ font:inherit; }

#app{
  position:fixed; inset:0; max-width:560px; margin-inline:auto;
  display:flex; flex-direction:column; overflow:hidden; isolation:isolate;
  padding:
    calc(env(safe-area-inset-top) + 12px)
    calc(env(safe-area-inset-right) + 18px)
    calc(env(safe-area-inset-bottom) + 14px)
    calc(env(safe-area-inset-left) + 18px);
}
#app::before{
  content:''; position:fixed; inset:-30% -30% auto -30%; height:75%; z-index:-1; pointer-events:none;
  background:radial-gradient(50% 55% at 50% 20%, var(--glow, rgba(120,130,160,.10)), transparent 72%);
  transition:background .7s var(--ease);
}

.lbl{ font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.185em; text-transform:uppercase; color:var(--grey-dim); }

/* ---------- chrome ---------- */

#topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:44px; flex:none;
  transition:opacity .35s var(--ease), transform .35s var(--ease); }
#topbar.recede{ opacity:0; transform:translateY(-8px); pointer-events:none; }
#topbar .slot{ flex:1 1 0; display:flex; align-items:center; gap:9px; min-width:0; }
#topbar .slot.right{ justify-content:flex-end; gap:8px; }
#topbar .slot.mid{ flex:none; }

.icon-btn{
  appearance:none; border:1px solid var(--hair); background:var(--panel); color:var(--grey);
  width:34px; height:34px; border-radius:10px; display:grid; place-items:center; padding:0; cursor:pointer;
  transition:color .2s,border-color .2s,background .2s,transform .1s;
}
.icon-btn:hover{ color:var(--text); border-color:var(--hair-2); }
.icon-btn:active{ transform:scale(.94); }
.icon-btn svg{ width:17px; height:17px; }
.icon-btn.armed{ color:var(--void); border-color:var(--void); background:rgba(228,163,59,.10); }
.icon-btn.tiny{ width:30px; height:30px; border-radius:9px; }
.icon-btn.tiny svg{ width:14px; height:14px; }

.whoami{ display:flex; align-items:center; gap:8px; padding:5px 10px 5px 6px; border:1px solid var(--hair);
  border-radius:999px; background:var(--panel); cursor:pointer; min-width:0; color:var(--text); }
.whoami:active{ transform:scale(.97); }
.whoami .dot{ width:9px; height:9px; border-radius:50%; background:var(--pc); flex:none; box-shadow:0 0 8px -1px var(--pc); }
.whoami .nm{ font-family:var(--mono); font-size:11px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.whoami .sw{ color:var(--grey-dim); font-size:10px; display:grid; }
.whoami .sw svg{ width:13px; height:13px; }

.coinpill{ display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:12.5px; font-weight:700; color:var(--coin); border:1px solid rgba(232,180,74,.28);
  background:rgba(232,180,74,.08); border-radius:999px; padding:5px 11px 5px 8px; }
.coinpill svg{ width:13px; height:13px; flex:none; }

.tally{ display:flex; align-items:center; gap:7px; font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12px; font-weight:700; }
.tally i{ width:9px; height:9px; border-radius:50%; display:inline-block; }
.tally .sep{ color:var(--grey-dim); font-weight:400; }

/* ---------- stage ---------- */

#stage{ flex:1 1 auto; min-height:0; display:flex; }
#stage.scrolls{ overflow-y:auto; overflow-x:hidden; scrollbar-width:none; }
#stage.scrolls::-webkit-scrollbar{ display:none; }

.screen{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; animation:screenIn .38s var(--ease) both; }
@keyframes screenIn{ from{ opacity:0; transform:translateY(10px); } }
.view{ flex:1 1 auto; display:flex; flex-direction:column; gap:14px; padding:4px 0 8px; animation:screenIn .3s var(--ease) both; }

/* ---------- tab bar ---------- */

#tabbar{ flex:none; display:grid; grid-template-columns:repeat(5,1fr); gap:2px; padding-top:10px; margin-top:2px; border-top:1px solid var(--hair); }
#tabbar.hidden{ display:none; }
.tab{ appearance:none; border:0; background:transparent; padding:7px 2px 3px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:5px; color:var(--grey-dim); transition:color .2s; position:relative; }
.tab svg{ width:19px; height:19px; }
.tab span{ font-family:var(--mono); font-size:8.5px; letter-spacing:.1em; text-transform:uppercase; }
.tab.on{ color:var(--text); }
.tab.on::before{ content:''; position:absolute; top:-11px; left:50%; transform:translateX(-50%); width:22px; height:2px; border-radius:2px; background:var(--pc); }
.tab .badge{ position:absolute; top:3px; right:calc(50% - 17px); width:7px; height:7px; border-radius:50%; background:var(--coin); border:1.5px solid var(--ink); }

/* ---------- panels ---------- */

.panel{ border:1px solid var(--hair); border-radius:16px; background:var(--panel); padding:15px 16px; display:flex; flex-direction:column; gap:12px; }
.panel.tight{ padding:13px 14px; gap:9px; }
.panel-h{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.headline{ display:flex; flex-direction:column; gap:3px; }
.headline .big{ font-family:var(--mono); font-size:19px; font-weight:700; letter-spacing:-.02em; }

.statgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
.stat{ border:1px solid var(--hair); border-radius:12px; background:var(--panel-2); padding:10px 8px; text-align:center; display:flex; flex-direction:column; gap:4px; }
.stat .v{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; letter-spacing:-.02em; }
.stat .k{ font-family:var(--mono); font-size:8.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--grey-dim); }

/* ---------- buttons ---------- */

.act{ appearance:none; width:100%; flex:none; border:1px solid var(--hair-2); border-radius:16px;
  background:var(--panel-2); color:var(--text); font-family:var(--mono); font-size:12px; font-weight:600;
  letter-spacing:.16em; text-transform:uppercase; padding:17px 20px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:10px;
  transition:transform .12s var(--ease), background .2s, border-color .2s, opacity .2s; }
.act:hover{ background:var(--panel-3); border-color:rgba(255,255,255,.24); }
.act:active{ transform:scale(.985); background:#161a24; }
.act:focus-visible{ outline:2px solid var(--grey); outline-offset:2px; }
.act.accent{ border-color:var(--pc); color:var(--pc); background:transparent; }
.act.hero{ background:var(--pc); border-color:var(--pc); color:#0A0C11; font-weight:700; }
.act.hero:hover{ filter:brightness(1.08); background:var(--pc); }
.act[disabled]{ opacity:.4; cursor:default; transform:none; }
.act.sm{ padding:10px 14px; font-size:10.5px; border-radius:11px; width:auto; }
.act svg{ width:13px; height:13px; flex:none; }
.act.ghost{ background:transparent; border-color:var(--hair); color:var(--grey); }

/* ---------- setup (mode + board choice) ---------- */

.setup{ justify-content:center; gap:16px; }
.choices{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.choice{
  appearance:none; text-align:left; cursor:pointer; position:relative;
  border:1px solid var(--hair); border-radius:15px; background:var(--panel); color:var(--text);
  padding:13px 13px 12px; display:flex; flex-direction:column; gap:7px;
  transition:border-color .2s, background .2s, transform .1s;
}
.choice:active{ transform:scale(.98); }
.choice.on{ border-color:var(--pc); background:var(--panel-2); }
.choice .art{ height:46px; color:var(--grey-dim); transition:color .25s; }
.choice.on .art{ color:var(--pc); }
.choice .t{ font-family:var(--mono); font-size:12.5px; font-weight:700; letter-spacing:-.01em; }
.choice .d{ font-size:11px; color:var(--grey-dim); line-height:1.35; }
.choice .tickmark{ position:absolute; top:11px; right:11px; width:15px; height:15px; border-radius:50%;
  background:var(--pc); color:var(--ink); display:none; place-items:center; }
.choice.on .tickmark{ display:grid; }
.choice .tickmark svg{ width:9px; height:9px; }
.choices.one{ grid-template-columns:1fr; }
.setup.stack{ justify-content:flex-start; gap:13px; }
.setup.stack .foot{ position:sticky; bottom:0; padding:14px 0 2px; margin-top:0;
  background:linear-gradient(to top, var(--ink) 58%, transparent); }
.headline.mid{ text-align:center; align-items:center; }
.hintline{ margin:2px 0 0; text-align:center; color:var(--grey-dim); font-size:12px; line-height:1.45; }

/* ---------- setup tiles: one question, big targets ---------- */

.tiles{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.tile{ appearance:none; cursor:pointer; border:1px solid var(--hair); border-radius:17px; background:var(--panel);
  color:var(--text); padding:15px 12px 14px; display:flex; flex-direction:column; align-items:center; gap:8px;
  transition:border-color .2s, background .2s, transform .1s; }
.tile:hover{ border-color:var(--hair-2); background:var(--panel-2); }
.tile:active{ transform:scale(.965); border-color:var(--pc); }
.tile:focus-visible{ outline:2px solid var(--pc); outline-offset:2px; }
.tile .art{ height:38px; width:100%; color:var(--pc); display:block; }
.tile .art svg{ display:block; margin-inline:auto; height:100%; }
.tile .t{ font-family:var(--mono); font-size:12.5px; font-weight:700; letter-spacing:-.01em; text-align:center; }
.tile .d{ font-size:10.5px; color:var(--grey-dim); text-align:center; line-height:1.35; }
.tile.big{ padding:22px 14px 18px; gap:10px; }
.tile.big .art{ height:44px; }

/* ---------- boards ---------- */

.board{ position:relative; display:grid; }

/* tic-tac-toe */
.board.ttt{ grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); aspect-ratio:1/1; }
/* px caps only - a vw cap ignores the app's own padding and overflows narrow screens */
.board.ttt.lg{ width:100%; max-width:min(92vw,430px); gap:11px; margin-inline:auto; }
.board.ttt.sm{ width:54px; gap:3px; }
.board.ttt .cell{ background:var(--panel); border:1px solid var(--hair); border-radius:14px; }
.board.ttt.sm .cell{ border-radius:4px; border-color:rgba(255,255,255,.07); }
/* the terrain drives both boards through the same three variables */
.board.ttt .cell{ background:var(--frame,var(--panel)); border-radius:var(--rad,14px); }
.board.ttt.sm .cell{ border-radius:calc(var(--rad,14px)/3); }

.cell{ position:relative; appearance:none; padding:0; min-width:0; min-height:0; overflow:hidden;
  display:grid; place-items:center; transition:background .2s, border-color .2s, transform .12s var(--ease); }
.cell:disabled{ cursor:default; }
.cell.live{ cursor:pointer; }
.cell.live:hover{ border-color:var(--hair-2); background:var(--panel-2); }
.cell.live:active{ transform:scale(.94); }
.cell.live:focus-visible{ outline:2px solid var(--pc); outline-offset:2px; }
.cell .pad{ width:100%; height:100%; padding:19%; display:block; }
.board.ttt.sm .cell .pad{ padding:17%; }
.cell.wincell{ background:var(--panel-2); border-color:var(--pc); }

.ghost{ opacity:.11; transition:opacity .18s, transform .18s var(--ease); display:block; width:100%; height:100%; }
.cell.live:hover .ghost{ opacity:.24; }
.cell.live:active .ghost{ opacity:.42; transform:scale(1.06); }

.mk{ display:block; width:100%; height:100%; overflow:visible; }
.mk line,.mk circle{ fill:none; stroke:currentColor; stroke-width:9; stroke-linecap:round; }
/* the design inside the piece: filled by default, `st` for the stroked bits */
.mk .mo *{ fill:currentColor; stroke:none; }
.mk .mo .st{ fill:none; stroke:currentColor; stroke-width:6; }
.mk .mo .tw{ fill:none; stroke:rgba(255,255,255,.72); stroke-width:4; }
.board.sm .mk line,.board.sm .mk circle{ stroke-width:13; }
.mk.anim.mk-x line{ stroke-dasharray:74; stroke-dashoffset:74; animation:draw .3s var(--ease) forwards; }
.mk.anim.mk-x line.s2{ animation-delay:.13s; }
.mk.anim.mk-o circle{ stroke-dasharray:164; stroke-dashoffset:164; animation:draw .44s var(--ease) forwards; }
.mk-o circle{ transform:rotate(-90deg); transform-origin:50% 50%; }
@keyframes draw{ to{ stroke-dashoffset:0; } }

/* ---------- connect 4 ----------
   Three stacked layers. Pieces sit *under* a frame that has its holes punched
   out with a mask, so a piece crossing a hole is visible and a piece crossing
   the frame is not. That is what lets a single element fall the whole way in
   one continuous move and still read as falling *into* the board. */
.c4wrap{ position:relative; width:100%; max-width:min(96vw,470px); margin-inline:auto; }
.board.c4{
  position:relative; display:block; aspect-ratio:var(--cols)/var(--rows);
  background:var(--well,#08090D); border-radius:var(--rad,14px); overflow:hidden;
  box-shadow:inset 0 2px 10px rgba(0,0,0,.55);
}
.c4pieces{ position:absolute; inset:0; z-index:1;
  display:grid; grid-template-columns:repeat(var(--cols),1fr); grid-template-rows:repeat(var(--rows),1fr); }
.c4pieces .cell{ display:grid; place-items:center; background:none; border:0; }
.c4front{
  position:absolute; inset:0; z-index:2; pointer-events:none;
  background:var(--frame,#12151D); border-radius:var(--rad,14px);
  -webkit-mask-image:radial-gradient(circle closest-side,#0000 0 79%,#000 81%);
          mask-image:radial-gradient(circle closest-side,#0000 0 79%,#000 81%);
  -webkit-mask-size:calc(100%/var(--cols)) calc(100%/var(--rows));
          mask-size:calc(100%/var(--cols)) calc(100%/var(--rows));
  -webkit-mask-repeat:repeat; mask-repeat:repeat;
}
.board.c4 .winline{ z-index:3; }
.disc{ display:block; width:84%; height:84%; overflow:visible;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.5)) drop-shadow(0 0 9px color-mix(in srgb,currentColor 45%,transparent)); }
.c4fall{ position:absolute; top:0; z-index:1; display:grid; place-items:center; will-change:transform; }
.discghost{ display:block; width:80%; height:80%; border-radius:50%; border:2px dashed currentColor; opacity:.45; }
.c4pieces .cell.wincell .disc{ filter:drop-shadow(0 0 10px var(--pc)) drop-shadow(0 0 3px var(--pc)); }

.c4cols{ position:absolute; inset:0; z-index:4; display:grid; grid-template-columns:repeat(var(--cols),1fr); }
.c4col{ appearance:none; border:0; background:transparent; cursor:pointer; padding:0; transition:background .15s; }
.c4col:hover{ background:rgba(255,255,255,.055); }
.c4col:active{ background:rgba(255,255,255,.1); }
.c4col[disabled]{ cursor:default; }
.c4col:focus-visible{ outline:2px solid var(--pc); outline-offset:-3px; }

.board.c4.sm{ width:78px; border-radius:4px; box-shadow:none; }
.board.c4.sm .disc{ width:88%; height:88%; filter:none; }

.winline{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
.winline line{ stroke:var(--pc); stroke-linecap:round; stroke-dasharray:400; stroke-dashoffset:400;
  animation:draw .55s .3s var(--ease) forwards; filter:drop-shadow(0 0 7px var(--pc)); }

/* ---------- hub: home ---------- */

.wordmark h1{ margin:0; font-family:var(--mono); font-weight:700; font-size:clamp(27px,9vw,36px); line-height:.94; letter-spacing:-.035em; }
.wordmark h1 .l2{ color:var(--grey); }
.wordmark p{ margin:8px 0 0; color:var(--grey); font-size:13.5px; line-height:1.5; max-width:34ch; }

.demo{ position:relative; height:84px; flex:none; border-block:1px solid var(--hair); display:grid; place-items:center; overflow:hidden; }
.demo::before,.demo::after{ content:''; position:absolute; top:0; bottom:0; width:1px; background:var(--hair); }
.demo::before{ left:0; } .demo::after{ right:0; }
.demo .readout{ font-family:var(--mono); font-size:38px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.03em; }
.demo .layer{ position:absolute; inset:0; display:grid; place-items:center; }

.ticks{ width:100%; height:34px; opacity:0; color:var(--pc);
  background-image:repeating-linear-gradient(90deg,currentColor 0 1px,transparent 1px 10px);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent); }

.vsrow{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; }
.vsrow .side{ display:flex; flex-direction:column; align-items:center; gap:6px; }
.vsrow .side .g{ width:32px; height:32px; }
.vsrow .side .n{ font-family:var(--mono); font-size:11px; font-weight:700; color:var(--pc); max-width:13ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.vsrow .side .r{ font-family:var(--mono); font-size:9px; letter-spacing:.1em; color:var(--grey-dim); }
.vsrow .mid{ font-family:var(--mono); font-size:9px; letter-spacing:.18em; color:var(--grey-dim); }

/* ---------- hub: quests / shop / players / profile ---------- */

.qrow{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--hair); }
.qrow:last-child{ border-bottom:0; padding-bottom:2px; }
.qrow .body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:6px; }
.qrow .t{ font-size:13.5px; font-weight:600; }
.qrow .d{ font-size:11.5px; color:var(--grey); }
.bar{ height:4px; border-radius:4px; background:rgba(255,255,255,.08); overflow:hidden; }
.bar i{ display:block; height:100%; background:var(--pc); border-radius:4px; transition:width .5s var(--ease); }
.qrow .side{ flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.qmeta{ font-family:var(--mono); font-size:10px; color:var(--grey-dim); font-variant-numeric:tabular-nums; }
.done{ color:var(--good); }

.swatches{ display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
.sw{ appearance:none; border:1px solid var(--hair); border-radius:13px; background:var(--panel-2); padding:10px 4px 8px;
  cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:7px; transition:border-color .2s, transform .1s, opacity .2s; }
.sw:active{ transform:scale(.95); }
.sw .chip{ width:26px; height:26px; border-radius:50%; box-shadow:0 0 12px -3px currentColor; }
.sw .p{ font-family:var(--mono); font-size:9px; color:var(--grey-dim); display:flex; align-items:center; gap:3px; }
.sw .p svg{ width:9px; height:9px; }
.sw.equipped{ border-color:currentColor; background:var(--panel-3); }
.sw{ position:relative; }
.sw .patprev{ width:30px; height:30px; display:block; }
.sw .alsoworn{ position:absolute; top:3px; right:4px; font-family:var(--mono); font-size:7.5px;
  letter-spacing:.06em; color:var(--grey-dim); text-transform:uppercase; }
.twinnote{ margin:0; font-size:11px; line-height:1.45; color:var(--void); }

/* ---------- confirm ---------- */
.scrim{ position:fixed; inset:0; z-index:60; background:rgba(4,5,8,.74); display:grid; place-items:center;
  padding:24px; animation:scrimIn .16s ease both; }
@keyframes scrimIn{ from{ opacity:0 } }
.dlg{ width:100%; max-width:330px; border:1px solid var(--hair-2); border-radius:18px; background:var(--panel);
  padding:20px 20px 16px; display:flex; flex-direction:column; gap:9px; box-shadow:0 24px 60px rgba(0,0,0,.62);
  animation:dlgIn .24s var(--ease) both; }
@keyframes dlgIn{ from{ opacity:0; transform:translateY(14px) scale(.96) } }
.dlg h3{ margin:0; font-family:var(--mono); font-size:16px; font-weight:700; letter-spacing:-.01em; }
.dlg p{ margin:0; font-size:13px; line-height:1.5; color:var(--grey); }
.dlg .row{ display:flex; gap:9px; margin-top:8px; }
.dlg .row .act{ flex:1 1 0; width:auto; padding:14px 10px; }
.act.warn{ background:var(--void); border-color:var(--void); color:#0A0C11; font-weight:700; }
.act.warn:hover{ filter:brightness(1.07); background:var(--void); }
.sw.taken{ opacity:.32; cursor:not-allowed; }
.sw.locked .chip{ opacity:.35; }

.themerow{ display:flex; flex-direction:column; gap:8px; }
.theme{ display:flex; align-items:center; gap:12px; border:1px solid var(--hair); border-radius:13px; background:var(--panel-2);
  padding:10px 12px; cursor:pointer; transition:border-color .2s, transform .1s; }
.theme:active{ transform:scale(.99); }
.theme.equipped{ border-color:var(--pc); }
.theme .prev{ width:36px; height:36px; flex:none; }
.theme .body{ flex:1 1 auto; display:flex; flex-direction:column; gap:2px; min-width:0; }
.theme .t{ font-size:13px; font-weight:600; }
.theme .d{ font-size:11px; color:var(--grey-dim); }

.pcard{ display:flex; align-items:center; gap:12px; border:1px solid var(--hair); border-radius:14px; background:var(--panel-2); padding:12px; }
.pcard .g{ width:34px; height:34px; flex:none; }
.pcard .body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px; }
.pcard .n{ font-family:var(--mono); font-size:13px; font-weight:700; color:var(--pc); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pcard .s{ font-size:11px; color:var(--grey); font-variant-numeric:tabular-nums; }
.pcard .me{ font-family:var(--mono); font-size:8px; letter-spacing:.14em; color:var(--ink); background:var(--pc); border-radius:4px; padding:2px 5px; }

.chat{ display:flex; flex-direction:column; gap:9px; }
.msgs{ display:flex; flex-direction:column; gap:8px; min-height:80px; max-height:32vh; overflow-y:auto; scrollbar-width:none; }
.msgs::-webkit-scrollbar{ display:none; }
.msg{ max-width:82%; padding:8px 11px; border-radius:14px; font-size:13px; line-height:1.4; overflow-wrap:anywhere; }
.msg.a{ align-self:flex-start; background:var(--panel-2); border:1px solid var(--hair); border-bottom-left-radius:5px; }
.msg.b{ align-self:flex-end; background:color-mix(in srgb, var(--pc) 20%, var(--panel-2)); border:1px solid color-mix(in srgb, var(--pc) 40%, transparent); border-bottom-right-radius:5px; }
.msg .who{ font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--pc); display:block; margin-bottom:3px; }
.msg .tm{ font-family:var(--mono); font-size:9px; color:var(--grey-dim); margin-left:6px; }
.emptychat{ text-align:center; color:var(--grey-dim); font-size:12px; padding:18px 0; }
.composer{ display:flex; gap:8px; align-items:center; }
.composer input{ flex:1 1 auto; min-width:0; background:var(--panel-2); border:1px solid var(--hair); border-radius:12px;
  padding:12px 13px; color:var(--text); font-size:14px; outline:none; transition:border-color .2s; }
.composer input:focus{ border-color:var(--pc); }
.composer input::placeholder{ color:var(--grey-dim); }
.send{ appearance:none; border:0; border-radius:12px; background:var(--pc); color:#0A0C11; width:44px; height:44px; flex:none;
  display:grid; place-items:center; cursor:pointer; transition:transform .1s, opacity .2s; }
.send:active{ transform:scale(.93); }
.send[disabled]{ opacity:.3; cursor:default; }
.send svg{ width:18px; height:18px; }

.field{ display:flex; flex-direction:column; gap:7px; }
.field input{ background:var(--panel-2); border:1px solid var(--hair); border-radius:12px; padding:12px 13px; color:var(--text); font-size:14px; outline:none; transition:border-color .2s; }
.field input:focus{ border-color:var(--pc); }

/* ---------- pass ---------- */

.pass{ align-items:center; justify-content:center; cursor:pointer; text-align:center; }
.pass .glyph{ width:92px; height:92px; margin-bottom:24px; }
.pass .who{ font-family:var(--mono); font-size:clamp(24px,7.5vw,32px); font-weight:700; letter-spacing:-.02em; color:var(--pc); }
.pass .msg{ margin-top:10px; color:var(--grey); font-size:14.5px; max-width:26ch; }
.pass .hint{ margin-top:32px; animation:breathe 2.4s ease-in-out infinite; }
@keyframes breathe{ 50%{ opacity:.35; } }

/* ---------- timer round ---------- */

.timer{ align-items:center; justify-content:space-between; gap:14px; padding-top:6px; }
.target{ text-align:center; display:flex; flex-direction:column; align-items:center; gap:7px; }
.target .val{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:clamp(44px,14vw,58px); font-weight:700; line-height:1; letter-spacing:-.045em; }
.target .val small{ font-size:.4em; font-weight:600; color:var(--grey); margin-left:3px; letter-spacing:0; }

.window{ position:relative; width:100%; height:110px; flex:none; display:grid; place-items:center; border-block:1px solid var(--hair); }
.window::before,.window::after{ content:''; position:absolute; top:0; bottom:0; width:1px; background:var(--hair); }
.window::before{ left:0; } .window::after{ right:0; }
.window .layer{ position:absolute; inset:0; display:grid; place-items:center; padding-inline:18px; }

.live{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:52px; font-weight:600; letter-spacing:-.04em; color:var(--pc);
  transition:opacity .46s var(--ease), filter .46s var(--ease), transform .46s var(--ease); }
.live.gone{ opacity:0; filter:blur(16px); transform:scale(.93); }

.fuse{ position:absolute; left:50%; transform:translateX(-50%); bottom:20px; width:104px; height:2px;
  border-radius:2px; background:rgba(255,255,255,.10); overflow:hidden; opacity:0; transition:opacity .3s; }
.fuse.on{ opacity:1; }
.fuse i{ display:block; height:100%; width:100%; background:var(--pc); border-radius:2px; transform-origin:left center; }

.shutter{ position:absolute; left:0; right:0; height:1px; top:0; background:var(--pc); opacity:0; }
.shutter.run{ animation:sweep .42s var(--ease) forwards; }
@keyframes sweep{ 0%{ opacity:0; top:0 } 16%{ opacity:.95 } 100%{ opacity:0; top:100% } }

.blindmsg{ position:absolute; bottom:11px; left:0; right:0; text-align:center; opacity:0;
  transition:opacity .5s .22s var(--ease), letter-spacing .5s .22s var(--ease); letter-spacing:.05em; }
.blindmsg.on{ opacity:1; letter-spacing:.185em; color:var(--pc); }
.prehint{ position:absolute; bottom:11px; left:0; right:0; text-align:center; transition:opacity .25s; }

.locked{ display:flex; flex-direction:column; align-items:center; gap:10px; animation:screenIn .26s var(--ease) both; }
.locked .tick{ width:34px; height:34px; color:var(--pc); }
.locked .tick path{ fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:32; stroke-dashoffset:32; animation:draw .3s var(--ease) forwards; }

.actuator{ position:relative; flex:none; width:min(58vw,224px); aspect-ratio:1/1; margin-bottom:6px;
  appearance:none; border:0; padding:0; cursor:pointer; border-radius:50%;
  background:radial-gradient(120% 120% at 50% 18%, #232936 0%, #161A24 52%, #0F131B 100%);
  color:var(--pc); display:grid; place-items:center;
  box-shadow:0 1px 0 rgba(255,255,255,.10) inset, 0 -14px 26px rgba(0,0,0,.5) inset,
             0 14px 34px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
  transition:transform .09s var(--ease), box-shadow .09s var(--ease), color .3s; }
.actuator .cap{ position:absolute; inset:13px; border-radius:50%; border:1px solid currentColor; opacity:.34; transition:opacity .2s, transform .3s var(--ease); }
.actuator .cap2{ position:absolute; inset:13px; border-radius:50%; box-shadow:0 0 34px -4px currentColor; opacity:.22; transition:opacity .3s; }
.actuator .txt{ position:relative; font-family:var(--mono); font-size:15px; font-weight:700; letter-spacing:.26em; text-transform:uppercase; text-indent:.26em; }
.actuator:active{ transform:scale(.955) translateY(2px);
  box-shadow:0 2px 3px rgba(255,255,255,.05) inset, 0 -4px 16px rgba(0,0,0,.45) inset, 0 4px 10px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06); }
.actuator:active .cap{ opacity:.75; transform:scale(.97); }
.actuator:focus-visible{ outline:2px solid var(--pc); outline-offset:6px; }
.actuator.running .cap2{ opacity:.42; }
.actuator[disabled]{ cursor:default; color:var(--grey-dim); }
.actuator[disabled] .cap2{ opacity:0; }

/* ---------- reveal ---------- */

.reveal{ justify-content:center; gap:20px; }
.rev-head{ text-align:center; display:flex; flex-direction:column; gap:6px; }
.rev-head .t{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:24px; font-weight:600; letter-spacing:-.02em; }
.cards{ display:grid; grid-template-columns:1fr auto 1fr; align-items:stretch; gap:10px; }
.card{ border:1px solid var(--hair); border-radius:16px; background:var(--panel); padding:15px 10px 14px; text-align:center;
  display:flex; flex-direction:column; gap:8px; align-items:center;
  transition:border-color .4s var(--ease), background .4s var(--ease), transform .45s var(--ease), opacity .45s var(--ease); }
.card .nm{ font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--pc);
  max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card .time{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:clamp(27px,9vw,34px); font-weight:700; letter-spacing:-.04em; line-height:1; }
.card .time.masked{ color:var(--grey-dim); }
.card .off{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:11px; color:var(--grey);
  border:1px solid var(--hair); border-radius:999px; padding:4px 9px; opacity:0; transition:opacity .3s; }
.card .off.on{ opacity:1; }
.card.dim{ opacity:.4; transform:scale(.96); }
.card.hero{ border-color:var(--pc); background:var(--panel-2); transform:scale(1.035); box-shadow:0 0 30px -12px var(--pc); }
.card.shiver{ animation:shiver .9s ease-in-out infinite; }
@keyframes shiver{ 50%{ transform:translateY(-2px); } }
.vs{ display:grid; place-items:center; }
.vs span{ font-family:var(--mono); font-size:9px; letter-spacing:.18em; color:var(--grey-dim); }

.finish{ position:relative; padding:22px 0 26px; }
.finish .axis{ height:1px; background:var(--hair-2); position:relative; }
.finish .zero{ position:absolute; left:50%; top:-13px; bottom:-13px; width:1px; background:var(--text); opacity:.55; }
.finish .bound{ position:absolute; top:-7px; bottom:-7px; width:1px; background:var(--void); opacity:.5; }
.finish .bound.l{ left:0; } .finish .bound.r{ right:0; }
.finish .cap{ position:absolute; top:14px; font-family:var(--mono); font-size:9px; letter-spacing:.14em; color:var(--grey-dim); }
.finish .cap.l{ left:0; } .finish .cap.r{ right:0; }
.finish .cap.c{ left:50%; transform:translateX(-50%); color:var(--grey); }
.finish .pin{ position:absolute; top:-24px; width:2px; height:20px; border-radius:2px; background:var(--pc); transform:translateX(-1px);
  opacity:0; transition:left .62s var(--ease), opacity .3s; box-shadow:0 0 10px -1px var(--pc); }
.finish .pin.p2{ top:4px; }
.finish .pin.on{ opacity:1; }
.finish .pin::after{ content:attr(data-mk); position:absolute; left:50%; transform:translateX(-50%); top:-15px;
  font-family:var(--mono); font-size:10px; font-weight:700; color:var(--pc); }
.finish .pin.p2::after{ top:22px; }

.banner{ min-height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; text-align:center; }
.banner .head{ font-family:var(--mono); font-size:clamp(14px,4.6vw,17px); font-weight:700; letter-spacing:.06em; text-transform:uppercase; animation:screenIn .4s var(--ease) both; }
.banner .sub{ font-size:12.5px; color:var(--grey); animation:screenIn .4s .06s var(--ease) both; }
.dots{ display:flex; gap:7px; }
.dots i{ width:5px; height:5px; border-radius:50%; background:var(--grey-dim); animation:bump 1.05s ease-in-out infinite; }
.dots i:nth-child(2){ animation-delay:.14s; } .dots i:nth-child(3){ animation-delay:.28s; }
@keyframes bump{ 30%{ transform:translateY(-5px); background:var(--text); } }

/* ---------- number duel ---------- */

/* clues group at the top, the input sits under your thumb */
.guess{ justify-content:flex-start; gap:14px; padding-top:2px; }
.guess .entry, .guess .numgrid{ margin-top:auto; }
.guess .entry+.keypad{ margin-top:0; }

.entry{ position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; padding:6px 0 2px; }
.entry .val{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:clamp(46px,15vw,60px); font-weight:700;
  line-height:1; letter-spacing:-.045em; color:var(--pc); min-height:1em; }
.entry .val.empty{ color:var(--grey-dim); }
.entry .note{ font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--grey-dim); min-height:13px; }
.entry .note.bad{ color:var(--void); }
.entry.shake{ animation:shake .3s ease; }
@keyframes shake{ 25%{ transform:translateX(-6px) } 50%{ transform:translateX(6px) } 75%{ transform:translateX(-3px) } }

/* 1..100 deduction scale */
.scale100{ position:relative; height:38px; flex:none; }
.scale100 .track{ position:absolute; left:0; right:0; top:17px; height:3px; border-radius:3px; background:rgba(255,255,255,.09); overflow:hidden; }
.scale100 .band{ position:absolute; top:0; bottom:0; background:var(--good); opacity:.32; transition:left .4s var(--ease), right .4s var(--ease); }
.scale100 .gp{ position:absolute; top:9px; width:2px; height:19px; border-radius:2px; background:currentColor; box-shadow:0 0 7px -1px currentColor; }
.scale100 .ends{ position:absolute; left:0; right:0; top:24px; display:flex; justify-content:space-between;
  font-family:var(--mono); font-size:9px; letter-spacing:.1em; color:var(--grey-dim); }

.hist{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; min-height:26px; align-content:flex-start; }
.gchip{ display:inline-flex; align-items:center; gap:5px; border:1px solid currentColor; border-radius:999px;
  padding:4px 9px; font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:11.5px; font-weight:700;
  background:color-mix(in srgb, currentColor 12%, transparent); animation:screenIn .28s var(--ease) both; }
.gchip .ar{ font-size:10px; opacity:.85; }
.gchip.hit{ background:color-mix(in srgb, currentColor 30%, transparent); }

.keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; flex:none; }
.key{ appearance:none; border:1px solid var(--hair); border-radius:13px; background:var(--panel-2); color:var(--text);
  font-family:var(--mono); font-size:21px; font-weight:600; font-variant-numeric:tabular-nums;
  padding:13px 0; cursor:pointer; transition:transform .08s var(--ease), background .15s, border-color .15s; }
.key:hover{ background:var(--panel-3); }
.key:active{ transform:scale(.93); background:#11141c; border-color:var(--pc); }
.key:focus-visible{ outline:2px solid var(--pc); outline-offset:2px; }
.key.wide{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--grey); }
.key.go{ background:var(--pc); border-color:var(--pc); color:var(--ink); font-size:11px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; }
.key.go[disabled]{ opacity:.28; }
.key[disabled]{ cursor:default; }

.verdict{ justify-content:center; align-items:center; text-align:center; cursor:pointer; gap:0; }
.verdict .arrowbox{ width:78px; height:78px; display:grid; place-items:center; border-radius:50%;
  border:1px solid currentColor; margin-bottom:20px; animation:pop .42s var(--ease) both; }
.verdict .arrowbox svg{ width:38px; height:38px; }
@keyframes pop{ from{ transform:scale(.6); opacity:0 } }
.verdict .big{ font-family:var(--mono); font-size:clamp(26px,8.5vw,36px); font-weight:700; letter-spacing:.02em; text-transform:uppercase; }
.verdict .sub{ margin-top:10px; color:var(--grey); font-size:14px; max-width:28ch; }
.verdict .hint{ margin-top:30px; animation:breathe 2.4s ease-in-out infinite; }

/* ---------- place / over ---------- */

.place,.over{ justify-content:center; gap:22px; }
.place .head,.over .head{ text-align:center; display:flex; flex-direction:column; gap:7px; }
.place .who{ font-family:var(--mono); font-size:clamp(19px,6vw,24px); font-weight:700; color:var(--pc); }
.place .sub,.over .sub{ font-size:13.5px; color:var(--grey); }
.over .who{ font-family:var(--mono); font-size:clamp(25px,8vw,34px); font-weight:700; letter-spacing:-.03em; color:var(--pc); }
.series{ display:flex; align-items:center; justify-content:center; gap:16px; font-family:var(--mono); font-variant-numeric:tabular-nums; }
.series .sc{ font-size:26px; font-weight:600; }
.series .vlabel{ font-size:10px; letter-spacing:.2em; color:var(--grey-dim); }
.foot{ display:flex; flex-direction:column; gap:10px; flex:none; padding-top:12px; }
.footrow{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.footrow .act{ padding:15px 12px; font-size:11px; letter-spacing:.13em; gap:8px; color:var(--grey); }
.footrow .act svg{ width:15px; height:15px; }
.footrow .act:hover{ color:var(--text); }

/* ---------- toast ---------- */

#toasts{ position:fixed; left:0; right:0; top:calc(env(safe-area-inset-top) + 58px); z-index:40; display:flex; flex-direction:column; align-items:center; gap:7px; pointer-events:none; }
.toast{ display:flex; align-items:center; gap:8px; background:var(--panel-3); border:1px solid var(--hair-2); border-radius:999px;
  padding:8px 14px; font-family:var(--mono); font-size:11.5px; font-weight:600; color:var(--coin);
  box-shadow:0 8px 24px rgba(0,0,0,.5); animation:toastIn .3s var(--ease) both, toastOut .35s 1.9s var(--ease) forwards; }
.toast .r{ color:var(--grey); font-weight:500; }
.toast svg{ width:13px; height:13px; }
@keyframes toastIn{ from{ opacity:0; transform:translateY(-12px) scale(.94) } }
@keyframes toastOut{ to{ opacity:0; transform:translateY(-10px) scale(.97) } }

/* ---------- bid-tac-toe ---------- */

.bidscreen{ gap:12px; justify-content:flex-start; }

/* the bid dial: drag for the ballpark, step for the exact number */
.bidctl{ display:flex; flex-direction:column; gap:12px; flex:none; }
.bidval{ display:flex; align-items:center; justify-content:center; gap:16px; }
.bidval .v{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:clamp(42px,14vw,56px);
  font-weight:700; letter-spacing:-.045em; line-height:1; color:var(--pc); min-width:2.4ch; text-align:center; }
.bidval .rnd{ appearance:none; width:46px; height:46px; border-radius:14px; border:1px solid var(--hair);
  background:var(--panel-2); color:var(--text); font-family:var(--mono); font-size:22px; cursor:pointer;
  display:grid; place-items:center; transition:transform .1s, border-color .2s, background .2s; }
.bidval .rnd:active{ transform:scale(.92); border-color:var(--pc); background:var(--panel-3); }
.bidval .rnd[disabled]{ opacity:.3; cursor:default; }
.slider{ -webkit-appearance:none; appearance:none; width:100%; height:30px; background:transparent;
  cursor:pointer; display:block; margin:0; }
.slider:focus{ outline:none; }
.slider::-webkit-slider-runnable-track{ height:7px; border-radius:7px;
  background:linear-gradient(90deg, var(--pc) var(--f,0%), rgba(255,255,255,.10) var(--f,0%)); }
.slider::-webkit-slider-thumb{ -webkit-appearance:none; width:28px; height:28px; margin-top:-10.5px;
  border-radius:50%; background:var(--pc); border:4px solid var(--ink); box-shadow:0 3px 10px rgba(0,0,0,.55); }
.slider::-moz-range-track{ height:7px; border-radius:7px; background:rgba(255,255,255,.10); }
.slider::-moz-range-progress{ height:7px; border-radius:7px; background:var(--pc); }
.slider::-moz-range-thumb{ width:22px; height:22px; border-radius:50%; background:var(--pc);
  border:4px solid var(--ink); box-shadow:0 3px 10px rgba(0,0,0,.55); }
.chips{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.chip{ appearance:none; border:1px solid var(--hair); border-radius:12px; background:var(--panel-2);
  color:var(--grey); font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.11em;
  text-transform:uppercase; padding:11px 4px; cursor:pointer;
  transition:transform .1s, border-color .2s, color .2s; }
.chip:hover{ color:var(--text); }
.chip:active{ transform:scale(.95); border-color:var(--pc); color:var(--pc); }
.bidhint{ text-align:center; font-family:var(--mono); font-size:10px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--grey-dim); min-height:12px; }

.board.ttt.md{ width:100%; max-width:min(80vw,310px); gap:9px; margin-inline:auto; }
.board.ttt.md .cell{ border-radius:12px; }
/* needs to out-rank `.board.ttt .cell`, hence the long selector */
.board.ttt .cell.bidcell{ border-color:var(--pc); background:color-mix(in srgb, var(--pc) 16%, var(--panel));
  animation:bidPulse 1.9s ease-in-out infinite; }
@keyframes bidPulse{
  0%,100%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--pc) 30%, transparent); }
  50%{ box-shadow:0 0 0 5px color-mix(in srgb, var(--pc) 0%, transparent); } }
.squp{ text-align:center; display:flex; flex-direction:column; gap:4px; flex:none; }
.squp .n{ font-family:var(--mono); font-size:15px; font-weight:700; color:var(--pc); }

/* the toss: names flick past, then one lands */
.draw{ align-items:center; justify-content:center; text-align:center; }
.drawslot{ font-family:var(--mono); font-size:clamp(28px,9.5vw,42px); font-weight:700; letter-spacing:-.025em;
  line-height:1.15; margin-top:16px; min-height:1.2em; color:var(--pc); }
.drawslot.flick{ animation:flick .09s var(--ease) both; }
@keyframes flick{ from{ opacity:.25; transform:translateY(-5px) } }
.drawslot.settled{ animation:pop .46s var(--ease) both; }
.draw .goes{ margin-top:12px; opacity:0; transform:translateY(6px);
  transition:opacity .45s var(--ease), transform .45s var(--ease); }
.draw .goes.on{ opacity:1; transform:none; }
.draw .glyph{ width:74px; height:74px; opacity:0; transition:opacity .4s; }
.draw .glyph.on{ opacity:1; }

/* choosing which square goes up for bid */
.board.ttt .cell.pickable{ cursor:pointer; }

.bidlog{ display:flex; flex-direction:column; gap:5px; max-height:21vh; overflow-y:auto;
  scrollbar-width:none; flex:none; }

.blrow{ display:flex; align-items:center; gap:9px; padding:6px 10px; border:1px solid var(--hair);

.blrow .sq{ flex:1 1 auto; color:var(--grey); font-size:10.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.blrow .b{ font-variant-numeric:tabular-nums; font-weight:700; min-width:2.4ch; text-align:right; }
.blrow .vs{ color:var(--grey-dim); font-size:9px; }
.blrow .w{ font-size:9px; letter-spacing:.1em; text-transform:uppercase; min-width:6ch; text-align:right; }

.card.pop{ animation:cardPop .5s var(--ease) both; }
@keyframes cardPop{ 0%{ transform:rotateX(-86deg) scale(.94); opacity:0 }

.card.burstfx::after{ content:''; position:absolute; inset:-8px; border-radius:22px; pointer-events:none;
  background:radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--pc) 50%, transparent), transparent 66%);
  animation:burstOut .85s var(--ease) forwards; }
@keyframes burstOut{ from{ transform:scale(.55); opacity:.95 } to{ transform:scale(1.55); opacity:0 } }
.sealed{ font-family:var(--mono); font-size:34px; font-weight:700; color:var(--grey-dim); letter-spacing:.1em; }

/* ---------- auto-advance ---------- */

.autoline{ position:relative; height:2px; width:104px; margin-inline:auto; border-radius:2px;
  background:rgba(255,255,255,.09); overflow:hidden; flex:none; }
.autoline i{ display:block; height:100%; background:var(--pc); transform-origin:left center;
  animation:autorun var(--dur,1.6s) linear forwards; }
@keyframes autorun{ from{ transform:scaleX(1) } to{ transform:scaleX(0) } }

/* ---------- player bar: who is up, and how long they have ---------- */

.pbar{ display:grid; grid-template-columns:1fr 1fr; gap:8px; flex:none; }
.pchip{ position:relative; overflow:hidden; display:flex; align-items:center; gap:9px;
  border:1px solid var(--hair); border-radius:14px; background:var(--panel); padding:9px 11px 11px;
  opacity:.45; transition:opacity .25s var(--ease), border-color .25s, background .25s; }
.pchip.on{ opacity:1; border-color:var(--pc); background:var(--panel-2); }
.pchip .mk{ width:15px; height:15px; flex:none; color:var(--pc); display:block; }
.pchip .col{ display:flex; flex-direction:column; gap:2px; min-width:0; flex:1 1 auto; }
.pchip .nm{ font-family:var(--mono); font-size:11px; font-weight:700; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; }
.pchip .sub{ font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; color:var(--grey-dim);
  font-variant-numeric:tabular-nums; }
.pchip .big{ font-family:var(--mono); font-size:20px; font-weight:700; line-height:1; color:var(--pc);
  font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
.pchip .big small{ font-size:.44em; font-weight:600; color:var(--grey-dim); margin-left:3px; letter-spacing:.1em; }
.pchip .secs{ font-family:var(--mono); font-size:12px; font-weight:700; color:var(--void);
  font-variant-numeric:tabular-nums; opacity:0; transition:opacity .25s; flex:none; }
.pchip .secs.show{ opacity:1; }
.tk{ position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(255,255,255,.08); }
.tk i{ display:block; height:100%; width:100%; background:var(--pc); transform-origin:left center; }
.tk.warn i{ background:var(--void); }

/* ---------- classic board play ---------- */

.classic{ justify-content:center; gap:16px; }
.statusline{ min-height:16px; text-align:center; display:flex; align-items:center; justify-content:center; gap:8px; }
.statusline .dots i{ width:4px; height:4px; }

/* ---------- connect 4 drop layer ---------- */

.disc.thud{ transform-origin:50% 100%; animation:thud .32s var(--ease) both; }
@keyframes thud{
  0%{   transform:translateY(-30%) scale(.93,1.1); }
  44%{  transform:translateY(0) scale(1.14,.79); }
  70%{  transform:translateY(-9%) scale(.97,1.06); }
  88%{  transform:translateY(0) scale(1.05,.95); }
  100%{ transform:translateY(0) scale(1,1); } }
.board.c4 .cell.landed{ animation:landFlash .55s var(--ease); }
@keyframes landFlash{

/* ---------- sheet (history) ---------- */

#sheet{ position:fixed; inset:0; z-index:60; display:flex; flex-direction:column; justify-content:flex-end; }
#sheet .scrim{ position:absolute; inset:0; background:rgba(4,6,10,.74); animation:fadeIn .25s var(--ease) both; }
@keyframes fadeIn{ from{ opacity:0 } }
#sheet .body{ position:relative; width:100%; max-width:560px; margin-inline:auto; background:var(--panel);
  border:1px solid var(--hair); border-bottom:0; border-radius:20px 20px 0 0; max-height:84%;

@keyframes sheetIn{ from{ transform:translateY(26px); opacity:0 } }
#sheet .head{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex:none; padding-bottom:12px; }
#sheet .scroll{ overflow-y:auto; scrollbar-width:none; display:flex; flex-direction:column; gap:9px; }
#sheet .scroll::-webkit-scrollbar{ display:none; }

#sheet .head .ttl{ font-family:var(--mono); font-size:15px; font-weight:700; letter-spacing:-.01em; display:block; }

.segmented{ display:grid; grid-template-columns:1fr 1fr; gap:3px; padding:3px; border-radius:13px;

/* one history row: who took it, what happened, and the board as it stood */
.hrow{ display:flex; align-items:center; gap:11px; width:100%; text-align:left; padding:11px 12px;

  color:var(--text); appearance:none; }

.emptylog{ text-align:center; padding:30px 12px; display:flex; flex-direction:column; gap:6px; }

.hsummary{ display:flex; align-items:center; gap:14px; padding:13px 14px; border:1px solid var(--hair);
  border-radius:15px; background:var(--panel-2); }
.hsummary .body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:5px; }
.hsummary .big2{ font-family:var(--mono); font-size:14px; font-weight:700; }
.hsummary .d{ font-size:11.5px; color:var(--grey-dim); }

/* ---------- setup extras ---------- */

.grouplbl{ display:flex; align-items:center; gap:9px; }
.grouplbl::after{ content:''; flex:1 1 auto; height:1px; background:var(--hair); }
.choice.wide{ flex-direction:row; align-items:center; gap:11px; padding:11px 12px; }
.choice.wide .art{ width:42px; height:34px; flex:none; }
.choice.wide .txt{ display:flex; flex-direction:column; gap:3px; min-width:0; }
.opts{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.opt{ appearance:none; cursor:pointer; border:1px solid var(--hair); border-radius:13px; background:var(--panel);
  color:var(--text); padding:11px 12px; display:flex; flex-direction:column; gap:3px; text-align:left;
  transition:border-color .2s, background .2s, transform .1s; }
.opt:active{ transform:scale(.98); }
.opt.on{ border-color:var(--pc); background:var(--panel-2); }
.opt .t{ font-family:var(--mono); font-size:12px; font-weight:700; }
.opt .d{ font-size:10.5px; color:var(--grey-dim); }
.stepper{ display:flex; align-items:center; justify-content:center; gap:14px; }

.stepper .rnd{ appearance:none; width:42px; height:42px; border-radius:12px; border:1px solid var(--hair);

/* ---------- number pads ---------- */

.numgrid{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; flex:none; }
.numgrid .key{ padding:16px 0; font-size:20px; }
.numgrid .key.used{ opacity:.28; }
.turnflash{ display:flex; flex-direction:column; align-items:center; gap:5px; min-height:44px; justify-content:center; }
.turnflash .big2{ font-family:var(--mono); font-size:15px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
.turnflash .sub2{ font-size:12px; color:var(--grey); }
.gchip.mine{ box-shadow:0 0 0 1px currentColor inset; }

/* the two most recent guesses carry the deduction, so they get the room */
.recentrow{ display:flex; gap:9px; justify-content:center; align-items:flex-end; flex:none; }
.gbig{ display:flex; flex-direction:column; align-items:center; gap:3px; border:1px solid currentColor;
  border-radius:15px; padding:8px 15px; min-width:70px; background:color-mix(in srgb,currentColor 17%,transparent);
  animation:screenIn .3s var(--ease) both; }
.gbig.prev{ opacity:.55; transform:scale(.86); transform-origin:bottom center; }
.gbig .n{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:24px; font-weight:700; line-height:1; letter-spacing:-.03em; }
.gbig .r{ font-family:var(--mono); font-size:8.5px; letter-spacing:.13em; text-transform:uppercase; opacity:.9; }
.gbig .w{ font-family:var(--mono); font-size:8px; letter-spacing:.1em; text-transform:uppercase; color:var(--grey-dim);
  max-width:9ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rangeline{ text-align:center; font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:13px; font-weight:700; color:var(--good); flex:none; }
.rangeline small{ display:block; margin-bottom:2px; font-size:9px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--grey-dim); font-weight:600; }
.key.ruled{ opacity:.22; }

/* ---------- sequence race ---------- */
.seqscreen{ gap:14px; justify-content:flex-start; }
.seqrow{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; flex:none; }
.seqslot{ appearance:none; border:1px solid var(--hair); border-radius:17px; background:var(--panel);

@keyframes seqSwap{ 0%{ transform:scale(.82) } 60%{ transform:scale(1.08) } 100%{ transform:none } }
.seqshape{ display:block; width:100%; height:100%; filter:drop-shadow(0 2px 4px rgba(0,0,0,.45)); }
.seqpos{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; flex:none; }
.seqpos span{ text-align:center; font-family:var(--mono); font-size:9px; letter-spacing:.14em; color:var(--grey-dim); }
.seqstats{ display:grid; grid-template-columns:1fr 1fr; gap:9px; flex:none; }
.seqstat{ border:1px solid var(--hair); border-radius:13px; background:var(--panel-2); padding:9px 10px;
  display:flex; flex-direction:column; gap:3px; }
.seqstat .k{ font-family:var(--mono); font-size:8.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--grey-dim); }
.seqstat .v{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:16px; font-weight:700; }
.seqhint{ text-align:center; font-family:var(--mono); font-size:10px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--grey-dim); flex:none; }
.seqbig{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:clamp(46px,15vw,64px);
  font-weight:700; line-height:1; letter-spacing:-.04em; animation:seqPop .34s var(--ease) both; }
@keyframes seqPop{ 0%{ transform:scale(.6); opacity:0 } 62%{ transform:scale(1.14) } 100%{ transform:none; opacity:1 } }
.seqreveal{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.seqreveal .cell{ border:1px solid var(--hair); border-radius:12px; background:var(--panel-2);
  aspect-ratio:1/1; display:grid; place-items:center; padding:16%; }

var KEY="duelboard.v1", DB=null, memOnly=false;
function today(){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }

function freshPlayer(i){
  return { name:"Player "+(i+1), color:COLORS[i].id, pattern:"solid", terrain:"default", coins:0,
           owned:[COLORS[0].id,COLORS[1].id], ownedPat:["solid"], ownedTer:["default"],
           stats:{ matches:0, wins:0, roundsWon:0, best:null, bestGuess:null, streak:0, bestStreak:0 },
           q:{}, claimed:{} };
}
function freshDB(){
  return { v:3, players:[freshPlayer(0),freshPlayer(1)], me:0,
           chat:[], day:today(), series:[0,0], history:[],
           lastGame:"dtimer", lastBoard:"ttt", lastOpp:"friend", lastTap:null, lastPool:24, lastHome:0 };
}
function load(){
  try{ var raw=localStorage.getItem(KEY); DB=raw?JSON.parse(raw):freshDB(); }
  catch(e){ memOnly=true; DB=freshDB(); }
  var f=freshDB();
  if(!DB||typeof DB!=="object") DB=f;
  if(!Array.isArray(DB.players)||DB.players.length!==2) DB.players=f.players;
  DB.players.forEach(function(p,i){
    var d=freshPlayer(i);
    if(typeof p.name!=="string"||!p.name.trim()) p.name=d.name;
    if(!COLORS.some(function(c){return c.id===p.color;})) p.color=d.color;
    if(typeof p.coins!=="number"||!isFinite(p.coins)) p.coins=0;
    if(!Array.isArray(p.owned)) p.owned=d.owned;
    if(!Array.isArray(p.ownedPat)) p.ownedPat=d.ownedPat;
    if(!Array.isArray(p.ownedTer)) p.ownedTer=d.ownedTer;
    if(!PATTERNS.some(function(x){return x.id===p.pattern;})) p.pattern=d.pattern;
    if(!TERRAINS.some(function(x){return x.id===p.terrain;})) p.terrain=d.terrain;
    p.stats=Object.assign(d.stats,p.stats||{});
    if(!p.q) p.q={}; if(!p.claimed) p.claimed={};
  });
  /* v2 kept one shared board style; terrains belong to players now, so hand the
     old unlocks to both of them rather than quietly repossessing them */
  if(DB.shared&&Array.isArray(DB.shared.themes)){
    DB.players.forEach(function(p){
      DB.shared.themes.forEach(function(t){ if(TERRAINS.some(function(x){return x.id===t;})&&p.ownedTer.indexOf(t)<0) p.ownedTer.push(t); });
      if(TERRAINS.some(function(x){return x.id===DB.shared.theme;})) p.terrain=DB.shared.theme;
    });
    delete DB.shared;
  }
  if(DB.lastHome!==0&&DB.lastHome!==1) DB.lastHome=0;
  if(!Array.isArray(DB.chat)) DB.chat=[];
  if(!Array.isArray(DB.series)) DB.series=[0,0];
  if(!Array.isArray(DB.history)) DB.history=[];
  if(DB.history.length>14) DB.history=DB.history.slice(0,14);
  if(DB.me!==0&&DB.me!==1) DB.me=0;
  /* v1 stored a mode id; the catalogue replaced it with a game id */
  if(!GAMES[DB.lastGame]) DB.lastGame=(DB.lastMode==="number")?"dnumber":"dtimer";
  if(DB.lastOpp!=="bot"&&DB.lastOpp!=="friend") DB.lastOpp="friend";
  if(typeof DB.lastTap!=="number"||!isFinite(DB.lastTap)) DB.lastTap=null;
  if(typeof DB.lastPool!=="number"||!isFinite(DB.lastPool)) DB.lastPool=BID_POOL;
  DB.lastPool=Math.min(BID_MAX,Math.max(BID_MIN,Math.round(DB.lastPool)));
  if(!BOARDS[DB.lastBoard]) DB.lastBoard="ttt";
  if(DB.day!==today()){ DB.day=today(); DB.players.forEach(function(p){ p.q={}; p.claimed={}; }); }
  save();
}
function save(){ if(memOnly) return; try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){ memOnly=true; } }

function P(i){ return DB.players[i]; }
/* the bot borrows player 2's slot for colour and mark, never for name or progress */
function isBot(i){ return G.vsBot&&i===G.bot; }
function pname(i){ return isBot(i)?"Bot":P(i).name; }
function pmark(i){ return i===0?"X":"O"; }
function phexRaw(i){ var c=COLORS.filter(function(c){return c.id===P(i).color;})[0]; return c?c.hex:COLORS[i].hex; }
/* Two players are allowed to wear the same colour now. When they do, the second
   one is shifted and ringed so the pieces still read apart at a glance. */
function twinned(){ return phexRaw(0)===phexRaw(1); }
function phex(i){ return (i===1&&twinned()) ? shade(phexRaw(i),-0.30) : phexRaw(i); }
function shade(hex,amt){
  var n=parseInt(hex.slice(1),16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  var f=function(v){ return Math.max(0,Math.min(255,Math.round(amt<0 ? v*(1+amt) : v+(255-v)*amt))); };
  return "#"+((1<<24)+(f(r)<<16)+(f(g)<<8)+f(b)).toString(16).slice(1);
}
function ppat(i){ return P(i).pattern||"solid"; }
function terrainOf(i){ var t=TERRAINS.filter(function(x){return x.id===P(i).terrain;})[0]; return t||TERRAINS[0]; }
/* whose ground the match is played on */
function homeTerrain(){ return terrainOf(typeof G.home==="number"?G.home:0); }

/* The design inside a filled piece. Drawn as a dark overlay so it works on any
   hue, in a 100x100 box centred on the piece. */
function patternSVG(pid,ring){
  var d='rgba(0,0,0,.36)', s="";
  if(pid==="ring")      s='<circle cx="50" cy="50" r="30" fill="none" stroke="'+d+'" stroke-width="8"/>';
  else if(pid==="core") s='<circle cx="50" cy="50" r="16" fill="'+d+'"/>';
  else if(pid==="halo") s='<circle cx="50" cy="50" r="34" fill="none" stroke="'+d+'" stroke-width="5"/>'
                        + '<circle cx="50" cy="50" r="18" fill="none" stroke="'+d+'" stroke-width="5"/>';
  else if(pid==="quad") s='<path d="M50 50 L50 6 A44 44 0 0 1 94 50 Z" fill="'+d+'"/>'
                        + '<path d="M50 50 L50 94 A44 44 0 0 1 6 50 Z" fill="'+d+'"/>';
  else if(pid==="orbit")s='<circle cx="50" cy="50" r="31" fill="none" stroke="'+d+'" stroke-width="5"/>'
                        + '<circle cx="50" cy="19" r="9" fill="'+d+'"/>';
  else if(pid==="star") s='<path d="M50 14 L60 40 L88 42 L66 60 L74 88 L50 72 L26 88 L34 60 L12 42 L40 40 Z" fill="'+d+'"/>';
  else if(pid==="bars") s='<rect x="20" y="34" width="60" height="8" rx="4" fill="'+d+'"/>'
                        + '<rect x="26" y="46" width="48" height="8" rx="4" fill="'+d+'"/>'
                        + '<rect x="34" y="58" width="32" height="8" rx="4" fill="'+d+'"/>';
  /* the twin marker: a hard rim the other player never has */
  if(ring) s+='<circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,.72)" stroke-width="4"/>';
  return s;
}
/* a Connect 4 piece, pattern and all */
function discSVG(i,cls){
  return '<svg class="disc'+(cls?" "+cls:"")+'" viewBox="0 0 100 100" style="color:'+phex(i)+'" aria-hidden="true">'
    + '<circle cx="50" cy="50" r="47" fill="currentColor"/>'
    + patternSVG(ppat(i), i===1&&twinned()) + "</svg>";
}
function hexA(hex,a){ var n=parseInt(hex.slice(1),16); return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")"; }

var pending=[], frames=[];
function later(fn,ms){ var id=setTimeout(fn,ms); pending.push(id); return id; }
function frame(fn){ var id=requestAnimationFrame(fn); frames.push(id); return id; }
function haltAll(){ pending.forEach(clearTimeout); pending.length=0; frames.forEach(cancelAnimationFrame); frames.length=0; }

var sfx=(function(){

    if(!ctx){ var A=window.AudioContext||window.webkitAudioContext; if(!A) return null;

    if(ctx.state==="suspended") ctx.resume();

  }
  function osc(o){
    var c=C(); if(!c||muted) return;
    var t=c.currentTime+(o.at||0), a=o.a||.006, d=o.d||.2, v=o.v||.2;
    var n=c.createOscillator(); n.type=o.type||"sine"; n.frequency.setValueAtTime(o.f,t);
    if(o.f2) n.frequency.exponentialRampToValueAtTime(Math.max(1,o.f2),t+a+d);
    var g=c.createGain();
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+d);
    n.connect(g); g.connect(c.destination); n.start(t); n.stop(t+a+d+.03);
  }
  function noise(o){
    var c=C(); if(!c||muted) return;
    var t=c.currentTime+(o.at||0), d=o.d||.05, v=o.v||.18;
    var len=Math.ceil(c.sampleRate*(d+.02)), buf=c.createBuffer(1,len,c.sampleRate), dat=buf.getChannelData(0);
    for(var i=0;i<len;i++) dat[i]=Math.random()*2-1;
    var s=c.createBufferSource(); s.buffer=buf;
    var f=c.createBiquadFilter(); f.type="highpass"; f.frequency.value=o.hp||900;
    var g=c.createGain(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f); f.connect(g); g.connect(c.destination); s.start(t); s.stop(t+d+.02);
  }

    warm:function(){ C(); }, isMuted:function(){ return muted; },
    toggle:function(){ muted=!muted; if(!muted){ C(); this.tap(); } return muted; },
    tap:function(){ osc({f:520,f2:660,d:.07,v:.10,type:"triangle"}); },
    key:function(){ osc({f:640,d:.035,v:.09,type:"square"}); },
    start:function(){ osc({f:400,f2:620,d:.10,v:.13}); },
    warn:function(){ osc({f:660,d:.06,v:.07,type:"triangle"}); },
    stop:function(){ osc({f:196,f2:58,d:.22,v:.34}); osc({f:880,f2:290,d:.055,v:.10,type:"triangle"}); noise({d:.042,v:.16,hp:1600}); },
    ping:function(i){ osc({f:i?700:540,d:.19,v:.15,type:"triangle"}); },
    tense:function(){ for(var k=0;k<3;k++) osc({f:112,at:k*.26,d:.15,v:.11}); },
    higher:function(){ osc({f:420,f2:700,d:.2,v:.16,type:"triangle"}); },
    lower:function(){ osc({f:700,f2:380,d:.2,v:.16,type:"triangle"}); },
    win:function(){ [523,659,784].forEach(function(f,i){ osc({f:f,at:i*.075,d:.32,v:.17,type:"triangle"}); }); },
    tie:function(){ osc({f:466,d:.13,v:.14}); osc({f:466,at:.17,d:.13,v:.14}); },
    voided:function(){ osc({f:300,f2:110,d:.32,v:.13,type:"sawtooth"}); },
    place:function(){ osc({f:300,f2:540,d:.09,v:.18}); noise({d:.03,v:.08,hp:2200}); },
    landc4:function(){ osc({f:150,f2:70,d:.16,v:.3}); noise({d:.05,v:.14,hp:800}); },
    game:function(){ [523,659,784,1047].forEach(function(f,i){ osc({f:f,at:i*.1,d:.45,v:.19,type:"triangle"}); }); },
    draw:function(){ osc({f:420,f2:320,d:.4,v:.14}); },
    coin:function(){ osc({f:1050,d:.09,v:.13,type:"triangle"}); osc({f:1560,at:.06,d:.12,v:.10,type:"triangle"}); },
    buy:function(){ osc({f:620,f2:940,d:.16,v:.16,type:"triangle"}); noise({d:.03,v:.06,hp:2400}); },
    nope:function(){ osc({f:180,f2:120,d:.18,v:.14,type:"sawtooth"}); },
    msg:function(){ osc({f:760,f2:900,d:.08,v:.10,type:"triangle"}); },
    seal:function(){ osc({f:320,f2:170,d:.13,v:.17,type:"triangle"}); noise({d:.04,v:.09,hp:1200}); },
    flip:function(){ osc({f:480,f2:900,d:.13,v:.16,type:"triangle"}); noise({d:.03,v:.07,hp:2000}); },
    burst:function(){ osc({f:170,f2:520,d:.3,v:.18,type:"sawtooth"});

/* `who` opts the piece into that player's design; omit it for a plain glyph */
function markMotif(pid,ring){
  var s="";
  if(pid==="ring")      s='<circle class="st" cx="50" cy="50" r="13"/>';
  else if(pid==="core") s='<circle cx="50" cy="50" r="8"/>';
  else if(pid==="halo") s='<circle class="st" cx="50" cy="50" r="15"/><circle cx="50" cy="50" r="5"/>';
  else if(pid==="quad") s='<path d="M50 50 L50 32 A18 18 0 0 1 68 50 Z"/><path d="M50 50 L50 68 A18 18 0 0 1 32 50 Z"/>';
  else if(pid==="orbit")s='<circle cx="50" cy="33" r="6"/>';
  else if(pid==="star") s='<path d="M50 33 L54 44 L66 45 L57 52 L60 64 L50 57 L40 64 L43 52 L34 45 L46 44 Z"/>';
  else if(pid==="bars") s='<rect x="37" y="44" width="26" height="5" rx="2.5"/><rect x="41" y="53" width="18" height="5" rx="2.5"/>';
  if(ring) s+='<circle class="tw" cx="50" cy="50" r="41"/>';
  return s ? '<g class="mo">'+s+"</g>" : "";
}
function markSVG(m,animate,who){
  var cls="mk mk-"+m.toLowerCase()+(animate?" anim":"");

    + '<line class="s1" x1="24" y1="24" x2="76" y2="76"/><line class="s2" x1="76" y1="24" x2="24" y2="76"/></svg>';

/* ============================================================
   Match state + board engine
   ============================================================ */

var G={ game:"dtimer", kind:"duel", mode:"timer", board:"ttt", vsBot:false, bot:-1,
        cells:[], lastPlaced:-1, inFlight:-1, first:0, result:null, turn:0, log:[], round:1, score:[0,0],
        /* timer */ turnIdx:0, target:0, tapTarget:null, times:[null,null], devs:[null,null],
                    outcome:null, winner:null, replay:null,
        /* number */ secret:0, hi:100, cap:14, guesses:[], entry:"", lastVerdict:null,
        /* bid */ pool:24, bal:[24,24], bids:[null,null], bidLog:[], bidSquare:-1, bidChooser:-1, passRun:0 };

function B(){ return BOARDS[G.board]; }
function hasBoard(){ return G.kind==="board"||G.kind==="duel"||G.kind==="bid"; }
function idx(r,c){ return r*B().cols+c; }
function marksOn(){ return G.cells.filter(Boolean).length; }
function boardFull(){ return G.cells.every(Boolean); }
function dropRow(col){ var b=B(); for(var r=b.rows-1;r>=0;r--) if(!G.cells[idx(r,col)]) return r; return -1; }

/* generic n-in-a-row over the whole grid - serves 3-in-a-row and 4-in-a-row alike */
function judgeOn(cells,b){
  var dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(var r=0;r<b.rows;r++) for(var c=0;c<b.cols;c++){
    var v=cells[r*b.cols+c]; if(!v) continue;
    for(var d=0;d<4;d++){
      var dr=dirs[d][0], dc=dirs[d][1], line=[r*b.cols+c], ok=true;
      for(var k=1;k<b.need;k++){
        var rr=r+dr*k, cc=c+dc*k;
        if(rr<0||rr>=b.rows||cc<0||cc>=b.cols||cells[rr*b.cols+cc]!==v){ ok=false; break; }
        line.push(rr*b.cols+cc);
      }
      if(ok) return { winner:v==="X"?0:1, line:line };
    }
  }
  if(cells.every(Boolean)) return { winner:null, line:null };
  return null;
}
function judge(){ return judgeOn(G.cells,B()); }

function winLineSVG(){
  if(!G.result||!G.result.line) return "";
  var b=B(), L=G.result.line, U=10;
  var cx=function(i){ return ((i%b.cols)+0.5)*U; }, cy=function(i){ return (Math.floor(i/b.cols)+0.5)*U; };
  var x1=cx(L[0]), y1=cy(L[0]), x2=cx(L[L.length-1]), y2=cy(L[L.length-1]);
  var dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1, ex=dx/len*(U*0.34), ey=dy/len*(U*0.34);
  return '<svg class="winline" viewBox="0 0 '+(b.cols*U)+" "+(b.rows*U)+'" aria-hidden="true">'
       + '<line x1="'+(x1-ex)+'" y1="'+(y1-ey)+'" x2="'+(x2+ex)+'" y2="'+(y2+ey)+'" stroke-width="'+(b.id==="c4"?1.1:1.5)+'"/></svg>';
}

/* live = player index allowed to act, or null for display-only */
function boardHTML(size,live){
  return G.board==="c4" ? c4HTML(size,live) : tttHTML(size,live);
}
function tttHTML(size,live){
  var mark=(live===null||live===undefined)?null:pmark(live);
  var cells=G.cells.map(function(v,i){
    var isWin=G.result&&G.result.line&&G.result.line.indexOf(i)>-1;
    var open=!v&&mark;
    var who=v?(v==="X"?0:1):live;
    var col=v?phex(v==="X"?0:1):(mark?phex(live):null);
    var inner=v?'<span style="color:'+col+';display:block;width:100%;height:100%">'+markSVG(v,i===G.lastPlaced,who)+"</span>"
              :(open?'<span class="ghost" style="color:'+col+'">'+markSVG(mark,false,who)+"</span>":"");
    return '<button type="button" class="cell'+(open?" live":"")+(isWin?" wincell":"")+'" data-i="'+i+'"'+(open?"":" disabled")
         + ' aria-label="Square '+(i+1)+(v?", "+v:", empty")+'"><span class="pad">'+inner+"</span></button>";
  }).join("");
  return '<div class="board ttt '+size+'" style="'+terrainVars()+'" role="group" aria-label="Board">'+cells+winLineSVG()+"</div>";
}
function terrainVars(){
  var t=homeTerrain();
  return "--frame:"+t.frame+";--well:"+t.well+";--rad:"+t.rad+"px;";
}
function c4HTML(size,live){
  var b=B(), playable=(live!==null&&live!==undefined);
  /* a piece mid-flight is drawn by the falling layer instead of its cell */
  var cells=G.cells.map(function(v,i){
    var isWin=G.result&&G.result.line&&G.result.line.indexOf(i)>-1;
    var inner=(v&&i!==G.inFlight) ? discSVG(v==="X"?0:1) : "";
    return '<div class="cell'+(isWin?" wincell":"")+'" data-i="'+i+'">'+inner+"</div>";
  }).join("");
  var cols="";
  if(playable){
    for(var c=0;c<b.cols;c++){
      var full=dropRow(c)<0;
      cols+='<button type="button" class="c4col" data-col="'+c+'"'+(full?" disabled":"")+' aria-label="Column '+(c+1)+(full?", full":"")+'"></button>';
    }
  }
  var style="--cols:"+b.cols+";--rows:"+b.rows+";"+terrainVars();
  var inner='<div class="board c4 '+size+'" style="'+style+'" role="group" aria-label="Board">'
          +   '<div class="c4pieces">'+cells+"</div>"
          +   '<div class="c4front"></div>'
          +   winLineSVG()
          + "</div>"
          + (playable?'<div class="c4cols" style="--cols:'+b.cols+'">'+cols+"</div>":"");
  return size==="sm" ? inner : '<div class="c4wrap">'+inner+"</div>";
}

/* One continuous fall. The piece lives in the pieces layer, under the frame, so
   it can travel the whole column in a single move: visible through each hole it
   crosses and hidden by the frame between them. */
function dropDisc(wrap,i,who,done){
  var b=B(), col=i%b.cols, row=Math.floor(i/b.cols);
  var board=wrap.querySelector(".board.c4"), layer=wrap.querySelector(".c4pieces");
  var reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  function rest(){
    var c=layer&&layer.querySelector('.cell[data-i="'+i+'"]');
    if(c) c.innerHTML=discSVG(who);
    sfx.landc4(); buzz(18);
    later(done,reduced?30:120);
  }
  if(reduced||!board||!layer||!board.animate){ rest(); return; }

  var el=document.createElement("div");
  el.className="c4fall";
  el.style.left=(col*100/b.cols)+"%";
  el.style.width=(100/b.cols)+"%";
  el.style.height=(100/b.rows)+"%";
  el.innerHTML=discSVG(who);
  layer.appendChild(el);

  var end=row*100, dur=Math.round(170+90*Math.sqrt(row+1.1));
  var a=el.animate([
    { transform:"translateY(-112%)", offset:0,   easing:"cubic-bezier(.42,0,.92,.58)" },
    { transform:"translateY("+end+"%)",     offset:.82, easing:"cubic-bezier(.32,0,.36,1)" },
    { transform:"translateY("+(end-7)+"%)", offset:.90, easing:"ease-in" },
    { transform:"translateY("+end+"%)",     offset:1 }
  ],{ duration:dur, fill:"forwards" });

  /* A document timeline can stall - a backgrounded tab, a pane that isn't
     compositing - and onfinish would never arrive. The match must not hang on
     an animation, so whichever lands first wins. */
  var settled=false;
  function land(){
    if(settled) return; settled=true;
    try{ a.cancel(); }catch(e){}
    el.remove(); rest();
  }
  a.onfinish=land;
  later(land,dur+280);
}

/* ---------- player bar + turn clock ----------
   Every screen where somebody has to act carries the same header: both players,
   the active one lit, and a bar draining under them. Long enough to think,
   short enough that nobody sits on the phone. */

/* Room to say something and still play: a turn should not punish you for
   typing a line first. */
var TURN_MOVE=48, TURN_BID=65, TURN_GUESS=48;

function playerBar(active,subs,clock){
  return '<div class="pbar">'+[0,1].map(function(i){
    var live=i===active, on=live||active<0, s=subs&&subs[i];
    return '<div class="pchip'+(on?" on":"")+'" style="--pc:'+phex(i)+'">'
      + '<span class="mk">'+markSVG(pmark(i))+"</span>"
      + '<span class="col"><span class="nm">'+esc(pname(i))+"</span>"
      +   (s?'<span class="'+(s.big?"big":"sub")+'">'+s.text+"</span>":"")+"</span>"
      + (live&&clock?'<span class="secs" id="turnsecs"></span><span class="tk" id="turnclock"><i></i></span>':"")
      + "</div>";
  }).join("")+"</div>";
}
function sub(text){ return { text:text, big:false }; }
function subBig(text){ return { text:text, big:true }; }

/* frame-driven, so it dies with the screen and pauses with the tab */
function runTurnClock(sec,onEnd){
  var el=document.getElementById("turnclock"); if(!el) return;
  var bar=el.querySelector("i"), secs=document.getElementById("turnsecs");
  var t0=performance.now(), warned=false, fired=false, lastShown=-1;
  (function tick(now){
    var k=Math.min(1,(now-t0)/(sec*1000)), left=sec*(1-k);
    bar.style.transform="scaleX("+(1-k).toFixed(4)+")";
    el.classList.toggle("warn",left<=10);
    el.classList.toggle("hot",left<=5);
    if(secs){
      var s=Math.ceil(left);
      secs.classList.toggle("show",left<=10);
      if(left<=10&&s!==lastShown){ lastShown=s; secs.textContent=s; if(s<=5) sfx.key(); }
    }
    if(!warned&&left<=10){ warned=true; sfx.warn(); }
    if(k>=1){ if(!fired){ fired=true; sfx.nope(); buzz([40,60]); onEnd(); } return; }
    frame(tick);
  })(performance.now());
}

/* topbar board glance - the 7x6 grid is unreadable at 44px, so show a tally instead */
function miniHTML(){
  if(G.board==="ttt") return boardHTML("sm",null);
  var n0=G.cells.filter(function(v){return v==="X";}).length, n1=G.cells.filter(function(v){return v==="O";}).length;
  return '<span class="tally"><i style="background:'+phex(0)+'"></i>'+n0+'<span class="sep">/</span>'+n1+'<i style="background:'+phex(1)+'"></i></span>';
}

var scratch={ matches:0, wins:0, roundsWon:0, best:null, bestGuess:null, streak:0, bestStreak:0 };
function ST(i){ return isBot(i)?scratch:P(i).stats; }
function bump(pi,key,n){ if(isBot(pi)) return; var q=P(pi).q; q[key]=(q[key]||0)+(n||1); }

function questsReady(pi){
  var p=P(pi), n=0;
  QUESTS.forEach(function(q){ if(!p.claimed[q.id]&&(p.q[q.track]||0)>=q.goal) n++; });

}

/* One warning, used anywhere leaving costs something. */
function confirmAsk(o){
  var scrim=document.createElement("div");
  scrim.className="scrim";
  scrim.innerHTML='<div class="dlg" role="dialog" aria-modal="true"><h3>'+esc(o.title)+"</h3>"
    + "<p>"+esc(o.body)+"</p><div class=\"row\">"
    + '<button class="act ghost" id="dlgNo" type="button">'+esc(o.cancel||"Stay")+"</button>"
    + '<button class="act warn" id="dlgYes" type="button">'+esc(o.ok||"Leave")+"</button></div></div>";
  document.body.appendChild(scrim);
  function shut(){ scrim.remove(); document.removeEventListener("keydown",key); }
  function no(){ sfx.tap(); shut(); if(o.onCancel) o.onCancel(); }
  function yes(){ sfx.tap(); shut(); o.onConfirm(); }
  function key(e){ if(e.key==="Escape"){ e.preventDefault(); no(); } }
  scrim.addEventListener("click",function(e){ if(e.target===scrim) no(); });
  scrim.querySelector("#dlgNo").addEventListener("click",no);
  scrim.querySelector("#dlgYes").addEventListener("click",yes);
  document.addEventListener("keydown",key);
  scrim.querySelector("#dlgNo").focus({preventScroll:true});
  sfx.nope(); buzz(18);
}
/* a match in progress is the only thing you can actually lose by leaving */
function leaveMatch(){
  if(G.result||!G.game){ tab="home"; showHub(); return; }
  confirmAsk({
    title:"Leave the match?",
    body:"This one is still running. Leaving ends it here, and nothing from it is counted.",
    ok:"Leave", cancel:"Keep playing",
    onConfirm:function(){ haltAll(); tab="home"; showHub(); }
  });
}

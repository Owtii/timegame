<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0A0C11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Two pass-and-play duels - blind timing and number deduction - feeding Tic-Tac-Toe or Connect 4.">
<title>Duel Board</title>
</head>
<body>
<!-- ARTIFACT:BEGIN -->
<style>
/* ============================================================
   Duel Board - precision-instrument treatment.
   Single dark visual world, deliberately.
   ============================================================ */

:root{
  --ink:#0A0C11; --panel:#12151D; --panel-2:#171B25; --panel-3:#1D2230;
  --hair:rgba(255,255,255,.085); --hair-2:rgba(255,255,255,.16);
  --text:#EDEFF5; --grey:#8A8FA0; --grey-dim:#5A6072;
  --coin:#E8B44A; --void:#E4A33B; --good:#3ED598;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Mono","Roboto Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --ease:cubic-bezier(.2,.85,.3,1);
  --pc:#8A8FA0;
  color-scheme:dark;
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; height:100%; background:var(--ink); }
body{
  color:var(--text); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior:none; touch-action:manipulation;
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;
}
input{ -webkit-user-select:text; user-select:text; font:inherit; }
button{ font:inherit; }

#app{
  position:fixed; inset:0; max-width:560px; margin-inline:auto;
  display:flex; flex-direction:column; overflow:hidden; isolation:isolate;
  padding:
    calc(env(safe-area-inset-top) + 12px)
    calc(env(safe-area-inset-right) + 18px)
    calc(env(safe-area-inset-bottom) + 14px)
    calc(env(safe-area-inset-left) + 18px);
}
#app::before{
  content:''; position:fixed; inset:-30% -30% auto -30%; height:75%; z-index:-1; pointer-events:none;
  background:radial-gradient(50% 55% at 50% 20%, var(--glow, rgba(120,130,160,.10)), transparent 72%);
  transition:background .7s var(--ease);
}

.lbl{ font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.185em; text-transform:uppercase; color:var(--grey-dim); }

/* ---------- chrome ---------- */

#topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:44px; flex:none;
  transition:opacity .35s var(--ease), transform .35s var(--ease); }
#topbar.recede{ opacity:0; transform:translateY(-8px); pointer-events:none; }
#topbar .slot{ flex:1 1 0; display:flex; align-items:center; gap:9px; min-width:0; }
#topbar .slot.right{ justify-content:flex-end; gap:8px; }
#topbar .slot.mid{ flex:none; }

.icon-btn{
  appearance:none; border:1px solid var(--hair); background:var(--panel); color:var(--grey);
  width:34px; height:34px; border-radius:10px; display:grid; place-items:center; padding:0; cursor:pointer;
  transition:color .2s,border-color .2s,background .2s,transform .1s;
}
.icon-btn:hover{ color:var(--text); border-color:var(--hair-2); }
.icon-btn:active{ transform:scale(.94); }
.icon-btn svg{ width:17px; height:17px; }
.icon-btn.armed{ color:var(--void); border-color:var(--void); background:rgba(228,163,59,.10); }
.icon-btn.tiny{ width:30px; height:30px; border-radius:9px; }
.icon-btn.tiny svg{ width:14px; height:14px; }

.whoami{ display:flex; align-items:center; gap:8px; padding:5px 10px 5px 6px; border:1px solid var(--hair);
  border-radius:999px; background:var(--panel); cursor:pointer; min-width:0; color:var(--text); }
.whoami:active{ transform:scale(.97); }
.whoami .dot{ width:9px; height:9px; border-radius:50%; background:var(--pc); flex:none; box-shadow:0 0 8px -1px var(--pc); }
.whoami .nm{ font-family:var(--mono); font-size:11px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.whoami .sw{ color:var(--grey-dim); font-size:10px; display:grid; }
.whoami .sw svg{ width:13px; height:13px; }

.coinpill{ display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:12.5px; font-weight:700; color:var(--coin); border:1px solid rgba(232,180,74,.28);
  background:rgba(232,180,74,.08); border-radius:999px; padding:5px 11px 5px 8px; }
.coinpill svg{ width:13px; height:13px; flex:none; }

.tally{ display:flex; align-items:center; gap:7px; font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12px; font-weight:700; }
.tally i{ width:9px; height:9px; border-radius:50%; display:inline-block; }
.tally .sep{ color:var(--grey-dim); font-weight:400; }

/* ---------- stage ---------- */

#stage{ flex:1 1 auto; min-height:0; display:flex; }
#stage.scrolls{ overflow-y:auto; overflow-x:hidden; scrollbar-width:none; }
#stage.scrolls::-webkit-scrollbar{ display:none; }

.screen{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; animation:screenIn .38s var(--ease) both; }
@keyframes screenIn{ from{ opacity:0; transform:translateY(10px); } }
.view{ flex:1 1 auto; display:flex; flex-direction:column; gap:14px; padding:4px 0 8px; animation:screenIn .3s var(--ease) both; }

/* ---------- tab bar ---------- */

#tabbar{ flex:none; display:grid; grid-template-columns:repeat(5,1fr); gap:2px; padding-top:10px; margin-top:2px; border-top:1px solid var(--hair); }
#tabbar.hidden{ display:none; }
.tab{ appearance:none; border:0; background:transparent; padding:7px 2px 3px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:5px; color:var(--grey-dim); transition:color .2s; position:relative; }
.tab svg{ width:19px; height:19px; }
.tab span{ font-family:var(--mono); font-size:8.5px; letter-spacing:.1em; text-transform:uppercase; }
.tab.on{ color:var(--text); }
.tab.on::before{ content:''; position:absolute; top:-11px; left:50%; transform:translateX(-50%); width:22px; height:2px; border-radius:2px; background:var(--pc); }
.tab .badge{ position:absolute; top:3px; right:calc(50% - 17px); width:7px; height:7px; border-radius:50%; background:var(--coin); border:1.5px solid var(--ink); }

/* ---------- panels ---------- */

.panel{ border:1px solid var(--hair); border-radius:16px; background:var(--panel); padding:15px 16px; display:flex; flex-direction:column; gap:12px; }
.panel.tight{ padding:13px 14px; gap:9px; }
.panel-h{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.headline{ display:flex; flex-direction:column; gap:3px; }
.headline .big{ font-family:var(--mono); font-size:19px; font-weight:700; letter-spacing:-.02em; }

.statgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
.stat{ border:1px solid var(--hair); border-radius:12px; background:var(--panel-2); padding:10px 8px; text-align:center; display:flex; flex-direction:column; gap:4px; }
.stat .v{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; letter-spacing:-.02em; }
.stat .k{ font-family:var(--mono); font-size:8.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--grey-dim); }

/* ---------- buttons ---------- */

.act{ appearance:none; width:100%; flex:none; border:1px solid var(--hair-2); border-radius:16px;
  background:var(--panel-2); color:var(--text); font-family:var(--mono); font-size:12px; font-weight:600;
  letter-spacing:.16em; text-transform:uppercase; padding:17px 20px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:10px;
  transition:transform .12s var(--ease), background .2s, border-color .2s, opacity .2s; }
.act:hover{ background:var(--panel-3); border-color:rgba(255,255,255,.24); }
.act:active{ transform:scale(.985); background:#161a24; }
.act:focus-visible{ outline:2px solid var(--grey); outline-offset:2px; }
.act.accent{ border-color:var(--pc); color:var(--pc); background:transparent; }
.act.hero{ background:var(--pc); border-color:var(--pc); color:#0A0C11; font-weight:700; }
.act.hero:hover{ filter:brightness(1.08); background:var(--pc); }
.act[disabled]{ opacity:.4; cursor:default; transform:none; }
.act.sm{ padding:10px 14px; font-size:10.5px; border-radius:11px; width:auto; }
.act.ghost{ background:transparent; border-color:var(--hair); color:var(--grey); }

/* ---------- setup (mode + board choice) ---------- */

.setup{ justify-content:center; gap:16px; }
.choices{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.choice{
  appearance:none; text-align:left; cursor:pointer; position:relative;
  border:1px solid var(--hair); border-radius:15px; background:var(--panel); color:var(--text);
  padding:13px 13px 12px; display:flex; flex-direction:column; gap:7px;
  transition:border-color .2s, background .2s, transform .1s;
}
.choice:active{ transform:scale(.98); }
.choice.on{ border-color:var(--pc); background:var(--panel-2); }
.choice .art{ height:46px; color:var(--grey-dim); transition:color .25s; }
.choice.on .art{ color:var(--pc); }
.choice .t{ font-family:var(--mono); font-size:12.5px; font-weight:700; letter-spacing:-.01em; }
.choice .d{ font-size:11px; color:var(--grey-dim); line-height:1.35; }
.choice .tickmark{ position:absolute; top:11px; right:11px; width:15px; height:15px; border-radius:50%;
  background:var(--pc); color:var(--ink); display:none; place-items:center; }
.choice.on .tickmark{ display:grid; }
.choice .tickmark svg{ width:9px; height:9px; }
.choices.one{ grid-template-columns:1fr; }
.setup.stack{ justify-content:flex-start; gap:11px; }
/* the list runs past a phone screen, so keep Start within thumb reach */
.setup.stack .foot{ position:sticky; bottom:0; padding:14px 0 2px; margin-top:0;
  background:linear-gradient(to top, var(--ink) 58%, transparent); }

/* ---------- boards ---------- */

.board{ position:relative; display:grid; }

/* tic-tac-toe */
.board.ttt{ grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); aspect-ratio:1/1; }
.board.ttt.lg{ width:100%; max-width:min(78vw,320px); gap:9px; margin-inline:auto; }
.board.ttt.sm{ width:54px; gap:3px; }
.board.ttt .cell{ background:var(--panel); border:1px solid var(--hair); border-radius:14px; }
.board.ttt.sm .cell{ border-radius:4px; border-color:rgba(255,255,255,.07); }
.board.ttt.t-etched .cell{ border-radius:3px; background:transparent; border-color:var(--hair-2); }
.board.ttt.t-void .cell{ border-radius:50%; background:#0C0E14; border-color:rgba(255,255,255,.06); }

.cell{ position:relative; appearance:none; padding:0; min-width:0; min-height:0; overflow:hidden;
  display:grid; place-items:center; transition:background .2s, border-color .2s, transform .12s var(--ease); }
.cell:disabled{ cursor:default; }
.cell.live{ cursor:pointer; }
.cell.live:hover{ border-color:var(--hair-2); background:var(--panel-2); }
.cell.live:active{ transform:scale(.94); }
.cell.live:focus-visible{ outline:2px solid var(--pc); outline-offset:2px; }
.cell .pad{ width:100%; height:100%; padding:19%; display:block; }
.board.ttt.sm .cell .pad{ padding:17%; }
.cell.wincell{ background:var(--panel-2); border-color:var(--pc); }

.ghost{ opacity:.11; transition:opacity .18s, transform .18s var(--ease); display:block; width:100%; height:100%; }
.cell.live:hover .ghost{ opacity:.24; }
.cell.live:active .ghost{ opacity:.42; transform:scale(1.06); }

.mk{ display:block; width:100%; height:100%; overflow:visible; }
.mk line,.mk circle{ fill:none; stroke:currentColor; stroke-width:9; stroke-linecap:round; }
.board.sm .mk line,.board.sm .mk circle{ stroke-width:13; }
.mk.anim.mk-x line{ stroke-dasharray:74; stroke-dashoffset:74; animation:draw .3s var(--ease) forwards; }
.mk.anim.mk-x line.s2{ animation-delay:.13s; }
.mk.anim.mk-o circle{ stroke-dasharray:164; stroke-dashoffset:164; animation:draw .44s var(--ease) forwards; }
.mk-o circle{ transform:rotate(-90deg); transform-origin:50% 50%; }
@keyframes draw{ to{ stroke-dashoffset:0; } }

/* connect 4 */
.c4wrap{ position:relative; width:100%; max-width:min(92vw,360px); margin-inline:auto; }
.board.c4{
  grid-template-columns:repeat(var(--cols),1fr); grid-template-rows:repeat(var(--rows),1fr);
  gap:clamp(3px,1.4vw,6px); aspect-ratio:var(--cols)/var(--rows); padding:clamp(4px,1.6vw,7px);
  background:var(--panel); border:1px solid var(--hair); border-radius:14px;
}
.board.c4 .cell{ border-radius:50%; background:#08090D; border:1px solid rgba(255,255,255,.055); box-shadow:inset 0 2px 5px rgba(0,0,0,.6); }
.board.c4.t-etched .cell{ border-radius:4px; }
.board.c4.t-void .cell{ background:#06070A; }
.board.c4 .cell .pad{ padding:9%; }
.board.c4 .cell.wincell{ background:#0C0E14; border-color:var(--pc); }

.disc{ display:block; width:100%; height:100%; border-radius:50%; background:currentColor;
  box-shadow:inset 0 2px 3px rgba(255,255,255,.28), inset 0 -3px 6px rgba(0,0,0,.4), 0 0 12px -5px currentColor; }
.disc.drop{ animation:dropIn var(--dur,.4s) cubic-bezier(.35,.05,.35,1) both; }
@keyframes dropIn{
  0%{ transform:translateY(var(--from,-600%)); }
  72%{ transform:translateY(0); }
  84%{ transform:translateY(-9%); }
  100%{ transform:translateY(0); }
}
.discghost{ display:block; width:100%; height:100%; border-radius:50%; border:2px dashed currentColor; opacity:.4; }

.c4cols{ position:absolute; inset:clamp(4px,1.6vw,7px); display:grid; grid-template-columns:repeat(var(--cols),1fr); gap:clamp(3px,1.4vw,6px); }
.c4col{ appearance:none; border:0; background:transparent; border-radius:9px; cursor:pointer; padding:0;
  transition:background .15s; }
.c4col:hover{ background:rgba(255,255,255,.05); }
.c4col:active{ background:rgba(255,255,255,.09); }
.c4col[disabled]{ cursor:default; }
.c4col:focus-visible{ outline:2px solid var(--pc); outline-offset:-2px; }

.board.c4.sm{ width:74px; gap:1.5px; padding:2.5px; border-radius:5px; }
.board.c4.sm .cell{ border-width:0; box-shadow:none; }
.board.c4.sm .cell .pad{ padding:6%; }

.winline{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
.winline line{ stroke:var(--pc); stroke-linecap:round; stroke-dasharray:400; stroke-dashoffset:400;
  animation:draw .55s .3s var(--ease) forwards; filter:drop-shadow(0 0 7px var(--pc)); }

/* ---------- hub: home ---------- */

.wordmark h1{ margin:0; font-family:var(--mono); font-weight:700; font-size:clamp(27px,9vw,36px); line-height:.94; letter-spacing:-.035em; }
.wordmark h1 .l2{ color:var(--grey); }
.wordmark p{ margin:8px 0 0; color:var(--grey); font-size:13.5px; line-height:1.5; max-width:34ch; }

.demo{ position:relative; height:84px; flex:none; border-block:1px solid var(--hair); display:grid; place-items:center; overflow:hidden; }
.demo::before,.demo::after{ content:''; position:absolute; top:0; bottom:0; width:1px; background:var(--hair); }
.demo::before{ left:0; } .demo::after{ right:0; }
.demo .readout{ font-family:var(--mono); font-size:38px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.03em; }
.demo .layer{ position:absolute; inset:0; display:grid; place-items:center; }

.ticks{ width:100%; height:34px; opacity:0; color:var(--pc);
  background-image:repeating-linear-gradient(90deg,currentColor 0 1px,transparent 1px 10px);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent); }

.vsrow{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; }
.vsrow .side{ display:flex; flex-direction:column; align-items:center; gap:6px; }
.vsrow .side .g{ width:32px; height:32px; }
.vsrow .side .n{ font-family:var(--mono); font-size:11px; font-weight:700; color:var(--pc); max-width:13ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.vsrow .side .r{ font-family:var(--mono); font-size:9px; letter-spacing:.1em; color:var(--grey-dim); }
.vsrow .mid{ font-family:var(--mono); font-size:9px; letter-spacing:.18em; color:var(--grey-dim); }

/* ---------- hub: quests / shop / players / profile ---------- */

.qrow{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--hair); }
.qrow:last-child{ border-bottom:0; padding-bottom:2px; }
.qrow .body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:6px; }
.qrow .t{ font-size:13.5px; font-weight:600; }
.qrow .d{ font-size:11.5px; color:var(--grey); }
.bar{ height:4px; border-radius:4px; background:rgba(255,255,255,.08); overflow:hidden; }
.bar i{ display:block; height:100%; background:var(--pc); border-radius:4px; transition:width .5s var(--ease); }
.qrow .side{ flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.qmeta{ font-family:var(--mono); font-size:10px; color:var(--grey-dim); font-variant-numeric:tabular-nums; }
.done{ color:var(--good); }

.swatches{ display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
.sw{ appearance:none; border:1px solid var(--hair); border-radius:13px; background:var(--panel-2); padding:10px 4px 8px;
  cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:7px; transition:border-color .2s, transform .1s, opacity .2s; }
.sw:active{ transform:scale(.95); }
.sw .chip{ width:26px; height:26px; border-radius:50%; box-shadow:0 0 12px -3px currentColor; }
.sw .p{ font-family:var(--mono); font-size:9px; color:var(--grey-dim); display:flex; align-items:center; gap:3px; }
.sw .p svg{ width:9px; height:9px; }
.sw.equipped{ border-color:currentColor; background:var(--panel-3); }
.sw.taken{ opacity:.32; cursor:not-allowed; }
.sw.locked .chip{ opacity:.35; }

.themerow{ display:flex; flex-direction:column; gap:8px; }
.theme{ display:flex; align-items:center; gap:12px; border:1px solid var(--hair); border-radius:13px; background:var(--panel-2);
  padding:10px 12px; cursor:pointer; transition:border-color .2s, transform .1s; }
.theme:active{ transform:scale(.99); }
.theme.equipped{ border-color:var(--pc); }
.theme .prev{ width:36px; height:36px; flex:none; }
.theme .body{ flex:1 1 auto; display:flex; flex-direction:column; gap:2px; min-width:0; }
.theme .t{ font-size:13px; font-weight:600; }
.theme .d{ font-size:11px; color:var(--grey-dim); }

.pcard{ display:flex; align-items:center; gap:12px; border:1px solid var(--hair); border-radius:14px; background:var(--panel-2); padding:12px; }
.pcard .g{ width:34px; height:34px; flex:none; }
.pcard .body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px; }
.pcard .n{ font-family:var(--mono); font-size:13px; font-weight:700; color:var(--pc); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pcard .s{ font-size:11px; color:var(--grey); font-variant-numeric:tabular-nums; }
.pcard .me{ font-family:var(--mono); font-size:8px; letter-spacing:.14em; color:var(--ink); background:var(--pc); border-radius:4px; padding:2px 5px; }

.chat{ display:flex; flex-direction:column; gap:9px; }
.msgs{ display:flex; flex-direction:column; gap:8px; min-height:80px; max-height:32vh; overflow-y:auto; scrollbar-width:none; }
.msgs::-webkit-scrollbar{ display:none; }
.msg{ max-width:82%; padding:8px 11px; border-radius:14px; font-size:13px; line-height:1.4; overflow-wrap:anywhere; }
.msg.a{ align-self:flex-start; background:var(--panel-2); border:1px solid var(--hair); border-bottom-left-radius:5px; }
.msg.b{ align-self:flex-end; background:color-mix(in srgb, var(--pc) 20%, var(--panel-2)); border:1px solid color-mix(in srgb, var(--pc) 40%, transparent); border-bottom-right-radius:5px; }
.msg .who{ font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--pc); display:block; margin-bottom:3px; }
.msg .tm{ font-family:var(--mono); font-size:9px; color:var(--grey-dim); margin-left:6px; }
.emptychat{ text-align:center; color:var(--grey-dim); font-size:12px; padding:18px 0; }
.composer{ display:flex; gap:8px; align-items:center; }
.composer input{ flex:1 1 auto; min-width:0; background:var(--panel-2); border:1px solid var(--hair); border-radius:12px;
  padding:12px 13px; color:var(--text); font-size:14px; outline:none; transition:border-color .2s; }
.composer input:focus{ border-color:var(--pc); }
.composer input::placeholder{ color:var(--grey-dim); }
.send{ appearance:none; border:0; border-radius:12px; background:var(--pc); color:#0A0C11; width:44px; height:44px; flex:none;
  display:grid; place-items:center; cursor:pointer; transition:transform .1s, opacity .2s; }
.send:active{ transform:scale(.93); }
.send[disabled]{ opacity:.3; cursor:default; }
.send svg{ width:18px; height:18px; }

.field{ display:flex; flex-direction:column; gap:7px; }
.field input{ background:var(--panel-2); border:1px solid var(--hair); border-radius:12px; padding:12px 13px; color:var(--text); font-size:14px; outline:none; transition:border-color .2s; }
.field input:focus{ border-color:var(--pc); }

/* ---------- pass ---------- */

.pass{ align-items:center; justify-content:center; cursor:pointer; text-align:center; }
.pass .glyph{ width:92px; height:92px; margin-bottom:24px; }

function today(){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }

function freshPlayer(i){
  return { name:"Player "+(i+1), color:COLORS[i].id, coins:0, owned:[COLORS[0].id,COLORS[1].id],
           stats:{ matches:0, wins:0, roundsWon:0, best:null, bestGuess:null, streak:0, bestStreak:0 },
           q:{}, claimed:{} };
}
function freshDB(){
  return { v:2, players:[freshPlayer(0),freshPlayer(1)], me:0,
           shared:{ themes:["default"], theme:"default" },
           chat:[], day:today(), series:[0,0], history:[],
           lastGame:"dtimer", lastBoard:"ttt", lastOpp:"friend", lastTap:null };
}
function load(){
  try{ var raw=localStorage.getItem(KEY); DB=raw?JSON.parse(raw):freshDB(); }
  catch(e){ memOnly=true; DB=freshDB(); }
  var f=freshDB();
  if(!DB||typeof DB!=="object") DB=f;
  if(!Array.isArray(DB.players)||DB.players.length!==2) DB.players=f.players;
  DB.players.forEach(function(p,i){
    var d=freshPlayer(i);
    if(typeof p.name!=="string"||!p.name.trim()) p.name=d.name;
    if(!COLORS.some(function(c){return c.id===p.color;})) p.color=d.color;
    if(typeof p.coins!=="number"||!isFinite(p.coins)) p.coins=0;
    if(!Array.isArray(p.owned)) p.owned=d.owned;
    p.stats=Object.assign(d.stats,p.stats||{});
    if(!p.q) p.q={}; if(!p.claimed) p.claimed={};
  });
  if(!DB.shared||!Array.isArray(DB.shared.themes)) DB.shared=f.shared;
  if(!THEMES.some(function(t){return t.id===DB.shared.theme;})) DB.shared.theme="default";
  if(!Array.isArray(DB.chat)) DB.chat=[];
  if(!Array.isArray(DB.series)) DB.series=[0,0];
  if(!Array.isArray(DB.history)) DB.history=[];
  if(DB.history.length>14) DB.history=DB.history.slice(0,14);
  if(DB.me!==0&&DB.me!==1) DB.me=0;
  /* v1 stored a mode id; the catalogue replaced it with a game id */
  if(!GAMES[DB.lastGame]) DB.lastGame=(DB.lastMode==="number")?"dnumber":"dtimer";
  if(DB.lastOpp!=="bot"&&DB.lastOpp!=="friend") DB.lastOpp="friend";
  if(typeof DB.lastTap!=="number"||!isFinite(DB.lastTap)) DB.lastTap=null;
  if(!BOARDS[DB.lastBoard]) DB.lastBoard="ttt";
  if(DB.day!==today()){ DB.day=today(); DB.players.forEach(function(p){ p.q={}; p.claimed={}; }); }

}
function save(){ if(memOnly) return; try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){ memOnly=true; } }

function P(i){ return DB.players[i]; }

function isBot(i){ return G.vsBot&&i===G.bot; }

function pmark(i){ return i===0?"X":"O"; }
function phex(i){ var c=COLORS.filter(function(c){return c.id===P(i).color;})[0]; return c?c.hex:COLORS[i].hex; }
function hexA(hex,a){ var n=parseInt(hex.slice(1),16); return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")"; }

/* ============================================================

var pending=[], frames=[];
function later(fn,ms){ var id=setTimeout(fn,ms); pending.push(id); return id; }
function frame(fn){ var id=requestAnimationFrame(fn); frames.push(id); return id; }
function haltAll(){ pending.forEach(clearTimeout); pending.length=0; frames.forEach(cancelAnimationFrame); frames.length=0; }

/* ============================================================

var sfx=(function(){
  var ctx=null, muted=false;
  function C(){
    if(!ctx){ var A=window.AudioContext||window.webkitAudioContext; if(!A) return null;
      try{ ctx=new A(); }catch(e){ return null; } }
    if(ctx.state==="suspended") ctx.resume();
    return ctx;
  }
  function osc(o){
    var c=C(); if(!c||muted) return;
    var t=c.currentTime+(o.at||0), a=o.a||.006, d=o.d||.2, v=o.v||.2;
    var n=c.createOscillator(); n.type=o.type||"sine"; n.frequency.setValueAtTime(o.f,t);
    if(o.f2) n.frequency.exponentialRampToValueAtTime(Math.max(1,o.f2),t+a+d);
    var g=c.createGain();
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+d);
    n.connect(g); g.connect(c.destination); n.start(t); n.stop(t+a+d+.03);
  }
  function noise(o){
    var c=C(); if(!c||muted) return;
    var t=c.currentTime+(o.at||0), d=o.d||.05, v=o.v||.18;
    var len=Math.ceil(c.sampleRate*(d+.02)), buf=c.createBuffer(1,len,c.sampleRate), dat=buf.getChannelData(0);
    for(var i=0;i<len;i++) dat[i]=Math.random()*2-1;
    var s=c.createBufferSource(); s.buffer=buf;
    var f=c.createBiquadFilter(); f.type="highpass"; f.frequency.value=o.hp||900;
    var g=c.createGain(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f); f.connect(g); g.connect(c.destination); s.start(t); s.stop(t+d+.02);
  }
  return {
    warm:function(){ C(); }, isMuted:function(){ return muted; },
    toggle:function(){ muted=!muted; if(!muted){ C(); this.tap(); } return muted; },
    tap:function(){ osc({f:520,f2:660,d:.07,v:.10,type:"triangle"}); },
    key:function(){ osc({f:640,d:.035,v:.09,type:"square"}); },
    start:function(){ osc({f:400,f2:620,d:.10,v:.13}); },
    warn:function(){ osc({f:660,d:.06,v:.07,type:"triangle"}); },
    stop:function(){ osc({f:196,f2:58,d:.22,v:.34}); osc({f:880,f2:290,d:.055,v:.10,type:"triangle"}); noise({d:.042,v:.16,hp:1600}); },
    ping:function(i){ osc({f:i?700:540,d:.19,v:.15,type:"triangle"}); },
    tense:function(){ for(var k=0;k<3;k++) osc({f:112,at:k*.26,d:.15,v:.11}); },
    higher:function(){ osc({f:420,f2:700,d:.2,v:.16,type:"triangle"}); },
    lower:function(){ osc({f:700,f2:380,d:.2,v:.16,type:"triangle"}); },
    win:function(){ [523,659,784].forEach(function(f,i){ osc({f:f,at:i*.075,d:.32,v:.17,type:"triangle"}); }); },
    tie:function(){ osc({f:466,d:.13,v:.14}); osc({f:466,at:.17,d:.13,v:.14}); },
    voided:function(){ osc({f:300,f2:110,d:.32,v:.13,type:"sawtooth"}); },
    place:function(){ osc({f:300,f2:540,d:.09,v:.18}); noise({d:.03,v:.08,hp:2200}); },
    landc4:function(){ osc({f:150,f2:70,d:.16,v:.3}); noise({d:.05,v:.14,hp:800}); },
    game:function(){ [523,659,784,1047].forEach(function(f,i){ osc({f:f,at:i*.1,d:.45,v:.19,type:"triangle"}); }); },
    draw:function(){ osc({f:420,f2:320,d:.4,v:.14}); },
    coin:function(){ osc({f:1050,d:.09,v:.13,type:"triangle"}); osc({f:1560,at:.06,d:.12,v:.10,type:"triangle"}); },
    buy:function(){ osc({f:620,f2:940,d:.16,v:.16,type:"triangle"}); noise({d:.03,v:.06,hp:2400}); },
    nope:function(){ osc({f:180,f2:120,d:.18,v:.14,type:"sawtooth"}); },
    msg:function(){ osc({f:760,f2:900,d:.08,v:.10,type:"triangle"}); }
  };
})();

/* ============================================================

   ============================================================ */

/* Keep this file pure ASCII. Punctuation that reaches the DOM is written as
   \uXXXX escapes (or HTML entities in markup) rather than literal characters:
   when the page is embedded without its own <meta charset>, a literal em dash
   gets its UTF-8 bytes decoded as Windows-1252 and renders as mojibake. */

var app=document.getElementById("app"), stage=document.getElementById("stage"),
    topbar=document.getElementById("topbar"), tabbar=document.getElementById("tabbar"),
    toasts=document.getElementById("toasts");

function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]; }); }
function fx2(n){ return n.toFixed(2); }
function accent(hex){ app.style.setProperty("--pc",hex||"#8A8FA0"); app.style.setProperty("--glow",hex?hexA(hex,.16):"rgba(120,130,160,.10)"); }
function coinTag(n){ return '<span class="coinpill">'+I.coin+n+"</span>"; }
function toast(amount,reason){
  var el=document.createElement("div"); el.className="toast";
  el.innerHTML=I.coin+"+"+amount+(reason?' <span class="r">'+esc(reason)+"</span>":"");
  toasts.appendChild(el); setTimeout(function(){ el.remove(); },2400); sfx.coin();
}
function markSVG(m,animate){
  var cls="mk mk-"+m.toLowerCase()+(animate?" anim":"");
  if(m==="X") return '<svg class="'+cls+'" viewBox="0 0 100 100" aria-hidden="true"><line class="s1" x1="24" y1="24" x2="76" y2="76"/><line class="s2" x1="76" y1="24" x2="24" y2="76"/></svg>';
  return '<svg class="'+cls+'" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="26"/></svg>';
}
/* player emblem - the X/O for tic-tac-toe, a disc for connect 4 */
function emblem(i,animate){

  if(hasBoard()&&G.board==="c4") return '<span style="color:'+col+';display:block;width:100%;height:100%"><span class="disc"></span></span>';
  return '<span style="color:'+col+';display:block;width:100%;height:100%">'+markSVG(pmark(i),animate)+"</span>";

/* ============================================================
   Match state + board engine
   ============================================================ */

var G={ game:"dtimer", kind:"duel", mode:"timer", board:"ttt", vsBot:false, bot:-1,
        cells:[], lastPlaced:-1, inFlight:-1, first:0, result:null, turn:0, log:[], round:1, score:[0,0],
        /* timer */ turnIdx:0, target:0, tapTarget:null, times:[null,null], devs:[null,null],
                    outcome:null, winner:null, replay:null,
        /* number */ secret:0, hi:100, cap:14, guesses:[], entry:"", lastVerdict:null };

function B(){ return BOARDS[G.board]; }
function hasBoard(){ return G.kind==="board"||G.kind==="duel"; }
function idx(r,c){ return r*B().cols+c; }
function marksOn(){ return G.cells.filter(Boolean).length; }
function boardFull(){ return G.cells.every(Boolean); }
function dropRow(col){ var b=B(); for(var r=b.rows-1;r>=0;r--) if(!G.cells[idx(r,col)]) return r; return -1; }

/* generic n-in-a-row over the whole grid - serves 3-in-a-row and 4-in-a-row alike */
function judgeOn(cells,b){
  var dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(var r=0;r<b.rows;r++) for(var c=0;c<b.cols;c++){
    var v=cells[r*b.cols+c]; if(!v) continue;
    for(var d=0;d<4;d++){
      var dr=dirs[d][0], dc=dirs[d][1], line=[r*b.cols+c], ok=true;
      for(var k=1;k<b.need;k++){
        var rr=r+dr*k, cc=c+dc*k;
        if(rr<0||rr>=b.rows||cc<0||cc>=b.cols||cells[rr*b.cols+cc]!==v){ ok=false; break; }
        line.push(rr*b.cols+cc);
      }
      if(ok) return { winner:v==="X"?0:1, line:line };
    }
  }
  if(cells.every(Boolean)) return { winner:null, line:null };
  return null;
}
function judge(){ return judgeOn(G.cells,B()); }

function winLineSVG(){
  if(!G.result||!G.result.line) return "";
  var b=B(), L=G.result.line, U=10;
  var cx=function(i){ return ((i%b.cols)+0.5)*U; }, cy=function(i){ return (Math.floor(i/b.cols)+0.5)*U; };
  var x1=cx(L[0]), y1=cy(L[0]), x2=cx(L[L.length-1]), y2=cy(L[L.length-1]);
  var dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1, ex=dx/len*(U*0.34), ey=dy/len*(U*0.34);
  return '<svg class="winline" viewBox="0 0 '+(b.cols*U)+" "+(b.rows*U)+'" aria-hidden="true">'
       + '<line x1="'+(x1-ex)+'" y1="'+(y1-ey)+'" x2="'+(x2+ex)+'" y2="'+(y2+ey)+'" stroke-width="'+(b.id==="c4"?1.1:1.5)+'"/></svg>';
}

/* live = player index allowed to act, or null for display-only */
function boardHTML(size,live){
  return G.board==="c4" ? c4HTML(size,live) : tttHTML(size,live);
}
function tttHTML(size,live){
  var mark=(live===null||live===undefined)?null:pmark(live);
  var cells=G.cells.map(function(v,i){
    var isWin=G.result&&G.result.line&&G.result.line.indexOf(i)>-1;
    var open=!v&&mark;
    var col=v?phex(v==="X"?0:1):(mark?phex(live):null);
    var inner=v?'<span style="color:'+col+';display:block;width:100%;height:100%">'+markSVG(v,i===G.lastPlaced)+"</span>"
              :(open?'<span class="ghost" style="color:'+col+'">'+markSVG(mark,false)+"</span>":"");
    return '<button type="button" class="cell'+(open?" live":"")+(isWin?" wincell":"")+'" data-i="'+i+'"'+(open?"":" disabled")
         + ' aria-label="Square '+(i+1)+(v?", "+v:", empty")+'"><span class="pad">'+inner+"</span></button>";
  }).join("");
  return '<div class="board ttt '+size+" t-"+DB.shared.theme+'" role="group" aria-label="Board">'+cells+winLineSVG()+"</div>";
}
function c4HTML(size,live){
  var b=B(), playable=(live!==null&&live!==undefined);
  /* a piece mid-flight lives in the overlay layer, not in its cell - the cell clips it */
  var cells=G.cells.map(function(v,i){
    var isWin=G.result&&G.result.line&&G.result.line.indexOf(i)>-1;
    var inner=(v&&i!==G.inFlight)
      ? '<span class="pad"><span class="disc" style="color:'+phex(v==="X"?0:1)+'"></span></span>' : "";
    return '<div class="cell'+(isWin?" wincell":"")+'" data-i="'+i+'">'+inner+"</div>";
  }).join("");
  var cols="";
  if(playable){
    for(var c=0;c<b.cols;c++){
      var full=dropRow(c)<0;
      cols+='<button type="button" class="c4col" data-col="'+c+'"'+(full?" disabled":"")+' aria-label="Column '+(c+1)+(full?", full":"")+'"></button>';
    }
  }
  var inner='<div class="board c4 '+size+" t-"+DB.shared.theme+'" style="--cols:'+b.cols+";--rows:"+b.rows+'" role="group" aria-label="Board">'+cells+winLineSVG()+"</div>"
          + (size==="sm"?"":'<div class="c4fall" id="c4fall"></div>')
          + (playable?'<div class="c4cols" style="--cols:'+b.cols+'">'+cols+"</div>":"");
  return size==="sm" ? inner : '<div class="c4wrap">'+inner+"</div>";
}

/* Drop a disc down the column and land it in `i`. The animated disc sits in an
   overlay clipped to the board, so it is visible the whole way down. */
function dropDisc(wrap,i,who,done){
  var fall=wrap.querySelector("#c4fall"), cell=wrap.querySelector('.cell[data-i="'+i+'"]');
  var reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  if(!fall||!cell||!cell.getBoundingClientRect||reduced){ done(); return; }
  var wr=wrap.getBoundingClientRect(), cr=cell.getBoundingClientRect(), size=cr.width;
  if(!size){ done(); return; }
  var pad=size*0.09, left=cr.left-wr.left+pad, top=cr.top-wr.top+pad, d=size-pad*2;
  var start=-(top+d+size*0.2), travel=Math.abs(start);
  var disc=document.createElement("span");
  disc.className="fdisc";
  disc.style.cssText="left:"+left+"px;top:"+top+"px;width:"+d+"px;height:"+d+"px;color:"+phex(who);
  fall.appendChild(disc);
  var dur=Math.min(700,220+travel*1.15);
  var anim=disc.animate([
    { transform:"translateY("+start+"px)", offset:0,   easing:"cubic-bezier(.45,0,.9,.45)" },
    { transform:"translateY(0)",           offset:.70, easing:"cubic-bezier(.2,.7,.4,1)" },
    { transform:"translateY("+(-d*0.17)+"px)", offset:.84, easing:"cubic-bezier(.5,0,.9,.5)" },
    { transform:"translateY(0)",           offset:.94 },
    { transform:"translateY("+(-d*0.05)+"px)", offset:.97 },
    { transform:"translateY(0)",           offset:1 }
  ],{ duration:dur, fill:"forwards" });
  later(function(){ sfx.landc4(); buzz(18); },dur*0.70);
  var ended=false;
  function finish(){ if(ended) return; ended=true; disc.remove(); done(); }
  anim.onfinish=finish;
  later(finish,dur+80);
}

function miniHTML(){

  var n0=G.cells.filter(function(v){return v==="X";}).length, n1=G.cells.filter(function(v){return v==="O";}).length;
  return '<span class="tally"><i style="background:'+phex(0)+'"></i>'+n0+'<span class="sep">/</span>'+n1+'<i style="background:'+phex(1)+'"></i></span>';
}

var scratch={ matches:0, wins:0, roundsWon:0, best:null, bestGuess:null, streak:0, bestStreak:0 };
function ST(i){ return isBot(i)?scratch:P(i).stats; }
function bump(pi,key,n){ if(isBot(pi)) return; var q=P(pi).q; q[key]=(q[key]||0)+(n||1); }
function award(pi,amount,reason){ if(isBot(pi)) return; P(pi).coins+=amount; save(); toast(amount,reason); }
function questsReady(pi){
  var p=P(pi), n=0;
  QUESTS.forEach(function(q){ if(!p.claimed[q.id]&&(p.q[q.track]||0)>=q.goal) n++; });
  return n;
}

/* ============================================================
   Bot
   ============================================================ */

var BOT={
  /* --- boards --- */
  move:function(cells,board,me){
    return board==="ttt" ? this.ttt(cells,me) : this.c4(cells,me);
  },
  /* perfect 3x3 search, with a deliberate slip now and then so it stays beatable */
  ttt:function(cells,me){
    var open=[]; cells.forEach(function(v,i){ if(!v) open.push(i); });
    if(!open.length) return -1;
    if(Math.random()<0.14) return open[Math.floor(Math.random()*open.length)];
    var b=BOARDS.ttt, mk=me===0?"X":"O", best=-Infinity, pick=open[0];
    open.forEach(function(i){
      var c=cells.slice(); c[i]=mk;
      var s=BOT.mm(c,b,mk,false,0);
      if(s>best){ best=s; pick=i; }
    });
    return pick;
  },
  mm:function(cells,b,mk,maxing,d){
    var r=judgeOn(cells,b);
    if(r){ if(r.winner===null) return 0; return (r.winner===(mk==="X"?0:1)) ? 10-d : d-10; }
    var other=mk==="X"?"O":"X", turn=maxing?mk:other, best=maxing?-Infinity:Infinity;
    for(var i=0;i<cells.length;i++){
      if(cells[i]) continue;
      cells[i]=turn;
      var s=BOT.mm(cells,b,mk,!maxing,d+1);
      cells[i]=null;
      best=maxing?Math.max(best,s):Math.min(best,s);
    }
    return best===Infinity||best===-Infinity?0:best;
  },
  /* connect 4: alpha-beta to a shallow depth over a window-count evaluation */
  c4:function(cells,me){
    var b=BOARDS.c4, mk=me===0?"X":"O", cols=[];
    for(var c=0;c<b.cols;c++) if(BOT.free(cells,b,c)>=0) cols.push(c);
    if(!cols.length) return -1;
    var best=-Infinity, pick=cols[Math.floor(cols.length/2)];
    /* centre-out ordering makes the pruning bite */
    cols.sort(function(a,z){ return Math.abs(a-3)-Math.abs(z-3); });
    cols.forEach(function(c){
      var n=BOT.play(cells,b,c,mk);
      var s=BOT.ab(n,b,mk,4,-Infinity,Infinity,false)+Math.random()*0.6;
      if(s>best){ best=s; pick=c; }
    });
    return pick;
  },
  free:function(cells,b,c){ for(var r=b.rows-1;r>=0;r--) if(!cells[r*b.cols+c]) return r; return -1; },
  play:function(cells,b,c,mk){ var n=cells.slice(), r=BOT.free(n,b,c); if(r>=0) n[r*b.cols+c]=mk; return n; },
  ab:function(cells,b,mk,depth,a,bb,maxing){
    var r=judgeOn(cells,b);
    if(r){ if(r.winner===null) return 0; return (r.winner===(mk==="X"?0:1)) ? 9000+depth : -9000-depth; }
    if(depth===0) return BOT.score(cells,b,mk);
    var other=mk==="X"?"O":"X", turn=maxing?mk:other, best=maxing?-Infinity:Infinity;
    for(var c=0;c<b.cols;c++){
      if(BOT.free(cells,b,c)<0) continue;
      var s=BOT.ab(BOT.play(cells,b,c,turn),b,mk,depth-1,a,bb,!maxing);
      if(maxing){ best=Math.max(best,s); a=Math.max(a,s); } else { best=Math.min(best,s); bb=Math.min(bb,s); }
      if(bb<=a) break;
    }
    return best===Infinity||best===-Infinity?0:best;
  },
  score:function(cells,b,mk){
    var other=mk==="X"?"O":"X", total=0, dirs=[[0,1],[1,0],[1,1],[1,-1]];
    for(var r=0;r<b.rows;r++) for(var c=0;c<b.cols;c++){
      if(c===3) { var mid=cells[r*b.cols+c]; if(mid===mk) total+=3; else if(mid===other) total-=3; }
      for(var d=0;d<4;d++){
        var dr=dirs[d][0], dc=dirs[d][1], mine=0, theirs=0, ok=true;
        for(var k=0;k<b.need;k++){
          var rr=r+dr*k, cc=c+dc*k;
          if(rr<0||rr>=b.rows||cc<0||cc>=b.cols){ ok=false; break; }
          var v=cells[rr*b.cols+cc];
          if(v===mk) mine++; else if(v===other) theirs++;
        }
        if(!ok||(mine&&theirs)) continue;
        if(mine===3) total+=60; else if(mine===2) total+=9; else if(mine===1) total+=1;
        if(theirs===3) total-=75; else if(theirs===2) total-=11;
      }
    }
    return total;
  },
  /* --- clock --- */
  /* a human-ish miss: usually inside a quarter second, sometimes much worse */
  time:function(target){
    var e=(Math.random()+Math.random()+Math.random()-1.5)/1.5*0.30;
    if(Math.random()<0.12) e*=2.6;
    var t=Math.max(0.15,target+e);
    return Math.round(t*100)/100;
  },
  /* --- numbers --- */
  guess:function(lo,hi,taken){
    var pool=[];
    for(var n=lo;n<=hi;n++) if(taken.indexOf(n)===-1) pool.push(n);
    if(!pool.length) return lo;
    /* halve the range, but not with machine precision */
    var mid=pool[Math.floor(pool.length/2)];
    if(Math.random()<0.25) return pool[Math.floor(Math.random()*pool.length)];
    return mid;
  }
};

function logRound(entry){
  entry.r=G.round;
  entry.cells=hasBoard()?G.cells.slice():null;
  entry.board=G.board;
  G.log.push(entry);
  G.round++;
}
function archiveMatch(winner){
  DB.history.unshift({
    ts:Date.now(), game:G.game, board:G.board, vsBot:G.vsBot, winner:winner,
    names:[pname(0),pname(1)], rounds:G.log.slice(-24)
  });
  if(DB.history.length>14) DB.history.length=14;
  save();
}
/* render a board that is not the live one */
function snapshotHTML(cells,board){
  if(!cells) return "";
  var kc=G.cells, kb=G.board, kr=G.result, kf=G.inFlight;
  G.cells=cells; G.board=board||G.board; G.result=null; G.inFlight=-1;
  var html=boardHTML("sm",null);
  G.cells=kc; G.board=kb; G.result=kr; G.inFlight=kf;
  return html;
}
function sheetClose(){ var s=document.getElementById("sheet"); if(s) s.remove(); }
function openSheet(title,inner){
  sheetClose();
  var el=document.createElement("div"); el.id="sheet";
  el.innerHTML='<div class="scrim"></div><div class="body"><div class="head">'
    + '<span class="lbl">'+esc(title)+"</span>"

    + '<div class="scroll">'+inner+"</div></div>";

  el.querySelector(".scrim").addEventListener("click",function(){ sfx.tap(); sheetClose(); });
  el.querySelector("#sheetX").addEventListener("click",function(){ sfx.tap(); sheetClose(); });
}
function roundRows(log){
  if(!log||!log.length) return '<div class="emptylog">Nothing played yet.</div>';
  return log.slice().reverse().map(function(e){
    var tint=e.winner===null||e.winner===undefined?"var(--grey-dim)":phex(e.winner);
    return '<div class="logrow" style="--pc:'+tint+'">'
      + '<span class="rn lbl">'+e.r+"</span>"
      + '<span class="body"><span class="t" style="color:'+tint+'">'+esc(e.t)+'</span>'
      +   '<span class="d">'+esc(e.d)+"</span></span>"
      + (e.cells?'<span class="mini">'+snapshotHTML(e.cells,e.board)+"</span>":"")
      + "</div>";
  }).join("");
}
function matchRows(){
  if(!DB.history.length) return '<div class="emptylog">No finished matches yet.</div>';
  return DB.history.map(function(m,i){
    var g=GAMES[m.game]||{name:"Match"}, tint=m.winner===null?"var(--grey-dim)":phex(m.winner);
    var who=m.winner===null?"Draw":esc(m.names[m.winner])+" won";
    var last=m.rounds&&m.rounds.length?m.rounds[m.rounds.length-1]:null;
    return '<button class="logrow" data-match="'+i+'" type="button" style="--pc:'+tint+';text-align:left;cursor:pointer;width:100%">'
      + '<span class="body"><span class="t" style="color:'+tint+'">'+who+"</span>"
      +   '<span class="d">'+esc(g.name)+(m.vsBot?" &middot; vs Bot":"")+" &middot; "+(m.rounds?m.rounds.length:0)+" rounds &middot; "+timeAgo(m.ts)+"</span></span>"
      + (last&&last.cells?'<span class="mini">'+snapshotHTML(last.cells,m.board)+"</span>":"")
      + "</button>";
  }).join("");
}
function timeAgo(ts){
  var s=Math.max(0,(Date.now()-ts)/1000);
  if(s<90) return "just now";
  if(s<5400) return Math.round(s/60)+" min ago";
  if(s<172800) return Math.round(s/3600)+"h ago";
  return Math.round(s/86400)+"d ago";
}
function openHistory(){
  var inner=(G.log&&G.log.length?'<span class="lbl">This match</span>'+roundRows(G.log):"")
    + '<span class="lbl" style="margin-top:6px">Finished matches</span>'+matchRows();
  openSheet("History",inner);

function wireMatchRows(){

    b.addEventListener("click",function(){
      var m=DB.history[+b.dataset.match]; if(!m) return;

    });
  });
}

/* ============================================================
   Timer duel
   ============================================================ */

function tActor(){ return G.turnIdx===0?G.first:1-G.first; }

function timerPass(){
  var lead = G.replay==="tie" ? "Sudden death. New target, same stakes."
           : G.replay==="void" ? "Round replayed. New target."
           : G.turnIdx===0 ? "You go first this round." : "Hand the phone over.";
  screenPass(tActor(), lead, screenTimer);
}

function screenTimer(){
  var p=tActor(), bot=isBot(p); accent(phex(p)); enterGame(); chromeGame(true);
  show('<div class="screen timer">'
     + '<div class="target"><span class="lbl">'+(bot?"Bot is up \u00b7 target":"Target")+'</span><span class="val">'+fx2(G.target)+"<small>s</small></span></div>"
     + '<div class="window" id="win">'
     +   '<div class="layer"><span class="live" id="live">0.00</span></div>'
     +   '<div class="layer"><span class="ticks" id="ticks"></span></div>'
     +   '<div class="fuse" id="fuse"><i id="fuseBar"></i></div>'
     +   '<div class="shutter" id="shutter"></div>'
     +   '<div class="prehint lbl" id="prehint">Clock hides after 1.00s</div>'
     +   '<div class="blindmsg lbl" id="blind">Running blind</div></div>'
     + '<button class="actuator" id="act" type="button"'+(bot?" disabled":"")+'><span class="cap2"></span><span class="cap"></span>'
     +   '<span class="txt" id="actTxt">'+(bot?"Bot":"Start")+"</span></button></div>");

  var winEl=document.getElementById("win"), live=document.getElementById("live"), ticks=document.getElementById("ticks"),
      shut=document.getElementById("shutter"), blind=document.getElementById("blind"), pre=document.getElementById("prehint"),
      fuse=document.getElementById("fuse"), fuseBar=document.getElementById("fuseBar"),
      btn=document.getElementById("act"), btnTxt=document.getElementById("actTxt");
  var running=false, armed=false, done=false, warned=false, t0=0;
  var botAt=bot?BOT.time(G.target):0;

  function begin(){
    running=true; t0=performance.now();
    btnTxt.textContent=bot?"Running":"Stop"; btn.classList.add("running");
    topbar.classList.add("recede"); pre.style.opacity="0"; fuse.classList.add("on");
    sfx.start(); buzz(8);
    later(function(){ armed=true; },ARM_DELAY);
    (function tick(now){
      if(!running) return;
      var ms=now-t0;
      if(ms<BLIND_AT){
        live.textContent=fx2(ms/1000);
        fuseBar.style.transform="scaleX("+(1-ms/BLIND_AT).toFixed(4)+")";
        if(!warned&&ms>BLIND_AT-260){ warned=true; sfx.warn(); }
      } else if(!live.classList.contains("gone")){
        live.classList.add("gone"); shut.classList.add("run"); blind.classList.add("on"); fuse.classList.remove("on"); buzz(6);
      } else {
        var s=(ms-BLIND_AT)/1000, ramp=Math.min(1,(ms-BLIND_AT)/620);
        ticks.style.opacity=(ramp*(.26+.24*(.5+.5*Math.sin(s*1.7))+.16*(.5+.5*Math.sin(s*.61+1.3)))).toFixed(3);
      }
      frame(tick);
    })(performance.now());
  }
  function end(forced){
    if(done) return;
    running=false; done=true;
    var elapsed=(typeof forced==="number")?forced:Math.round((performance.now()-t0)/10)/100;
    G.times[p]=elapsed; G.devs[p]=Math.round(Math.abs(elapsed-G.target)*100)/100;
    var st=ST(p);
    if(st.best===null||G.devs[p]<st.best) st.best=G.devs[p];
    bump(p,"roundsPlayed");
    if(G.devs[p]<=0.10){ bump(p,"sharp"); award(p,COIN_SHARP,"Inside 0.10s"); }
    save();
    sfx.stop(); buzz([16,26,12]);
    btn.disabled=true; btn.classList.remove("running"); btnTxt.textContent="Locked";
    winEl.innerHTML='<div class="layer"><div class="locked"><svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12.5 5.2 5.2L20 7"/></svg><span class="lbl">Time recorded</span></div></div>';
    later(function(){ if(G.turnIdx===0){ G.turnIdx=1; timerPass(); } else screenReveal(); },bot?560:760);
  }
  btn.addEventListener("click",function(){ if(done) return; if(!running) begin(); else if(armed) end(); });
  if(bot){
    pre.textContent="Bot is lining up its stop";
    later(function(){ begin(); later(function(){ end(botAt); },botAt*1000); },700);
  } else btn.focus({preventScroll:true});
}

function screenReveal(){
  accent(null); enterGame(); chromeGame(true);
  var d0=G.devs[0], d1=G.devs[1];
  if(d0>VOID_LIMIT&&d1>VOID_LIMIT){ G.outcome="void"; G.winner=null; }
  else if(d0===d1){ G.outcome="tie"; G.winner=null; }
  else { G.outcome="win"; G.winner=d0<d1?0:1; }

  function pinPos(i){ var d=G.times[i]-G.target; return 50+(Math.max(-VOID_LIMIT,Math.min(VOID_LIMIT,d))/VOID_LIMIT)*50; }
  function card(i){
    return '<div class="card" id="c'+i+'" style="--pc:'+phex(i)+'"><span class="nm">'+esc(pname(i))+" &middot; "+pmark(i)+"</span>"
      + '<span class="time masked" id="t'+i+'">&mdash;.&mdash;&mdash;</span><span class="off" id="o'+i+'">&mdash;</span></div>';
  }
  show('<div class="screen reveal">'
     + '<div class="rev-head"><span class="lbl">Target was</span><span class="t">'+fx2(G.target)+"s</span></div>"
     + '<div class="cards">'+card(0)+'<div class="vs"><span>VS</span></div>'+card(1)+"</div>"
     + '<div class="finish"><div class="pin" id="p0" data-mk="X" style="--pc:'+phex(0)+'; left:50%"></div>'
     +   '<div class="pin p2" id="p1" data-mk="O" style="--pc:'+phex(1)+'; left:50%"></div>'
     +   '<div class="axis"><div class="bound l"></div><div class="zero"></div><div class="bound r"></div>'
     +     '<span class="cap l">&minus;1.50 early</span><span class="cap c">Target</span><span class="cap r">+1.50 late</span></div></div>'
     + '<div class="banner" id="banner" aria-live="polite"><div class="dots"><i></i><i></i><i></i></div></div>'
     + '<div class="foot" id="foot"></div></div>');
  var banner=document.getElementById("banner"), foot=document.getElementById("foot");

  function drop(i,instant){
    var el=document.getElementById("t"+i), off=document.getElementById("o"+i), pin=document.getElementById("p"+i);
    var v=G.times[i], delta=v-G.target;
    el.classList.remove("masked");
    off.textContent=(G.devs[i]>VOID_LIMIT?"VOID \u2022 ":"")+(delta<0?"\u2212":"+")+fx2(Math.abs(delta))+"s "+(delta<0?"early":"late");
    if(G.devs[i]>VOID_LIMIT) off.style.color="var(--void)";
    pin.style.left=pinPos(i)+"%"; pin.classList.add("on");
    sfx.ping(i); buzz(10);
    if(instant){ el.textContent=fx2(v); off.classList.add("on"); return; }
    var t0=performance.now();
    (function roll(now){
      var k=Math.min(1,(now-t0)/420), e=1-Math.pow(1-k,3);
      el.textContent=fx2(v*e);
      if(k<1) frame(roll); else { el.textContent=fx2(v); off.classList.add("on"); }
    })(t0);
    /* frames stop in a backgrounded tab - make sure the figure still lands */
    later(function(){ el.textContent=fx2(v); off.classList.add("on"); },460);
  }
  function tension(instant){
    if(instant) return;
    document.getElementById("c0").classList.add("shiver");
    document.getElementById("c1").classList.add("shiver");
    sfx.tense();
  }
  function settle(){
    document.getElementById("c0").classList.remove("shiver");
    document.getElementById("c1").classList.remove("shiver");
    var head,sub,label,tint,detail;
    if(G.outcome==="win"){
      var w=G.winner;
      document.getElementById("c"+w).classList.add("hero");
      document.getElementById("c"+(1-w)).classList.add("dim");
      head=pname(w)+" wins the round";
      sub="Off by "+fx2(G.devs[w])+"s versus "+fx2(G.devs[1-w])+"s.";
      label=G.kind==="duel"?(B().drop?"Drop your piece":"Place your "+pmark(w)):"Next round";
      tint=phex(w); accent(phex(w)); sfx.win(); buzz([28,44,64]);
      creditRound(w);
    } else if(G.outcome==="tie"){
      document.getElementById("c0").classList.add("hero"); document.getElementById("c1").classList.add("hero");
      head="Dead heat"; sub="Both off by exactly "+fx2(G.devs[0])+"s. Sudden death \u2014 replay for a new target.";
      label="Replay round"; tint="#EDEFF5"; sfx.tie(); buzz([20,60,20]);
    } else {
      document.getElementById("c0").classList.add("dim"); document.getElementById("c1").classList.add("dim");
      head="Round void"; sub="Both players missed by more than "+fx2(VOID_LIMIT)+"s. Nobody wins it.";
      label="New target"; tint="var(--void)"; sfx.voided(); buzz([50]);
    }
    detail="Target "+fx2(G.target)+"s \u00b7 "+pname(0)+" "+fx2(G.times[0])+"s \u00b7 "+pname(1)+" "+fx2(G.times[1])+"s";
    logRound({ t:G.outcome==="win"?pname(G.winner)+" took the round":(G.outcome==="tie"?"Dead heat":"Void round"), d:detail,
               winner:G.outcome==="win"?G.winner:null });
    banner.innerHTML='<div class="head" style="color:'+tint+'">'+esc(head)+'</div><div class="sub">'+esc(sub)+"</div>";
    /* the result stays on screen, but the game moves on by itself */
    var wait=G.outcome==="win"?2600:2200, fired=false;
    foot.innerHTML='<button class="act accent" id="next" type="button">'+esc(label)+"</button>"+autoBar(wait);
    function go(){
      if(fired) return; fired=true; haltAll();
      if(G.outcome==="win") afterRound(G.winner); else startRound(G.outcome);
    }
    document.getElementById("next").addEventListener("click",function(){ sfx.tap(); go(); });
    later(go,wait);
  }
  var steps=[[300,drop.bind(null,0)],[1000,drop.bind(null,1)],[1600,tension],[2300,settle]], at=0;
  steps.forEach(function(s,i){ later(function(){ if(i>=at){ at=i+1; s[1](false); } },s[0]); });
  stage.querySelector(".reveal").addEventListener("click",function(e){
    if(at>=steps.length||e.target.closest("button")) return;
    haltAll(); while(at<steps.length){ steps[at][1](true); at++; }
  });
}

/* ============================================================
   Number duel
   ============================================================ */

function nActor(){ return G.guesses.length%2===0 ? G.first : 1-G.first; }
function triesBy(i){ return G.guesses.filter(function(g){ return g.by===i; }).length; }

/* what the history proves so far */
function knownRange(){
  var lo=1, hi=G.hi;
  G.guesses.forEach(function(g){
    if(g.res==="higher") lo=Math.max(lo,g.n+1);
    else if(g.res==="lower") hi=Math.min(hi,g.n-1);
  });
  return [lo,hi];
}
/* Duel rule: the nearest guess takes the square, and a shared distance goes to
   whoever reached it first - otherwise a 1-to-10 round could run forever. */
function closestWinner(){
  var best=[Infinity,Infinity], at=[Infinity,Infinity];
  G.guesses.forEach(function(g,i){
    if(g.dist<best[g.by]){ best[g.by]=g.dist; at[g.by]=i; }
  });
  if(best[0]!==best[1]) return best[0]<best[1]?0:1;
  return at[0]<at[1]?0:1;
}

function screenGuess(){
  var p=nActor(), bot=isBot(p), duel=G.kind==="duel";
  accent(phex(p)); enterGame(); chromeGame(true);
  G.entry="";
  var rng=knownRange(), small=G.hi<=12;

  var chips=G.guesses.map(function(g){
    var ar=g.res==="higher"?"&uarr;":g.res==="lower"?"&darr;":"&check;";
    return '<span class="gchip'+(g.res==="hit"?" hit":"")+'" style="color:'+phex(g.by)+'">'+g.n+'<span class="ar">'+ar+"</span></span>";
  }).join("");
  var pins=G.guesses.map(function(g){
    return '<span class="gp" style="color:'+phex(g.by)+";left:calc("+((g.n-1)/(G.hi-1)*100)+"% - 1px)\"></span>";
  }).join("");
  var bandL=(rng[0]-1)/(G.hi-1)*100, bandR=100-(rng[1]-1)/(G.hi-1)*100;

  var pad;
  if(small){
    /* a ten-key grid guesses in one tap - no typing, no confirm */
    var nums="";
    for(var n=1;n<=G.hi;n++){
      var used=G.guesses.some(function(g){ return g.n===n; });
      nums+='<button class="key'+(used?" used":"")+'" data-n="'+n+'" type="button"'+(used?" disabled":"")+">"+n+"</button>";
    }
    pad='<div class="numgrid">'+nums+"</div>";
  } else {
    var keys="";
    [1,2,3,4,5,6,7,8,9].forEach(function(k){ keys+='<button class="key" data-k="'+k+'" type="button">'+k+"</button>"; });
    keys+='<button class="key wide" data-k="del" type="button">Del</button>';
    keys+='<button class="key" data-k="0" type="button">0</button>';
    keys+='<button class="key go" id="goKey" data-k="go" type="button" disabled>Guess</button>';
    pad='<div class="entry" id="entry"><span class="val empty" id="entryVal">\u2014\u2014</span>'
      + '<span class="note" id="note">Between 1 and '+G.hi+"</span></div>"
      + '<div class="keypad">'+keys+"</div>";
  }

  var counter = duel
    ? esc(pname(0))+" "+triesBy(0)+"/"+DUEL_TRIES+" &middot; "+esc(pname(1))+" "+triesBy(1)+"/"+DUEL_TRIES
    : "Guess "+(G.guesses.length+1)+" of "+G.cap;

  show('<div class="screen guess">'
     + '<div class="gtop"><div class="gturn"><span class="dot"></span><span class="n">'+esc(pname(p))+"</span></div>"
     +   '<span class="lbl">'+counter+"</span></div>"
     + '<div class="scale100"><div class="track"><div class="band" style="left:'+bandL+"%;right:"+bandR+'%"></div></div>'
     +   pins+'<div class="ends"><span>1</span><span>'+G.hi+"</span></div></div>"
     + '<div class="hist">'+(chips||'<span class="lbl">No guesses yet</span>')+"</div>"
     + (bot?'<div class="turnflash"><div class="sub2">Bot is working it out</div><div class="dots"><i></i><i></i><i></i></div></div>':pad)
     + "</div>");

  if(bot){
    later(function(){
      var taken=G.guesses.map(function(g){ return g.n; });
      submitGuess(BOT.guess(rng[0],rng[1],taken),p);
    },850);
    return;
  }

  if(small){
    stage.querySelectorAll("[data-n]").forEach(function(b){
      b.addEventListener("click",function(){ sfx.key(); buzz(6); submitGuess(+b.dataset.n,p); });
    });
    return;
  }

  var entry=document.getElementById("entry"), val=document.getElementById("entryVal"),
      note=document.getElementById("note"), go=document.getElementById("goKey");
  function state(){
    var s=G.entry;
    val.textContent=s||"\u2014\u2014";
    val.classList.toggle("empty",!s);
    var n=parseInt(s,10), ok=false, msg="Between 1 and "+G.hi;
    if(s){
      if(!(n>=1&&n<=G.hi)) msg="Out of range";
      else if(G.guesses.some(function(g){ return g.n===n; })) msg="Already guessed";
      else { ok=true; msg=""; }
    }
    note.textContent=msg; note.classList.toggle("bad",!!s&&!ok);
    go.disabled=!ok;
    return ok;
  }
  function press(k){
    if(k==="del"){ G.entry=G.entry.slice(0,-1); sfx.key(); buzz(5); }
    else if(k==="go"){
      if(!state()){ entry.classList.add("shake"); sfx.nope(); buzz(30); setTimeout(function(){ entry.classList.remove("shake"); },320); return; }
      submitGuess(parseInt(G.entry,10),p); return;
    }
    else {
      if(G.entry.length>=String(G.hi).length) return;
      if(G.entry===""&&k==="0") return;
      G.entry+=k; sfx.key(); buzz(5);
    }
    state();
  }
  stage.querySelectorAll(".key").forEach(function(b){ b.addEventListener("click",function(){ press(b.dataset.k); }); });
  state();
}

function submitGuess(n,by){
  var res = n===G.secret ? "hit" : (n<G.secret ? "higher" : "lower");
  G.guesses.push({ n:n, by:by, res:res, dist:Math.abs(n-G.secret) });
  G.lastVerdict={ n:n, by:by, res:res };
  buzz(res==="hit"?[30,50,80]:14);
  if(res==="hit") sfx.win(); else if(res==="higher") sfx.higher(); else sfx.lower();

  var duel=G.kind==="duel", spent = duel ? G.guesses.length>=DUEL_TRIES*2 : G.guesses.length>=G.cap;
  if(res==="hit"){ numberResult(by,"hit"); return; }
  if(spent){ numberResult(duel?closestWinner():null, duel?"closest":"spent"); return; }
  /* No hand-over screen: both players see the same clues, so flash and roll on. */
  flashVerdict(res,n,by,screenGuess);
}

/* the higher/lower reply, shown in place for a beat instead of costing a tap */
function flashVerdict(res,n,by,then){
  var el=stage.querySelector(".screen.guess");
  if(!el){ then(); return; }
  var next=nActor();
  var box=document.createElement("div");
  box.className="turnflash"; box.style.color=phex(by);
  box.innerHTML='<div class="big2">'+(res==="higher"?"Higher":"Lower")+"</div>"
    + '<div class="sub2">'+n+" is too "+(res==="higher"?"low":"high")+". "+esc(pname(next))+" is up.</div>"
    + autoBar(1150);
  [".keypad",".entry",".numgrid"].forEach(function(sel){
    var x=el.querySelector(sel); if(x) x.remove();
  });
  el.appendChild(box);
  later(then,1150);
}

function numberResult(w,why){
  var head,sub,icon,tint,label;
  if(why==="hit"){
    head="Correct"; icon=I.bullseye; tint=phex(w);
    sub="The number was "+G.secret+". "+pname(w)+" takes the round.";
    var used=triesBy(w), st=ST(w);
    if(st.bestGuess===null||used<st.bestGuess) st.bestGuess=used;
    if(used<=2) bump(w,"mind");
    creditRound(w); save();
  } else if(why==="closest"){
    head=pname(w)+" was closest"; icon=I.bullseye; tint=phex(w);
    var mine=Math.min.apply(null,G.guesses.filter(function(g){ return g.by===w; }).map(function(g){ return g.dist; }));
    sub="The number was "+G.secret+". Nobody hit it \u2014 "+pname(w)+" came within "+mine+".";
    sfx.win(); creditRound(w);
  } else {
    head="Out of guesses"; icon=I.bullseye; tint="var(--void)";
    sub="The number was "+G.secret+". Nobody takes it.";
    sfx.voided();
  }
  accent(w===null?null:phex(w)); enterGame(); chromeGame(true);
  label = w===null ? "New number"
        : G.kind==="duel" ? (B().drop?"Drop your piece":"Place your "+pmark(w)) : "Next round";
  logRound({ t:head, d:"Secret "+G.secret+" \u00b7 guesses "+G.guesses.map(function(g){ return g.n; }).join(", "), winner:w });

  var wait=(w===null?2200:2600), fired=false;
  show('<div class="screen verdict" style="color:'+tint+'">'
     + '<div class="arrowbox">'+icon+"</div>"
     + '<div class="big">'+esc(head)+"</div>"
     + '<div class="sub" style="color:var(--grey)">'+esc(sub)+"</div>"
     + '<div class="foot" style="width:100%"><button class="act accent" id="next" type="button">'+esc(label)+"</button>"
     +   autoBar(wait)+"</div></div>");
  function go(){
    if(fired) return; fired=true; haltAll();
    if(w===null) startRound("void"); else afterRound(w);
  }
  document.getElementById("next").addEventListener("click",function(){ sfx.tap(); go(); });
  later(go,wait);
}

/* ============================================================
   Placement + game over
   ============================================================ */

function autoBar(ms){ return '<div class="autoline"><i style="--dur:'+(ms/1000).toFixed(2)+'s"></i></div>'; }
function rnd2(a,b){ return Math.round((a+Math.random()*(b-a))*100)/100; }

function creditRound(w){
  ST(w).roundsWon++; bump(w,"roundsWon"); bump(1-w,"roundsPlayed",0);
  if(G.mode==="number"){ bump(0,"roundsPlayed"); bump(1,"roundsPlayed"); }
  if(G.mode==="timer"&&G.target>6) bump(w,"longWins");
  award(w,COIN_ROUND,"Round won");
  save();
}

/* ---------- shared board wiring ---------- */

function wireBoard(wrap,w,onPick){
  if(B().drop){
    var ghostCell=null;
    var clearGhost=function(){ if(ghostCell){ ghostCell.innerHTML=""; ghostCell=null; } };
    var preview=function(col){
      clearGhost();
      var r=dropRow(col); if(r<0) return;
      ghostCell=wrap.querySelector('.cell[data-i="'+idx(r,col)+'"]');
      if(ghostCell) ghostCell.innerHTML='<span class="pad"><span class="discghost" style="color:'+phex(w)+'"></span></span>';
    };
    wrap.addEventListener("pointerdown",function(e){ var b=e.target.closest(".c4col"); if(b&&!b.disabled) preview(+b.dataset.col); });
    wrap.addEventListener("pointerover",function(e){ var b=e.target.closest(".c4col"); if(b&&!b.disabled&&e.pointerType==="mouse") preview(+b.dataset.col); });
    wrap.addEventListener("pointerleave",clearGhost);
    wrap.addEventListener("pointercancel",clearGhost);
    wrap.addEventListener("click",function(e){
      var b=e.target.closest(".c4col"); if(!b||b.disabled) return;
      var col=+b.dataset.col, r=dropRow(col); if(r<0) return;
      clearGhost(); onPick(idx(r,col),r);
    });
  } else {
    wrap.addEventListener("click",function(e){
      var cell=e.target.closest(".cell.live"); if(!cell) return;
      onPick(parseInt(cell.dataset.i,10),0);
    });
  }
}
function moveNote(i){
  var b=B();
  return b.drop ? "Column "+((i%b.cols)+1)
                : "Row "+(Math.floor(i/b.cols)+1)+", column "+((i%b.cols)+1);
}

/* ---------- classic: play the board itself ---------- */

function screenClassic(){
  var p=G.turn, bot=isBot(p);
  accent(phex(p)); enterGame(); chromeGame(true);
  function side(i){
    return '<span class="side'+(i===p?" on":"")+'" style="color:'+phex(i)+'">'
      + '<span class="g">'+emblem(i,false)+"</span>"
      + '<span class="n">'+esc(pname(i))+"</span></span>";
  }
  show('<div class="screen classic">'
     + '<div class="turnstrip">'+side(0)+'<span class="mid">VS</span>'+side(1)+"</div>"
     + '<div id="boardWrap">'+boardHTML("lg",bot?null:p)+"</div>"
     + '<div class="statusline lbl" id="status">'+(bot?"Bot is thinking":B().pick)+"</div></div>");
  var wrap=document.getElementById("boardWrap");
  if(bot){
    later(function(){
      var pick=BOT.move(G.cells,G.board,p);
      if(pick<0) return;
      var i=B().drop?idx(dropRow(pick),pick):pick, row=B().drop?dropRow(pick):0;
      commit(i,p,row);
    },560);
    return;
  }
  wireBoard(wrap,p,function(i,row){ commit(i,p,row); });
}

/* ---------- duel: the round winner claims a square ---------- */

function screenPlace(w){
  G.winner=w; accent(phex(w)); enterGame(); chromeGame(true);
  var bot=isBot(w);
  show('<div class="screen place">'
     + '<div class="head"><span class="lbl">Round won by</span><span class="who">'+esc(pname(w))+"</span>"
     +   '<span class="sub">'+(bot?"Bot is picking its square":B().pick)+"</span></div>"
     + '<div id="boardWrap">'+boardHTML("lg",bot?null:w)+"</div></div>");
  var wrap=document.getElementById("boardWrap");
  if(bot){
    later(function(){
      var pick=BOT.move(G.cells,G.board,w);
      if(pick<0) return;
      var i=B().drop?idx(dropRow(pick),pick):pick, row=B().drop?dropRow(pick):0;
      commit(i,w,row);
    },700);
    return;
  }
  wireBoard(wrap,w,function(i,row){ commit(i,w,row); });
}

function commit(i,w,row){
  var wrap=document.getElementById("boardWrap");
  G.cells[i]=pmark(w); G.lastPlaced=i;
  if(G.kind==="board") logRound({ t:pname(w)+" played", d:moveNote(i), winner:w });
  else if(G.log.length) G.log[G.log.length-1].cells=G.cells.slice();
  sfx.place();
  if(B().drop){
    G.inFlight=i;
    wrap.innerHTML=boardHTML("lg",null);
    dropDisc(wrap,i,w,function(){ G.inFlight=-1; settleMove(w); });
  } else {
    buzz(14);
    settleMove(w);
  }
}
function settleMove(w){
  var wrap=document.getElementById("boardWrap");
  G.result=judge();
  if(wrap) wrap.innerHTML=boardHTML("lg",null);
  chromeGame(true);
  if(G.result){
    if(G.result.winner!==null){ later(sfx.game,380); later(function(){ finishMatch(G.result.winner); },1450); }
    else { later(sfx.draw,260); later(function(){ finishMatch(null); },1000); }
    return;
  }
  var status=document.getElementById("status");
  if(G.kind==="board"){
    G.turn=1-G.turn;
    later(screenClassic,B().drop?260:200);
  } else {
    if(status) status.textContent="";
    later(function(){ startRound(null); },620);
  }
}

/* ---------- results ---------- */

function afterRound(w){
  if(G.kind==="duel"){ screenPlace(w); return; }
  G.score[w]++;
  if(G.score[w]>=(GAMES[G.game].winTo||3)) finishMatch(w);
  else startRound(null);
}

function finishMatch(w){
  if(w!==null){
    if(!G.vsBot) DB.series[w]++;
    var st=ST(w);
    st.wins++; st.streak++;
    if(st.streak>st.bestStreak) st.bestStreak=st.streak;
    ST(1-w).streak=0;
    bump(w,"matchesWon");
    if(hasBoard()&&G.board==="c4") bump(w,"c4Wins");
    award(w,COIN_MATCH,"Match won");
  }
  ST(0).matches++; ST(1).matches++;
  save();
  archiveMatch(w);
  screenOver(w);
}

function screenOver(w){
  accent(w===null?null:phex(w)); enterGame(); chromeGame(false);
  var g=GAMES[G.game];
  var line = w===null ? "Board full, no line. Honours even."
    : hasBoard() ? B().need+" in a row."
    : "First to "+(g.winTo||3)+" rounds.";
  /* a friend match keeps a running series; against the bot only this match counts */
  if(hasBoard()) G.score=[
    G.cells.filter(function(v){ return v==="X"; }).length,
    G.cells.filter(function(v){ return v==="O"; }).length
  ];
  var useSeries=hasBoard()&&!G.vsBot;
  var s0=useSeries?DB.series[0]:G.score[0], s1=useSeries?DB.series[1]:G.score[1];
  var scoreRow='<div class="series"><span class="sc" style="color:'+phex(0)+'">'+s0+"</span>"
    + '<span class="vlabel">'+(useSeries?"Series":hasBoard()?"Squares":"Rounds")+"</span>"
    + '<span class="sc" style="color:'+phex(1)+'">'+s1+"</span></div>";
  show('<div class="screen over">'
     + '<div class="head"><span class="lbl">'+esc(w===null?"Stalemate":g.name)+"</span>"
     +   '<span class="who">'+esc(w===null?"Draw":pname(w)+" wins")+"</span>"
     +   '<span class="sub">'+esc(line)+"</span></div>"
     + (hasBoard()?boardHTML("lg",null):"")
     + scoreRow
     + '<div class="foot"><button class="act hero" id="again" type="button">Play again</button>'
     +   '<button class="act ghost" id="hist" type="button">Match history</button>'
     +   '<button class="act ghost" id="toHub" type="button">Back to hub</button></div></div>');
  document.getElementById("again").addEventListener("click",function(){
    sfx.tap();
    newMatch(G.game,{ board:G.board, bot:G.vsBot, tap:G.tapTarget });
  });
  document.getElementById("hist").addEventListener("click",function(){ sfx.tap(); openHistory(); });
  document.getElementById("toHub").addEventListener("click",function(){ sfx.tap(); tab="home"; showHub(); });
}

/* ============================================================
   Flow
   ============================================================ */

function newMatch(id,opts){
  var g=GAMES[id]; opts=opts||{};
  G.game=id; G.kind=g.kind; G.mode=g.mode||null;
  G.board=g.board||opts.board||"ttt";
  G.vsBot=!!opts.bot; G.bot=G.vsBot?1:-1;
  G.tapTarget=(typeof opts.tap==="number")?opts.tap:null;
  G.log=[]; G.round=1; G.score=[0,0];
  G.cells=hasBoard() ? new Array(BOARDS[G.board].cols*BOARDS[G.board].rows).fill(null) : [];
  G.lastPlaced=-1; G.inFlight=-1; G.result=null; G.winner=null;
  G.first=Math.random()<.5?0:1; G.turn=G.first;
  if(g.kind==="board") screenClassic();
  else startRound(null,true);
}

function startRound(reason,keepFirst){
  G.replay=reason; G.outcome=null; G.winner=null;
  if(!keepFirst) G.first=1-G.first;
  if(G.kind==="tap"||G.mode==="timer"){
    G.target = (G.kind==="tap")
      ? (G.tapTarget!==null ? G.tapTarget : rnd2(TAP_MIN,TAP_MAX))
      : rnd2(TARGET_MIN,TARGET_MAX);
    G.times=[null,null]; G.devs=[null,null]; G.turnIdx=0;
    timerPass();
  } else {
    G.hi = (G.kind==="duel") ? DUEL_HI : SOLO_HI;
    G.cap = (G.kind==="duel") ? DUEL_TRIES*2 : SOLO_CAP;
    G.secret = 1+Math.floor(Math.random()*G.hi);
    G.guesses=[]; G.entry=""; G.lastVerdict=null;
    screenGuess();
  }
}

load();
showHub();

})();
</script>

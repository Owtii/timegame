<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0A0C11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="A two-player pass-and-play game of blind timing and tic-tac-toe.">
<title>Timer Tic-Tac-Toe</title>
</head>
<body>
<!-- ARTIFACT:BEGIN -->
<style>
/* ============================================================
   Timer Tic-Tac-Toe — a precision-instrument treatment.
   Single dark visual world, deliberately (an instrument panel).
   ============================================================ */

:root{
  --ink:        #0A0C11;
  --panel:      #12151D;
  --panel-2:    #171B25;
  --hair:       rgba(255,255,255,.085);
  --hair-2:     rgba(255,255,255,.16);
  --text:       #EDEFF5;
  --grey:       #8A8FA0;
  --grey-dim:   #5A6072;

  --p1:         #FF6154;
  --p1-soft:    rgba(255,97,84,.15);
  --p2:         #8B7BFF;
  --p2-soft:    rgba(139,123,255,.15);

  --void:       #E4A33B;

  --mono: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono", "Roboto Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;

  --ease: cubic-bezier(.2,.85,.3,1);
  color-scheme: dark;
}

*,*::before,*::after{ box-sizing:border-box; }

html,body{
  margin:0; padding:0; height:100%;
  background:var(--ink);
}

body{
  color:var(--text);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overscroll-behavior:none;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none; user-select:none;
}

/* ---------- shell ---------- */

#app{
  position:fixed; inset:0;
  max-width:560px; margin-inline:auto;
  display:flex; flex-direction:column;
  padding:
    calc(env(safe-area-inset-top) + 12px)
    calc(env(safe-area-inset-right) + 18px)
    calc(env(safe-area-inset-bottom) + 16px)
    calc(env(safe-area-inset-left) + 18px);
  overflow:hidden;
  isolation:isolate;
}

/* ambient wash, tinted to whoever is active */
#app::before{
  content:''; position:fixed; inset:-30% -30% auto -30%; height:75%;
  z-index:-1; pointer-events:none;
  background:radial-gradient(50% 55% at 50% 20%, var(--glow, rgba(120,130,160,.10)), transparent 72%);
  transition:background .7s var(--ease);
}

/* ---------- engraved label ---------- */

.lbl{
  font-family:var(--mono);
  font-size:10px; font-weight:600;
  letter-spacing:.185em; text-transform:uppercase;
  color:var(--grey-dim);
}

/* ---------- chrome bar ---------- */

#hud{
  display:flex; align-items:center; justify-content:space-between;
  gap:14px; height:44px; flex:none;
  transition:opacity .35s var(--ease), transform .35s var(--ease);
}
#hud.recede{ opacity:0; transform:translateY(-8px); pointer-events:none; }

#hud .slot{ flex:1 1 0; display:flex; align-items:center; }
#hud .slot.right{ justify-content:flex-end; }
#hud .slot.mid{ flex:none; }

#roundLbl{ white-space:nowrap; }

.icon-btn{
  appearance:none; border:1px solid var(--hair);
  background:var(--panel); color:var(--grey);
  width:34px; height:34px; border-radius:10px;
  display:grid; place-items:center; cursor:pointer; padding:0;
  transition:color .2s, border-color .2s, background .2s;
}
.icon-btn:hover{ color:var(--text); border-color:var(--hair-2); }
.icon-btn:active{ transform:scale(.94); }
.icon-btn svg{ width:17px; height:17px; }

/* ---------- stage ---------- */

#stage{ flex:1 1 auto; min-height:0; display:flex; }

.screen{
  flex:1 1 auto; min-height:0;
  display:flex; flex-direction:column;
  animation:screenIn .38s var(--ease) both;
}
@keyframes screenIn{ from{ opacity:0; transform:translateY(10px); } }

/* ---------- board ---------- */

.board{
  position:relative;
  display:grid; grid-template-columns:repeat(3,1fr);
  aspect-ratio:1/1;
}
.board.lg{ width:100%; max-width:min(78vw,320px); gap:9px; margin-inline:auto; }
.board.sm{ width:56px; gap:3px; }

.cell{
  position:relative; appearance:none; padding:0;
  background:var(--panel); border:1px solid var(--hair);
  border-radius:14px; overflow:hidden;
  display:grid; place-items:center;
  transition:background .2s, border-color .2s, transform .12s var(--ease);
}
.board.sm .cell{ border-radius:4px; border-color:rgba(255,255,255,.07); }
.cell:disabled{ cursor:default; }
.cell.live{ cursor:pointer; }
.cell.live:hover{ border-color:var(--hair-2); background:var(--panel-2); }
.cell.live:active{ transform:scale(.94); background:var(--panel-2); }
.cell.live:focus-visible{ outline:2px solid var(--pc); outline-offset:2px; }

.cell .pad{ width:100%; height:100%; padding:19%; }
.board.sm .cell .pad{ padding:17%; }

.cell.wincell{ background:var(--panel-2); border-color:var(--pc); }

.ghost{ opacity:.11; transition:opacity .18s, transform .18s var(--ease); }
.cell.live:hover .ghost{ opacity:.24; }
.cell.live:active .ghost{ opacity:.42; transform:scale(1.06); }

/* marks */
.mk{ display:block; width:100%; height:100%; overflow:visible; }
.mk line, .mk circle{ fill:none; stroke:currentColor; stroke-width:9; stroke-linecap:round; }
.board.sm .mk line, .board.sm .mk circle{ stroke-width:13; }
.mk-x{ color:var(--p1); }
.mk-o{ color:var(--p2); }

.mk.anim.mk-x line{ stroke-dasharray:74; stroke-dashoffset:74; animation:draw .3s var(--ease) forwards; }
.mk.anim.mk-x line.s2{ animation-delay:.13s; }
.mk.anim.mk-o circle{ stroke-dasharray:164; stroke-dashoffset:164; animation:draw .44s var(--ease) forwards; }
.mk-o circle{ transform:rotate(-90deg); transform-origin:50% 50%; }
@keyframes draw{ to{ stroke-dashoffset:0; } }

.winline{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
.winline line{
  stroke:var(--pc); stroke-width:3; stroke-linecap:round;
  stroke-dasharray:210; stroke-dashoffset:210;
  animation:draw .55s .3s var(--ease) forwards;
  filter:drop-shadow(0 0 7px var(--pc));
}

/* ---------- home ---------- */

.home{ justify-content:center; gap:30px; padding-bottom:8px; }

.wordmark{ display:flex; flex-direction:column; gap:2px; }
.wordmark h1{
  margin:0; font-family:var(--mono); font-weight:700;
  font-size:clamp(30px,10vw,42px); line-height:.94;
  letter-spacing:-.035em;
}
.wordmark h1 .l2{ color:var(--grey); }
.wordmark .rule{
  height:1px; background:var(--hair-2);
  margin:16px 0 10px;
  -webkit-mask-image:linear-gradient(90deg,#000 60%,transparent);
  mask-image:linear-gradient(90deg,#000 60%,transparent);
}
.wordmark p{
  margin:0; color:var(--grey); font-size:14.5px; line-height:1.55;
  max-width:31ch;
}

/* hero: the instrument demonstrating itself */
.demo{
  position:relative; height:96px; flex:none;
  border-block:1px solid var(--hair);
  display:grid; place-items:center; overflow:hidden;
}
.demo::before, .demo::after{
  content:''; position:absolute; top:0; bottom:0; width:1px;
  background:var(--hair);
}
.demo::before{ left:0; } .demo::after{ right:0; }
.demo .readout{ font-family:var(--mono); font-size:44px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.03em; }
.demo .scale{ position:absolute; inset:0; display:grid; place-items:center; }

.rules{ display:flex; flex-direction:column; gap:11px; }
.rules li{ display:flex; gap:12px; align-items:flex-start; font-size:13.5px; color:var(--grey); line-height:1.45; }
.rules ol{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:11px; }
.rules .n{ font-family:var(--mono); font-size:10.5px; color:var(--grey-dim); padding-top:2px; letter-spacing:.08em; flex:none; }
.rules b{ color:var(--text); font-weight:600; }

.series{
  display:flex; align-items:center; justify-content:center; gap:16px;
  font-family:var(--mono); font-variant-numeric:tabular-nums;
}
.series .sc{ font-size:26px; font-weight:600; }
.series .vs{ font-size:10px; letter-spacing:.2em; color:var(--grey-dim); }

/* ---------- primary action ---------- */

.act{
  appearance:none; width:100%; flex:none;
  border:1px solid var(--hair-2); border-radius:16px;
  background:var(--panel-2); color:var(--text);
  font-family:var(--mono); font-size:12px; font-weight:600;
  letter-spacing:.16em; text-transform:uppercase;
  padding:17px 20px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:10px;
  transition:transform .12s var(--ease), background .2s, border-color .2s;
}
.act:hover{ background:#1D222E; border-color:rgba(255,255,255,.24); }
.act:active{ transform:scale(.985); background:#161a24; }
.act:focus-visible{ outline:2px solid var(--grey); outline-offset:2px; }
.act.accent{ border-color:var(--pc); color:var(--pc); background:transparent; }
.act.accent:hover{ background:color-mix(in srgb, var(--pc) 10%, transparent); }

/* ---------- pass screen ---------- */

.pass{ align-items:center; justify-content:center; gap:0; cursor:pointer; text-align:center; }
.pass .glyph{ width:96px; height:96px; margin-bottom:26px; }
.pass .who{
  font-family:var(--mono); font-size:clamp(26px,8vw,34px); font-weight:700;
  letter-spacing:-.02em; color:var(--pc);
}
.pass .msg{ margin-top:10px; color:var(--grey); font-size:14.5px; }
.pass .hint{ margin-top:34px; animation:breathe 2.4s ease-in-out infinite; }
@keyframes breathe{ 50%{ opacity:.35; } }

/* ---------- timer screen ---------- */

.timer{ align-items:center; justify-content:space-between; gap:14px; padding-top:6px; }

.target{ text-align:center; display:flex; flex-direction:column; align-items:center; gap:7px; }
.target .val{
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:clamp(46px,15vw,62px); font-weight:700; line-height:1;
  letter-spacing:-.045em;
}
.target .val small{ font-size:.4em; font-weight:600; color:var(--grey); margin-left:3px; letter-spacing:0; }

/* the readout window — where digits dissolve */
.window{
  position:relative; width:100%; height:104px; flex:none;
  display:grid; place-items:center;
  border-block:1px solid var(--hair);
}
.window::before, .window::after{
  content:''; position:absolute; top:0; bottom:0; width:1px; background:var(--hair);
}
.window::before{ left:0; } .window::after{ right:0; }

.window .layer{ position:absolute; inset:0; display:grid; place-items:center; padding-inline:18px; }

.live{
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:52px; font-weight:600; letter-spacing:-.04em;
  color:var(--pc);
  transition:opacity .3s var(--ease), filter .3s var(--ease), transform .3s var(--ease);
}
.live.gone{ opacity:0; filter:blur(15px); transform:scale(.94); }

.shutter{
  position:absolute; left:0; right:0; height:1px; top:0;
  background:var(--pc); opacity:0;
}
.shutter.run{ animation:sweep .34s var(--ease) forwards; }
@keyframes sweep{
  0%{ opacity:0; top:0; }
  18%{ opacity:.9; }
  100%{ opacity:0; top:100%; }
}

/* engraved tick scale for the blind phase */
.ticks{
  width:100%; height:34px; opacity:0;
  color:var(--pc);
  background-image:repeating-linear-gradient(90deg, currentColor 0 1px, transparent 1px 10px);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);
}
.blindmsg{ position:absolute; bottom:9px; left:0; right:0; text-align:center; opacity:0; transition:opacity .5s .2s; }
.blindmsg.on{ opacity:1; }

.locked{ display:flex; flex-direction:column; align-items:center; gap:10px; animation:screenIn .26s var(--ease) both; }
.locked .tick{ width:34px; height:34px; color:var(--pc); }
.locked .tick path{ fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:32; stroke-dashoffset:32; animation:draw .3s var(--ease) forwards; }

/* the actuator */
.actuator{
  position:relative; flex:none;
  width:min(60vw,232px); aspect-ratio:1/1;
  margin-bottom:6px;
  appearance:none; border:0; padding:0; cursor:pointer;
  border-radius:50%;
  background:radial-gradient(120% 120% at 50% 18%, #232936 0%, #161A24 52%, #0F131B 100%);
  color:var(--pc);
  display:grid; place-items:center;
  box-shadow:
    0 1px 0 rgba(255,255,255,.10) inset,
    0 -14px 26px rgba(0,0,0,.5) inset,
    0 14px 34px rgba(0,0,0,.55),
    0 0 0 1px rgba(255,255,255,.06);
  transition:transform .09s var(--ease), box-shadow .09s var(--ease), color .3s;
}
.actuator .cap{
  position:absolute; inset:13px; border-radius:50%;
  border:1px solid currentColor; opacity:.34;
  transition:opacity .2s, transform .3s var(--ease);
}
.actuator .cap2{
  position:absolute; inset:13px; border-radius:50%;
  box-shadow:0 0 34px -4px currentColor; opacity:.22;
  transition:opacity .3s;
}
.actuator .txt{
  position:relative; font-family:var(--mono);
  font-size:15px; font-weight:700; letter-spacing:.26em; text-transform:uppercase;
  text-indent:.26em;
}
.actuator:active{
  transform:scale(.955) translateY(2px);
  box-shadow:
    0 2px 3px rgba(255,255,255,.05) inset,
    0 -4px 16px rgba(0,0,0,.45) inset,
    0 4px 10px rgba(0,0,0,.5),
    0 0 0 1px rgba(255,255,255,.06);
}
.actuator:active .cap{ opacity:.75; transform:scale(.97); }
.actuator:focus-visible{ outline:2px solid var(--pc); outline-offset:6px; }
.actuator.running .cap2{ opacity:.42; }
.actuator[disabled]{ cursor:default; color:var(--grey-dim); }
.actuator[disabled] .cap2{ opacity:0; }

/* ---------- reveal ---------- */

.reveal{ justify-content:center; gap:20px; }

.rev-head{ text-align:center; display:flex; flex-direction:column; gap:6px; }
.rev-head .t{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:24px; font-weight:600; letter-spacing:-.02em; }

.cards{ display:grid; grid-template-columns:1fr auto 1fr; align-items:stretch; gap:10px; }
.card{
  border:1px solid var(--hair); border-radius:16px; background:var(--panel);
  padding:15px 10px 14px; text-align:center;
  display:flex; flex-direction:column; gap:8px; align-items:center;
  transition:border-color .4s var(--ease), background .4s var(--ease), transform .45s var(--ease), opacity .45s var(--ease);
}
.card .nm{ font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--pc); }
.card .time{
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:clamp(27px,9vw,34px); font-weight:700; letter-spacing:-.04em; line-height:1;
}
.card .time.masked{ color:var(--grey-dim); }
.card .off{
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:11px; letter-spacing:.05em; color:var(--grey);
  border:1px solid var(--hair); border-radius:999px; padding:4px 9px;
  opacity:0; transition:opacity .3s;
}
.card .off.on{ opacity:1; }
.card.dim{ opacity:.4; transform:scale(.96); }
.card.hero{ border-color:var(--pc); background:var(--panel-2); transform:scale(1.035); box-shadow:0 0 30px -12px var(--pc); }
.card.shiver{ animation:shiver .9s ease-in-out infinite; }
@keyframes shiver{ 50%{ transform:translateY(-2px); } }

.vs{ display:grid; place-items:center; }
.vs span{ font-family:var(--mono); font-size:9px; letter-spacing:.18em; color:var(--grey-dim); }

/* photo-finish scale: -1.5 … target … +1.5 */
.finish{ position:relative; padding:22px 0 26px; }
.finish .axis{ height:1px; background:var(--hair-2); position:relative; }
.finish .zero{
  position:absolute; left:50%; top:-13px; bottom:-13px; width:1px;
  background:var(--text); opacity:.55;
}
.finish .bound{ position:absolute; top:-7px; bottom:-7px; width:1px; background:var(--void); opacity:.5; }
.finish .bound.l{ left:0; } .finish .bound.r{ right:0; }
.finish .cap{ position:absolute; top:14px; font-family:var(--mono); font-size:9px; letter-spacing:.14em; color:var(--grey-dim); }
.finish .cap.l{ left:0; } .finish .cap.r{ right:0; }
.finish .cap.c{ left:50%; transform:translateX(-50%); color:var(--grey); }
.finish .pin{
  position:absolute; top:-24px; width:2px; height:20px; border-radius:2px;
  background:var(--pc); transform:translateX(-1px);
  opacity:0; transition:left .62s var(--ease), opacity .3s;
  box-shadow:0 0 10px -1px var(--pc);
}
.finish .pin.p2{ top:4px; }
.finish .pin.on{ opacity:1; }
.finish .pin::after{
  content:attr(data-mk); position:absolute; left:50%; transform:translateX(-50%);
  font-family:var(--mono); font-size:10px; font-weight:700; color:var(--pc);
}
.finish .pin::after{ top:-15px; }
.finish .pin.p2::after{ top:22px; }

.banner{
  min-height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  text-align:center;
}
.banner .head{
  font-family:var(--mono); font-size:clamp(14px,4.6vw,17px); font-weight:700;
  letter-spacing:.06em; text-transform:uppercase;
  animation:screenIn .4s var(--ease) both;
}
.banner .sub{ font-size:12.5px; color:var(--grey); animation:screenIn .4s .06s var(--ease) both; }
.dots{ display:flex; gap:7px; }
.dots i{ width:5px; height:5px; border-radius:50%; background:var(--grey-dim); animation:bump 1.05s ease-in-out infinite; }
.dots i:nth-child(2){ animation-delay:.14s; } .dots i:nth-child(3){ animation-delay:.28s; }
@keyframes bump{ 30%{ transform:translateY(-5px); background:var(--text); } }

/* ---------- place / over ---------- */

.place, .over{ justify-content:center; gap:26px; }
.place .head, .over .head{ text-align:center; display:flex; flex-direction:column; gap:7px; }
.place .who{ font-family:var(--mono); font-size:clamp(19px,6vw,24px); font-weight:700; letter-spacing:-.01em; color:var(--pc); }
.place .sub, .over .sub{ font-size:13.5px; color:var(--grey); }
.over .who{
  font-family:var(--mono); font-size:clamp(26px,8.5vw,36px); font-weight:700;
  letter-spacing:-.03em; color:var(--pc);
}

.foot{ display:flex; flex-direction:column; gap:10px; flex:none; padding-top:14px; }

/* Short screens: compress rather than hide. The rules are how you learn the
   game, so they stay on the page all the way down to a 320x568 handset. */
@media (max-height:700px){
  .home{ gap:18px; }
  .wordmark h1{ font-size:clamp(26px,8.5vw,34px); }
  .wordmark p{ font-size:13px; }
  .demo{ height:64px; } .demo .readout{ font-size:32px; }
  .rules ol{ gap:7px; } .rules li{ font-size:12px; line-height:1.35; }
  .target .val{ font-size:clamp(38px,11.5vw,48px); }
  .window{ height:78px; } .live{ font-size:40px; }
  .timer{ gap:8px; }
  .actuator{ width:min(52vw,188px); }
  .board.lg{ max-width:min(70vw,270px); }
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.06s !important; }
  .mk.anim line, .mk.anim circle, .winline line{ stroke-dashoffset:0 !important; }
}
</style>

<div id="app">
  <header id="hud">
    <div class="slot"><span class="lbl" id="roundLbl">Round 1</span></div>
    <div class="slot mid" id="mini"></div>
    <div class="slot right">
      <button class="icon-btn" id="sndBtn" type="button" aria-label="Mute sound"></button>
    </div>
  </header>
  <main id="stage"></main>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   Constants
   ============================================================ */

var LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
var VOID_LIMIT = 1.5;      // both players further off than this -> round is void
var TARGET_MIN = 3.00, TARGET_MAX = 8.00;
var BLIND_AT   = 1000;     // ms after Start when the digits dissolve
var ARM_DELAY  = 200;      // ms guard so a double-tap can't stop instantly

var P = [
  { name:"Player 1", mark:"X", col:"#FF6154", glow:"rgba(255,97,84,.16)" },
  { name:"Player 2", mark:"O", col:"#8B7BFF", glow:"rgba(139,123,255,.16)" }
];

/* ============================================================
   State
   ============================================================ */

var S = {
  board:      new Array(9).fill(null),
  lastPlaced: -1,
  first:      0,        // which player acts first this round
  turnIdx:    0,        // 0 = first player's attempt, 1 = second player's
  target:     0,
  times:      [null,null],
  devs:       [null,null],
  outcome:    null,     // "win" | "tie" | "void"
  winner:     null,
  result:     null,     // { winner:0|1|null, line:[..]|null }
  series:     [0,0],
  replay:     null      // "tie" | "void" when the round is being re-run
};

var stage    = document.getElementById("stage");
var hud      = document.getElementById("hud");
var app      = document.getElementById("app");
var roundLbl = document.getElementById("roundLbl");
var mini     = document.getElementById("mini");
var sndBtn   = document.getElementById("sndBtn");

/* ============================================================
   Timers — everything schedulable is tracked so a screen change
   or a fast-forward can tear it all down cleanly.
   ============================================================ */

var pending = [], frames = [];

function later(fn, ms){ var id = setTimeout(fn, ms); pending.push(id); return id; }
function frame(fn){ var id = requestAnimationFrame(fn); frames.push(id); return id; }
function haltAll(){
  pending.forEach(clearTimeout); pending.length = 0;
  frames.forEach(cancelAnimationFrame); frames.length = 0;
}

/* ============================================================
   Sound — small synth, no assets.
   ============================================================ */

var sfx = (function(){
  var ctx = null, muted = false;

  function C(){
    if(!ctx){
      var A = window.AudioContext || window.webkitAudioContext;
      if(!A) return null;
      try { ctx = new A(); } catch(e){ return null; }
    }
    if(ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  function osc(o){
    var c = C(); if(!c || muted) return;
    var t = c.currentTime + (o.at || 0);
    var a = o.a || .006, d = o.d || .2, v = o.v || .2;
    var n = c.createOscillator();
    n.type = o.type || "sine";
    n.frequency.setValueAtTime(o.f, t);
    if(o.f2) n.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), t + a + d);
    var g = c.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(v, t + a);
    g.gain.exponentialRampToValueAtTime(.0001, t + a + d);
    n.connect(g); g.connect(c.destination);
    n.start(t); n.stop(t + a + d + .03);
  }

  function noise(o){
    var c = C(); if(!c || muted) return;
    var t = c.currentTime + (o.at || 0), d = o.d || .05, v = o.v || .18;
    var len = Math.ceil(c.sampleRate * (d + .02));
    var buf = c.createBuffer(1, len, c.sampleRate);
    var dat = buf.getChannelData(0);
    for(var i=0;i<len;i++) dat[i] = Math.random()*2 - 1;
    var src = c.createBufferSource(); src.buffer = buf;
    var flt = c.createBiquadFilter(); flt.type = "highpass"; flt.frequency.value = o.hp || 900;
    var g = c.createGain();
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + d);
    src.connect(flt); flt.connect(g); g.connect(c.destination);
    src.start(t); src.stop(t + d + .02);
  }

  return {
    warm:  function(){ C(); },
    muted: function(){ return muted; },
    toggle:function(){ muted = !muted; if(!muted){ C(); this.tap(); } return muted; },

    tap:   function(){ osc({ f:520, f2:660, d:.07, v:.10, type:"triangle" }); },
    start: function(){ osc({ f:400, f2:620, d:.10, v:.13 }); },

    /* the money sound: a low thock with a click transient on top */
    stop:  function(){
      osc({ f:196, f2:58,  d:.22, v:.34 });
      osc({ f:880, f2:290, d:.055, v:.10, type:"triangle" });
      noise({ d:.042, v:.16, hp:1600 });
    },

    ping:  function(i){ osc({ f: i ? 700 : 540, d:.19, v:.15, type:"triangle" }); },
    tense: function(){ for(var k=0;k<3;k++) osc({ f:112, at:k*.26, d:.15, v:.11 }); },
    win:   function(){ [523,659,784].forEach(function(f,i){ osc({ f:f, at:i*.075, d:.32, v:.17, type:"triangle" }); }); },
    tie:   function(){ osc({ f:466, d:.13, v:.14 }); osc({ f:466, at:.17, d:.13, v:.14 }); },
    voided:function(){ osc({ f:300, f2:110, d:.32, v:.13, type:"sawtooth" }); },
    place: function(){ osc({ f:300, f2:540, d:.09, v:.18 }); noise({ d:.03, v:.08, hp:2200 }); },
    game:  function(){ [523,659,784,1047].forEach(function(f,i){ osc({ f:f, at:i*.1, d:.45, v:.19, type:"triangle" }); }); },
    draw:  function(){ osc({ f:420, f2:320, d:.4, v:.14 }); }
  };
})();

function buzz(pattern){
  if(navigator.vibrate){ try { navigator.vibrate(pattern); } catch(e){} }
}

var ICON_ON  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
var ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/></svg>';

sndBtn.innerHTML = ICON_ON;
sndBtn.addEventListener("click", function(){

});

/* ============================================================
   Small helpers
   ============================================================ */

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]; }); }
function fx2(n){ return n.toFixed(2); }
function marksOn(){ return S.board.filter(Boolean).length; }
function actor(){ return S.turnIdx === 0 ? S.first : 1 - S.first; }

function accent(i){
  var c = i === null || i === undefined ? null : P[i];
  app.style.setProperty("--pc", c ? c.col : "#8A8FA0");
  app.style.setProperty("--glow", c ? c.glow : "rgba(120,130,160,.10)");
}

function markSVG(m, animate){
  var cls = "mk mk-" + m.toLowerCase() + (animate ? " anim" : "");
  if(m === "X"){
    return '<svg class="'+cls+'" viewBox="0 0 100 100" aria-hidden="true">'
         + '<line class="s1" x1="24" y1="24" x2="76" y2="76"/>'
         + '<line class="s2" x1="76" y1="24" x2="24" y2="76"/></svg>';
  }
  return '<svg class="'+cls+'" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="26"/></svg>';
}

function winLineSVG(){
  if(!S.result || !S.result.line) return "";
  var L = S.result.line, a = L[0], c = L[2];
  var px = function(i){ return [ (i%3)*33.333 + 16.667, Math.floor(i/3)*33.333 + 16.667 ]; };
  var A = px(a), B = px(c);
  var dx = B[0]-A[0], dy = B[1]-A[1], len = Math.hypot(dx,dy);
  var ex = dx/len*11, ey = dy/len*11;
  return '<svg class="winline" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'
       + '<line x1="'+(A[0]-ex)+'" y1="'+(A[1]-ey)+'" x2="'+(B[0]+ex)+'" y2="'+(B[1]+ey)+'"/></svg>';
}

// live === the player index allowed to tap, or null for a display-only board
function boardHTML(size, live){
  var mark = live === null || live === undefined ? null : P[live].mark;
  var cells = S.board.map(function(v, i){
    var isWin = S.result && S.result.line && S.result.line.indexOf(i) > -1;
    var open  = !v && mark;
    var inner = v ? markSVG(v, i === S.lastPlaced)
                  : (open ? '<span class="ghost">' + markSVG(mark, false) + "</span>" : "");
    return '<button type="button" class="cell'+(open?" live":"")+(isWin?" wincell":"")+'"'
         + ' data-i="'+i+'"'+(open?"":" disabled")
         + ' aria-label="Square '+(i+1)+(v?", "+v:", empty")+'">'
         + '<span class="pad">'+inner+"</span></button>";
  }).join("");
  return '<div class="board '+size+'" role="group" aria-label="Board">' + cells + winLineSVG() + "</div>";
}

/* ============================================================
   Chrome
   ============================================================ */

function paintHud(show){
  hud.classList.toggle("recede", !show);
  roundLbl.textContent = "Round " + (marksOn() + 1);
  mini.innerHTML = boardHTML("sm", null);
}

   Screens

function show(html){

}

/* ---- home -------------------------------------------------- */

function screenHome(){
  accent(null);
  paintHud(false);
  show(
    '<div class="screen home">'
    + '<div class="wordmark">'
    +   '<h1>Timer<br><span class="l2">Tic&#8209;Tac&#8209;Toe</span></h1>'
    +   '<div class="rule"></div>'
    +   '<p>Two players, one phone. Stop the clock closest to the target and you win the square.</p>'
    + '</div>'
    + '<div class="demo">'
    +   '<div class="layer scale"><span class="readout" id="demoNum">0.00</span></div>'
    +   '<div class="layer scale"><span class="ticks" id="demoTicks" style="color:#8A8FA0"></span></div>'
    + '</div>'
    + '<div class="rules"><ol>'
    +   '<li><span class="n">01</span><span>A target between <b>3.00</b> and <b>8.00</b> seconds appears. Tap Start, then Stop when you think you&rsquo;ve hit it.</span></li>'
    +   '<li><span class="n">02</span><span>After one second the digits <b>disappear</b>. From there you&rsquo;re on instinct alone.</span></li>'
    +   '<li><span class="n">03</span><span>Closest player takes a square. Both off by more than <b>1.50s</b> and the round is void.</span></li>'
    + '</ol></div>'
    + '<div class="foot"><button class="act" id="go" type="button">Start match</button></div>'
    + '</div>'
  );

  document.getElementById("go").addEventListener("click", function(){
    sfx.warm(); sfx.tap();
    S.series = S.series; newMatch();
  });

  // Hero: the instrument demonstrating its own central trick, on a loop.
  var num = document.getElementById("demoNum"), tk = document.getElementById("demoTicks");
  var t0 = performance.now();
  (function loop(now){
    var t = ((now - t0) % 4200);
    if(t < 1000){
      num.style.opacity = 1; num.style.filter = "none";
      num.textContent = fx2(t/1000);
      tk.style.opacity = 0;
    } else if(t < 1340){
      var k = (t - 1000)/340;
      num.style.opacity = String(1-k);
      num.style.filter = "blur(" + (k*15).toFixed(1) + "px)";
      tk.style.opacity = String(k*.5);
    } else {
      num.style.opacity = 0;
      var s = (t - 1340)/1000;
      tk.style.opacity = String(.28 + .22*(.5+.5*Math.sin(s*1.7)) + .14*(.5+.5*Math.sin(s*.61+1.3)));
    }
    frame(loop);
  })(t0);
}

/* ---- pass the device --------------------------------------- */

function screenPass(){
  var p = actor();
  accent(p);
  paintHud(true);

  var lead;
  if(S.replay === "tie")       lead = "Sudden death. New target, same stakes.";
  else if(S.replay === "void") lead = "Round replayed. New target.";
  else if(S.turnIdx === 0)     lead = "You go first this round.";
  else                         lead = "Hand the phone over.";

  show(
    '<div class="screen pass" id="passHit" role="button" tabindex="0" aria-label="Tap to continue">'
    + '<div class="glyph">' + markSVG(P[p].mark, true) + '</div>'
    + '<div class="who">' + esc(P[p].name) + '</div>'
    + '<div class="msg">' + esc(lead) + '</div>'
    + '<div class="hint lbl">Tap anywhere when ready</div>'
    + '</div>'
  );

  var hit = document.getElementById("passHit");
  function advance(){ sfx.warm(); sfx.tap(); screenTimer(); }
  hit.addEventListener("click", advance);
  hit.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); advance(); }
  });
  hit.focus({ preventScroll:true });
}

/* ---- the timer --------------------------------------------- */

function screenTimer(){
  var p = actor();
  accent(p);
  paintHud(true);

  show(
    '<div class="screen timer">'
    + '<div class="target">'
    +   '<span class="lbl">Target</span>'
    +   '<span class="val">' + fx2(S.target) + '<small>s</small></span>'
    + '</div>'
    + '<div class="window" id="win">'
    +   '<div class="layer"><span class="live" id="live">0.00</span></div>'
    +   '<div class="layer"><span class="ticks" id="ticks"></span></div>'
    +   '<div class="shutter" id="shutter"></div>'
    +   '<div class="blindmsg lbl" id="blind">Running blind</div>'
    + '</div>'
    + '<button class="actuator" id="act" type="button">'
    +   '<span class="cap2"></span><span class="cap"></span><span class="txt" id="actTxt">Start</span>'
    + '</button>'
    + '</div>'
  );

  var winEl  = document.getElementById("win");
  var live   = document.getElementById("live");
  var ticks  = document.getElementById("ticks");
  var shut   = document.getElementById("shutter");
  var blind  = document.getElementById("blind");
  var btn    = document.getElementById("act");
  var btnTxt = document.getElementById("actTxt");

  var running = false, armed = false, done = false, t0 = 0;

  function begin(){
    running = true; t0 = performance.now();
    btnTxt.textContent = "Stop";
    btn.classList.add("running");
    hud.classList.add("recede");
    sfx.start(); buzz(8);
    later(function(){ armed = true; }, ARM_DELAY);

    (function tick(now){
      if(!running) return;
      var ms = now - t0;
      if(ms < BLIND_AT){
        live.textContent = fx2(ms/1000);
      } else if(!live.classList.contains("gone")){
        // the dissolve
        live.classList.add("gone");
        shut.classList.add("run");
        blind.classList.add("on");
      } else {
        // quasi-periodic breathing — two incommensurate sines, so the
        // pulse can't be used as a metronome to count the seconds out.
        var s = (ms - BLIND_AT)/1000;
        ticks.style.opacity = (0.26 + 0.24*(0.5+0.5*Math.sin(s*1.7)) + 0.16*(0.5+0.5*Math.sin(s*0.61+1.3))).toFixed(3);
      }
      frame(tick);
    })(performance.now());
  }

  function end(){
    running = false; done = true;
    var elapsed = Math.round((performance.now() - t0)/10)/100;   // centiseconds
    S.times[p] = elapsed;
    S.devs[p]  = Math.round(Math.abs(elapsed - S.target)*100)/100;

    sfx.stop(); buzz([16,26,12]);

    btn.disabled = true;
    btn.classList.remove("running");
    btnTxt.textContent = "Locked";
    winEl.innerHTML =
      '<div class="layer"><div class="locked">'
      + '<svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12.5 5.2 5.2L20 7"/></svg>'
      + '<span class="lbl">Time recorded</span>'
      + '</div></div>';

    later(function(){
      if(S.turnIdx === 0){ S.turnIdx = 1; screenPass(); }
      else screenReveal();
    }, 760);
  }

  btn.addEventListener("click", function(){
    if(done) return;
    if(!running) begin();
    else if(armed) end();
  });
  btn.focus({ preventScroll:true });
}

/* ---- reveal ------------------------------------------------ */

function screenReveal(){
  accent(null);
  paintHud(true);

  var d0 = S.devs[0], d1 = S.devs[1];
  if(d0 > VOID_LIMIT && d1 > VOID_LIMIT){ S.outcome = "void";  S.winner = null; }
  else if(d0 === d1)                    { S.outcome = "tie";   S.winner = null; }
  else                                  { S.outcome = "win";   S.winner = d0 < d1 ? 0 : 1; }

  function pinPos(i){
    var delta = S.times[i] - S.target;                       // signed: early is negative
    var clamped = Math.max(-VOID_LIMIT, Math.min(VOID_LIMIT, delta));
    return (50 + (clamped / VOID_LIMIT) * 50);
  }

  function cardHTML(i){
    return '<div class="card" id="c'+i+'" style="--pc:'+P[i].col+'">'
         + '<span class="nm">' + esc(P[i].name) + " &middot; " + P[i].mark + '</span>'
         + '<span class="time masked" id="t'+i+'">&mdash;.&mdash;&mdash;</span>'
         + '<span class="off" id="o'+i+'">&mdash;</span>'
         + '</div>';
  }

  show(
    '<div class="screen reveal">'
    + '<div class="rev-head"><span class="lbl">Target was</span><span class="t">' + fx2(S.target) + 's</span></div>'
    + '<div class="cards">' + cardHTML(0) + '<div class="vs"><span>VS</span></div>' + cardHTML(1) + '</div>'
    + '<div class="finish">'
    +   '<div class="pin"    id="p0" data-mk="X" style="--pc:'+P[0].col+'; left:50%"></div>'
    +   '<div class="pin p2" id="p1" data-mk="O" style="--pc:'+P[1].col+'; left:50%"></div>'
    +   '<div class="axis">'
    +     '<div class="bound l"></div><div class="zero"></div><div class="bound r"></div>'
    +     '<span class="cap l">&minus;1.50 early</span>'
    +     '<span class="cap c">Target</span>'
    +     '<span class="cap r">+1.50 late</span>'
    +   '</div>'
    + '</div>'
    + '<div class="banner" id="banner" aria-live="polite"><div class="dots"><i></i><i></i><i></i></div></div>'
    + '<div class="foot" id="foot"></div>'
    + '</div>'
  );

  var banner = document.getElementById("banner");
  var foot   = document.getElementById("foot");

  function drop(i, instant){
    var el  = document.getElementById("t" + i);
    var off = document.getElementById("o" + i);
    var pin = document.getElementById("p" + i);
    var v   = S.times[i], delta = v - S.target;

    el.classList.remove("masked");
    off.textContent = (S.devs[i] > VOID_LIMIT ? "VOID • " : "")
                    + (delta < 0 ? "−" : "+") + fx2(Math.abs(delta)) + "s "
                    + (delta < 0 ? "early" : "late");
    if(S.devs[i] > VOID_LIMIT) off.style.color = "var(--void)";

    pin.style.left = pinPos(i) + "%";
    pin.classList.add("on");
    sfx.ping(i); buzz(10);

    if(instant){ el.textContent = fx2(v); off.classList.add("on"); return; }

    var t0 = performance.now(), dur = 420;
    (function roll(now){
      var k = Math.min(1, (now - t0)/dur);
      var e = 1 - Math.pow(1 - k, 3);
      el.textContent = fx2(v * e);
      if(k < 1) frame(roll); else { el.textContent = fx2(v); off.classList.add("on"); }
    })(t0);
  }

  function tension(instant){
    if(instant) return;
    document.getElementById("c0").classList.add("shiver");
    document.getElementById("c1").classList.add("shiver");
    sfx.tense();
  }

  function settle(){
    document.getElementById("c0").classList.remove("shiver");
    document.getElementById("c1").classList.remove("shiver");

    var head, sub, label, tint;

    if(S.outcome === "win"){
      var w = S.winner;
      document.getElementById("c" + w).classList.add("hero");
      document.getElementById("c" + (1-w)).classList.add("dim");
      head  = P[w].name + " takes the square";
      sub   = "Off by " + fx2(S.devs[w]) + "s versus " + fx2(S.devs[1-w]) + "s.";
      label = "Place your " + P[w].mark;
      tint  = P[w].col;
      accent(w);
      sfx.win(); buzz([28,44,64]);
    } else if(S.outcome === "tie"){
      document.getElementById("c0").classList.add("hero");
      document.getElementById("c1").classList.add("hero");
      head  = "Dead heat";
      sub   = "Both off by exactly " + fx2(S.devs[0]) + "s. Sudden death — replay for a new target.";
      label = "Replay round";
      tint  = "#EDEFF5";
      sfx.tie(); buzz([20,60,20]);
    } else {
      document.getElementById("c0").classList.add("dim");
      document.getElementById("c1").classList.add("dim");
      head  = "Round void";
      sub   = "Both players missed by more than " + fx2(VOID_LIMIT) + "s. Nobody marks the board.";
      label = "New target";
      tint  = "var(--void)";
      sfx.voided(); buzz([50]);
    }

    banner.innerHTML = '<div class="head" style="color:'+tint+'">'+esc(head)+'</div><div class="sub">'+esc(sub)+'</div>';
    foot.innerHTML   = '<button class="act accent" id="next" type="button">'+esc(label)+'</button>';
    document.getElementById("next").addEventListener("click", function(){
      sfx.tap();
      if(S.outcome === "win") screenPlace();
      else startRound(S.outcome);
    });
  }

  var steps = [[300, drop.bind(null,0)], [1200, drop.bind(null,1)], [2000, tension], [2800, settle]];
  var at = 0;

  steps.forEach(function(s, i){
    later(function(){ if(i >= at){ at = i + 1; s[1](false); } }, s[0]);
  });

  // Tapping anywhere fast-forwards to the verdict — replays shouldn't drag.
  stage.querySelector(".reveal").addEventListener("click", function(e){
    if(at >= steps.length || e.target.closest("button")) return;
    haltAll();
    while(at < steps.length){ steps[at][1](true); at++; }
  });
}

/* ---- place a mark ------------------------------------------ */

function screenPlace(){
  var w = S.winner;
  accent(w);
  paintHud(true);

  show(
    '<div class="screen place">'
    + '<div class="head">'
    +   '<span class="lbl">Round won by</span>'
    +   '<span class="who">' + esc(P[w].name) + '</span>'
    +   '<span class="sub">Choose a square for your ' + P[w].mark + '.</span>'
    + '</div>'
    + '<div id="boardWrap">' + boardHTML("lg", w) + '</div>'
    + '</div>'
  );

  document.getElementById("boardWrap").addEventListener("click", function(e){
    var cell = e.target.closest(".cell.live");
    if(!cell) return;
    commit(parseInt(cell.dataset.i, 10), w);
  });
}

function commit(i, w){
  S.board[i] = P[w].mark;
  S.lastPlaced = i;
  sfx.place(); buzz(14);

  S.result = judge();
  document.getElementById("boardWrap").innerHTML = boardHTML("lg", null);
  paintHud(true);

  if(S.result){
    if(S.result.winner !== null){ S.series[S.result.winner]++; later(sfx.game, 420); }
    else later(sfx.draw, 320);
    later(screenOver, S.result.line ? 1500 : 900);
  } else {
    later(function(){ startRound(null); }, 860);
  }
}

function judge(){
  for(var i=0;i<LINES.length;i++){
    var L = LINES[i], a = S.board[L[0]];
    if(a && a === S.board[L[1]] && a === S.board[L[2]]){
      return { winner: a === "X" ? 0 : 1, line: L };
    }
  }
  if(S.board.every(Boolean)) return { winner:null, line:null };
  return null;
}

/* ---- game over --------------------------------------------- */

function screenOver(){
  var w = S.result.winner;
  accent(w);
  paintHud(false);

  var head = w === null ? "Draw" : P[w].name + " wins";
  var sub  = w === null
    ? "Board full, no line. Honours even."
    : "Three in a row with " + P[w].mark + ".";

  show(
    '<div class="screen over">'
    + '<div class="head">'
    +   '<span class="lbl">' + (w === null ? "Stalemate" : "Match") + '</span>'
    +   '<span class="who">' + esc(head) + '</span>'
    +   '<span class="sub">' + esc(sub) + '</span>'
    + '</div>'
    + boardHTML("lg", null)
    + '<div class="series">'
    +   '<span class="sc" style="color:'+P[0].col+'">' + S.series[0] + '</span>'
    +   '<span class="vs">Series</span>'
    +   '<span class="sc" style="color:'+P[1].col+'">' + S.series[1] + '</span>'
    + '</div>'
    + '<div class="foot">'
    +   '<button class="act" id="again" type="button">Play again</button>'
    + '</div>'
    + '</div>'
  );

  document.getElementById("again").addEventListener("click", function(){ sfx.tap(); newMatch(); });
}

/* ============================================================
   Flow
   ============================================================ */

function newMatch(){
  S.board = new Array(9).fill(null);
  S.lastPlaced = -1;
  S.result = null;
  S.first = Math.random() < .5 ? 0 : 1;     // new random starting player
  startRound(null, true);
}

// reason: null for a fresh round, "tie" or "void" for a replay.
function startRound(reason, keepFirst){
  S.target  = Math.round((TARGET_MIN + Math.random() * (TARGET_MAX - TARGET_MIN)) * 100) / 100;
  S.times   = [null,null];
  S.devs    = [null,null];
  S.turnIdx = 0;
  S.outcome = null;
  S.winner  = null;
  S.replay  = reason;
  // Alternate who acts first so neither player always closes the round.
  if(!keepFirst) S.first = 1 - S.first;
  screenPass();
}

screenHome();

})();
</script>

/* ============================================================
   Bot
   ============================================================ */

var BOT={
  /* --- boards --- */
  move:function(cells,board,me){
    return board==="ttt" ? this.ttt(cells,me) : this.c4(cells,me);
  },
  /* perfect 3x3 search, with a deliberate slip now and then so it stays beatable */
  ttt:function(cells,me){
    var open=[]; cells.forEach(function(v,i){ if(!v) open.push(i); });
    if(!open.length) return -1;
    if(Math.random()<0.14) return open[Math.floor(Math.random()*open.length)];
    var b=BOARDS.ttt, mk=me===0?"X":"O", best=-Infinity, pick=open[0];
    open.forEach(function(i){
      var c=cells.slice(); c[i]=mk;
      var s=BOT.mm(c,b,mk,false,0);
      if(s>best){ best=s; pick=i; }
    });
    return pick;
  },
  mm:function(cells,b,mk,maxing,d){
    var r=judgeOn(cells,b);
    if(r){ if(r.winner===null) return 0; return (r.winner===(mk==="X"?0:1)) ? 10-d : d-10; }
    var other=mk==="X"?"O":"X", turn=maxing?mk:other, best=maxing?-Infinity:Infinity;
    for(var i=0;i<cells.length;i++){
      if(cells[i]) continue;
      cells[i]=turn;
      var s=BOT.mm(cells,b,mk,!maxing,d+1);
      cells[i]=null;
      best=maxing?Math.max(best,s):Math.min(best,s);
    }
    return best===Infinity||best===-Infinity?0:best;
  },
  /* connect 4: alpha-beta to a shallow depth over a window-count evaluation */
  c4:function(cells,me){
    var b=BOARDS.c4, mk=me===0?"X":"O", cols=[];
    for(var c=0;c<b.cols;c++) if(BOT.free(cells,b,c)>=0) cols.push(c);
    if(!cols.length) return -1;
    var best=-Infinity, pick=cols[Math.floor(cols.length/2)];
    /* centre-out ordering makes the pruning bite */
    cols.sort(function(a,z){ return Math.abs(a-3)-Math.abs(z-3); });
    cols.forEach(function(c){
      var n=BOT.play(cells,b,c,mk);
      var s=BOT.ab(n,b,mk,4,-Infinity,Infinity,false)+Math.random()*0.6;
      if(s>best){ best=s; pick=c; }
    });
    return pick;
  },
  free:function(cells,b,c){ for(var r=b.rows-1;r>=0;r--) if(!cells[r*b.cols+c]) return r; return -1; },
  play:function(cells,b,c,mk){ var n=cells.slice(), r=BOT.free(n,b,c); if(r>=0) n[r*b.cols+c]=mk; return n; },
  ab:function(cells,b,mk,depth,a,bb,maxing){
    var r=judgeOn(cells,b);
    if(r){ if(r.winner===null) return 0; return (r.winner===(mk==="X"?0:1)) ? 9000+depth : -9000-depth; }
    if(depth===0) return BOT.score(cells,b,mk);
    var other=mk==="X"?"O":"X", turn=maxing?mk:other, best=maxing?-Infinity:Infinity;
    for(var c=0;c<b.cols;c++){
      if(BOT.free(cells,b,c)<0) continue;
      var s=BOT.ab(BOT.play(cells,b,c,turn),b,mk,depth-1,a,bb,!maxing);
      if(maxing){ best=Math.max(best,s); a=Math.max(a,s); } else { best=Math.min(best,s); bb=Math.min(bb,s); }
      if(bb<=a) break;
    }
    return best===Infinity||best===-Infinity?0:best;
  },
  score:function(cells,b,mk){
    var other=mk==="X"?"O":"X", total=0, dirs=[[0,1],[1,0],[1,1],[1,-1]];
    for(var r=0;r<b.rows;r++) for(var c=0;c<b.cols;c++){
      if(c===3) { var mid=cells[r*b.cols+c]; if(mid===mk) total+=3; else if(mid===other) total-=3; }
      for(var d=0;d<4;d++){
        var dr=dirs[d][0], dc=dirs[d][1], mine=0, theirs=0, ok=true;
        for(var k=0;k<b.need;k++){
          var rr=r+dr*k, cc=c+dc*k;
          if(rr<0||rr>=b.rows||cc<0||cc>=b.cols){ ok=false; break; }
          var v=cells[rr*b.cols+cc];
          if(v===mk) mine++; else if(v===other) theirs++;
        }
        if(!ok||(mine&&theirs)) continue;
        if(mine===3) total+=60; else if(mine===2) total+=9; else if(mine===1) total+=1;
        if(theirs===3) total-=75; else if(theirs===2) total-=11;
      }
    }
    return total;
  },
  /* --- clock --- */
  /* a human-ish miss: usually inside a quarter second, sometimes much worse */
  time:function(target){
    var e=(Math.random()+Math.random()+Math.random()-1.5)/1.5*0.30;
    if(Math.random()<0.12) e*=2.6;
    var t=Math.max(0.15,target+e);
    return Math.round(t*100)/100;
  },
  /* --- numbers --- */
  guess:function(lo,hi,taken){
    var pool=[];
    for(var n=lo;n<=hi;n++) if(taken.indexOf(n)===-1) pool.push(n);
    if(!pool.length) return lo;
    /* halve the range, but not with machine precision */
    var mid=pool[Math.floor(pool.length/2)];
    if(Math.random()<0.25) return pool[Math.floor(Math.random()*pool.length)];
    return mid;
  }
};

/* ============================================================

function logRound(entry){
  entry.r=G.round;
  entry.cells=hasBoard()?G.cells.slice():null;
  entry.board=G.board;
  G.log.push(entry);
  G.round++;
}
function archiveMatch(winner){
  DB.history.unshift({
    ts:Date.now(), game:G.game, board:G.board, vsBot:G.vsBot, winner:winner,
    names:[pname(0),pname(1)], rounds:G.log.slice(-24)
  });
  if(DB.history.length>14) DB.history.length=14;
  save();
}
/* render a board that is not the live one */
function snapshotHTML(cells,board){
  if(!cells) return "";
  var kc=G.cells, kb=G.board, kr=G.result, kf=G.inFlight;
  G.cells=cells; G.board=board||G.board; G.result=null; G.inFlight=-1;
  var html=boardHTML("sm",null);
  G.cells=kc; G.board=kb; G.result=kr; G.inFlight=kf;
  return html;
}
function sheetClose(){ var s=document.getElementById("sheet"); if(s) s.remove(); }

/* The sheet shows one list at a time - this match, or the ones before it - so
   neither has to be scrolled past to reach the other. */
var sheetView={ mode:"live", index:-1 };

  return '<div class="emptylog"><span class="e1">'+esc(t)+'</span><span class="e2">'+esc(d)+"</span></div>";
}
function roundRows(log){
  if(!log||!log.length) return emptyNote("Nothing yet","The first result lands here.");

    return '<div class="hrow" style="--pc:'+(open?"var(--grey-dim)":phex(e.winner))+'">'
      + '<span class="hnum">'+e.r+"</span>"

      +   '<span class="hd">'+esc(e.d)+"</span></span>"
      + (e.cells?'<span class="hmini">'+snapshotHTML(e.cells,e.board)+"</span>":"")
      + "</div>";
  }).join("");
}
function matchLine(m){
  var g=GAMES[m.game]||{name:"Match"};

}
function matchRows(){
  if(!DB.history.length) return emptyNote("No finished matches","Play one through and it is kept here.");
  return DB.history.map(function(m,i){
    var g=GAMES[m.game]||{name:"Match",art:"timer"};

      + '<span class="hicon">'+artFor(g.art)+"</span>"

function matchDetail(m){
  var g=GAMES[m.game]||{name:"Match",art:"timer"};
  var tint=m.winner===null?"var(--grey-dim)":phex(m.winner);
  var last=m.rounds&&m.rounds.length?m.rounds[m.rounds.length-1]:null;
  return '<div class="hsummary" style="--pc:'+tint+'">'
    + '<span class="hicon">'+artFor(g.art)+"</span>"
    + '<span class="body"><span class="big2" style="color:'+tint+'">'
    +   esc(m.winner===null?"Draw":m.names[m.winner]+" won")+"</span>"
    +   '<span class="d">'+esc(matchLine(m))+"</span></span>"
    + (last&&last.cells?'<span class="hmini">'+snapshotHTML(last.cells,m.board)+"</span>":"")

function timeAgo(ts){
  var s=Math.max(0,(Date.now()-ts)/1000);
  if(s<90) return "just now";
  if(s<5400) return Math.round(s/60)+" min ago";
  if(s<172800) return Math.round(s/3600)+"h ago";
  return Math.round(s/86400)+"d ago";
}

  }

    ? DB.chat.map(function(m){
        return '<div class="msg '+(m.from===chatWho?"b":"a")+'" style="--pc:'+phex(m.from)+'">'
          + '<span class="who">'+esc(pname(m.from))+'<span class="tm">'+timeOf(m.ts)+"</span></span>"+esc(m.text)+"</div>";
      }).join("")
    : emptyNote("Nothing said yet","Say something between moves.");
  el.querySelector(".body").innerHTML=
      '<div class="head"><span class="txt"><span class="ttl">Chat</span>'
    +   '<span class="sub">Both of you, on this phone</span></span>'
    +   '<button class="whoami" id="chatWho" type="button" style="--pc:'+phex(chatWho)+'">'
    +     '<span class="dot"></span><span class="nm">'+esc(pname(chatWho))+'</span><span class="sw">'+I.swap+"</span></button>"
    +   '<button class="icon-btn tiny" id="chatX" type="button" aria-label="Close">'+I.close+"</button></div>"
    + '<div class="scroll" id="cmsgs">'+msgs+"</div>"
    + '<div class="composer" style="margin-top:11px;flex:none">'
    +   '<input id="cIn" type="text" maxlength="240" placeholder="Message as '+esc(pname(chatWho))+'" autocomplete="off">'
    +   '<button class="send" id="cSend" type="button" aria-label="Send" disabled>'+I.send+"</button></div>";

  var box=document.getElementById("cmsgs"); box.scrollTop=box.scrollHeight;
  var input=document.getElementById("cIn"), send=document.getElementById("cSend");
  function sync(){ send.disabled=!input.value.trim(); }
  function post(){
    var t=input.value.trim(); if(!t) return;
    DB.chat.push({ from:chatWho, text:t.slice(0,240), ts:Date.now() });
    if(DB.chat.length>200) DB.chat=DB.chat.slice(-200);
    save(); sfx.msg(); buzz(8); input.value=""; openChat();
    var i2=document.getElementById("cIn"); if(i2) i2.focus({preventScroll:true});
  }
  input.addEventListener("input",sync);
  input.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); post(); } });
  send.addEventListener("click",post);
  document.getElementById("chatX").addEventListener("click",function(){ sfx.tap(); sheetClose(); });
  document.getElementById("chatWho").addEventListener("click",function(){
    chatWho=1-chatWho; if(isBot(chatWho)) chatWho=1-chatWho;
    sfx.tap(); openChat();
  });
}

function renderSheet(){
  var el=document.getElementById("sheet");
  if(!el){
    el=document.createElement("div"); el.id="sheet";
    el.innerHTML='<div class="scrim"></div><div class="body"></div>';
    document.body.appendChild(el);
    el.querySelector(".scrim").addEventListener("click",function(){ sfx.tap(); sheetClose(); });
  }
  var body=el.querySelector(".body"), head, main, tabs="";
  if(sheetView.mode==="match"){
    var m=DB.history[sheetView.index];
    if(!m){ sheetView.mode="past"; renderSheet(); return; }
    var g=GAMES[m.game]||{name:"Match"};
    head='<button class="icon-btn tiny" id="sheetBack" type="button" aria-label="All matches">'+I.back+"</button>"
       + '<span class="txt"><span class="ttl">'+esc(g.name)+'</span><span class="sub">'+esc(timeAgo(m.ts))+"</span></span>";
    main=matchDetail(m);
  } else {
    var live=sheetView.mode==="live";
    head='<span class="txt"><span class="ttl">History</span>'
       + '<span class="sub">'+(live?"Every round of the match you are in":"The last "+DB.history.length+" finished matches")+"</span></span>";
    tabs='<div class="segmented">'
      + '<button class="seg'+(live?" on":"")+'" data-seg="live" type="button">This match</button>'
      + '<button class="seg'+(live?"":" on")+'" data-seg="past" type="button">Past matches</button></div>';
    main=live?roundRows(G.log):matchRows();
  }
  body.innerHTML='<div class="head">'+head
    + '<button class="icon-btn tiny" id="sheetX" type="button" aria-label="Close">'+I.close+"</button></div>"
    + tabs+'<div class="scroll">'+main+"</div>";

  body.querySelector("#sheetX").addEventListener("click",function(){ sfx.tap(); sheetClose(); });
  var back=body.querySelector("#sheetBack");
  if(back) back.addEventListener("click",function(){ sfx.tap(); sheetView={mode:"past",index:-1}; renderSheet(); });
  body.querySelectorAll("[data-seg]").forEach(function(b){
    b.addEventListener("click",function(){
      if(sheetView.mode===b.dataset.seg) return;
      sfx.tap(); sheetView={ mode:b.dataset.seg, index:-1 }; renderSheet();
    });
  });
  body.querySelectorAll("[data-match]").forEach(function(b){
    b.addEventListener("click",function(){
      sfx.tap(); sheetView={ mode:"match", index:+b.dataset.match }; renderSheet();
    });
  });
}

/* ============================================================
   Setup - pick the game, the opponent, the board
   ============================================================ */

function show(html){ haltAll(); stage.innerHTML=html; }
function enterGame(){ stage.classList.remove("scrolls"); tabbar.classList.add("hidden"); sheetClose(); }

var pickGame="dtimer", pickBoard="ttt", pickOpp="friend", pickTap=null, pickPool=BID_POOL;

function artSeq(){
  var s="",x=[9,25,41,57];
  SEQ_ITEMS.forEach(function(it,i){
    var g=it.shape==="circle"?'<circle cx="'+(x[i]+7)+'" cy="23" r="7"/>'
        :it.shape==="square"?'<rect x="'+x[i]+'" y="16" width="14" height="14" rx="3"/>'
        :it.shape==="triangle"?'<path d="M'+(x[i]+7)+' 15 L'+(x[i]+14)+' 30 L'+x[i]+' 30 Z"/>'
        :'<path d="M'+(x[i]+7)+' 14 L'+(x[i]+14)+' 23 L'+(x[i]+7)+' 32 L'+x[i]+' 23 Z"/>';
    s+='<g fill="currentColor" opacity="'+(0.45+i*0.18)+'">'+g+"</g>";
  });
  return '<svg viewBox="0 0 74 46" width="100%" height="100%">'+s+"</svg>";
}
function artFor(k){ return k==="ttt"?artTTT():k==="c4"?artC4():k==="number"?artNumber():k==="bid"?artBid():k==="seq"?artSeq():artTimer(); }
function needsThird(id){ var g=GAMES[id]; return g.kind==="duel"||g.kind==="tap"||g.kind==="bid"; }
function oppName(o){ return o==="bot"?"Bot":"a friend"; }
/* the one-liner under a heading: what you have chosen so far */
function pickedSoFar(){
  var g=GAMES[pickGame];
  return g.name+(needsThird(pickGame)?"":" &middot; vs "+oppName(pickOpp));
}

function tile(attr,id,title,desc,art,big){
  return '<button class="tile'+(big?" big":"")+'" data-'+attr+'="'+id+'" type="button">'
    + '<span class="art">'+art+"</span>"
    + '<span class="t">'+title+"</span>"
    + (desc?'<span class="d">'+desc+"</span>":"")+"</button>";
}

/* Setup is a wizard, not a form: one question per screen, and answering it
   moves you on. Two taps starts a classic game, three a duel. */
function screenSetup(step){
  enterGame(); stage.classList.add("scrolls"); accent(phex(DB.me));
  if(step===undefined||step===null){
    pickGame=DB.lastGame; pickBoard=DB.lastBoard; pickOpp=DB.lastOpp;
    pickTap=(typeof DB.lastTap==="number")?DB.lastTap:null;
    pickPool=DB.lastPool||BID_POOL;
    step=0;
  }
  if(step===0) setupGame();
  else if(step===1) setupOpponent();
  else setupThird();
}

function chromeSetup(back,label){
  topbar.classList.remove("recede");
  topbar.innerHTML='<div class="slot">'
    + '<button class="icon-btn tiny" id="upBtn" type="button" aria-label="'+(back===null?"Back to hub":"Back")+'">'
    +   (back===null?I.close:I.back)+"</button>"
    + '<span class="lbl">'+label+"</span></div>"
    + '<div class="slot right">'+soundBtn()+"</div>";
  document.getElementById("upBtn").addEventListener("click",function(){
    sfx.tap();
    if(back===null){ tab="home"; showHub(); } else screenSetup(back);
  });
  wireSound();
}

function setupGame(){
  chromeSetup(null,"New match");
  function row(group){
    return Object.keys(GAMES).filter(function(k){ return GAMES[k].group===group; })
      .map(function(k){ var g=GAMES[k]; return tile("game",k,g.name,"",artFor(g.art)); }).join("");
  }
  show('<div class="screen setup stack">'
     + '<div class="headline mid"><span class="lbl">Step 1 of 2</span><span class="big">Pick a game</span></div>'
     + '<div class="tiles">'+row("classic")+"</div>"
     + '<div class="grouplbl"><span class="lbl">Or duel for a board</span></div>'
     + '<div class="tiles">'+row("duel")+"</div></div>");
  stage.querySelectorAll("[data-game]").forEach(function(b){
    b.addEventListener("click",function(){ pickGame=b.dataset.game; sfx.tap(); screenSetup(1); });
  });
}

function setupOpponent(){
  var g=GAMES[pickGame];
  chromeSetup(0,g.name);
  show('<div class="screen setup stack">'
     + '<div class="headline mid"><span class="lbl">Step 2 of 2</span><span class="big">Who are you playing?</span></div>'
     + '<div class="tiles">'
     +   tile("opp","friend","A friend","Pass and play on this phone",I.duo,true)
     +   tile("opp","bot","The bot","Play on your own",I.bot,true)
     + "</div>"
     + '<p class="hintline">'+g.desc+"</p></div>");
  stage.querySelectorAll("[data-opp]").forEach(function(b){
    b.addEventListener("click",function(){
      pickOpp=b.dataset.opp; sfx.tap();
      if(needsThird(pickGame)) screenSetup(2); else launch();
    });
  });
}

function setupThird(){
  var g=GAMES[pickGame];
  chromeSetup(1,pickedSoFar());
  if(g.kind==="bid"){
    var std=pickPool===BID_POOL;
    show('<div class="screen setup stack">'
       + '<div class="headline mid"><span class="lbl">Last one</span><span class="big">How many points each?</span></div>'
       + '<div class="tiles">'
       +   tile("pool","std","Standard",BID_POOL+" points each",artBid(),true)
       +   tile("pool","own","Set it myself","Pick the pool size",artNumber(),true)
       + "</div>"
       + (std
          ? '<p class="hintline">Every square costs both of you what you bid &mdash; the loser pays too.</p>'
          : '<div class="panel tight"><div class="stepper">'
            + '<button class="rnd" data-pool="-1" type="button" aria-label="Fewer points">&minus;</button>'
            + '<span class="v">'+pickPool+"</span>"
            + '<button class="rnd" data-pool="1" type="button" aria-label="More points">+</button></div></div>'
            + '<div class="foot"><button class="act hero" id="begin" type="button">Start</button></div>')
       + "</div>");
    stage.querySelectorAll("[data-pool]").forEach(function(b){
      b.addEventListener("click",function(){
        var d=b.dataset.pool;
        if(d==="std"){ pickPool=BID_POOL; sfx.tap(); launch(); return; }
        if(d==="own"){ pickPool=(pickPool===BID_POOL?30:pickPool); sfx.tap(); screenSetup(2); return; }
        pickPool=Math.min(BID_MAX,Math.max(BID_MIN,pickPool+(+d)*2));
        sfx.key(); screenSetup(2);
      });
    });
    var gb=document.getElementById("begin");
    if(gb) gb.addEventListener("click",function(){ sfx.warm(); sfx.tap(); launch(); });
    return;
  }
  if(g.kind==="duel"){
    show('<div class="screen setup stack">'
       + '<div class="headline mid"><span class="lbl">Last one</span><span class="big">Board to claim</span></div>'
       + '<div class="tiles">'
       +   tile("board","ttt",BOARDS.ttt.name,"3&times;3, three in a row",artTTT(),true)
       +   tile("board","c4",BOARDS.c4.name,"7&times;6, four in a row",artC4(),true)
       + "</div>"
       + '<p class="hintline">Win a round, claim a square.</p></div>');
    stage.querySelectorAll("[data-board]").forEach(function(b){
      b.addEventListener("click",function(){ pickBoard=b.dataset.board; sfx.tap(); launch(); });
    });
    return;
  }
  var custom=pickTap!==null;
  show('<div class="screen setup stack">'
     + '<div class="headline mid"><span class="lbl">Last one</span><span class="big">Which target?</span></div>'
     + '<div class="tiles">'
     +   tile("tap","rnd","Surprise me",fx2(TAP_MIN)+"s to "+fx2(TAP_MAX)+"s",artTimer(),true)
     +   tile("tap","fix","Set it myself","Pick your own time",artNumber(),true)
     + "</div>"
     + (custom
        ? '<div class="panel tight"><div class="stepper">'
          + '<button class="rnd" data-step="-1" type="button" aria-label="Lower target">&minus;</button>'
          + '<span class="v">'+fx2(pickTap)+"<small>s</small></span>"
          + '<button class="rnd" data-step="1" type="button" aria-label="Raise target">+</button></div></div>'
          + '<div class="foot"><button class="act hero" id="begin" type="button">Start</button></div>'
        : '<p class="hintline">The clock hides after one second either way.</p>')
     + "</div>");
  stage.querySelectorAll("[data-tap]").forEach(function(b){
    b.addEventListener("click",function(){
      sfx.tap();
      if(b.dataset.tap==="rnd"){ pickTap=null; launch(); }
      else { pickTap=(pickTap===null?5:pickTap); screenSetup(2); }
    });
  });
  stage.querySelectorAll("[data-step]").forEach(function(b){
    b.addEventListener("click",function(){
      var v=(pickTap||5)+(+b.dataset.step)*0.5;
      pickTap=Math.round(Math.min(20,Math.max(1,v))*100)/100;
      sfx.key(); screenSetup(2);
    });
  });
  var go=document.getElementById("begin");
  if(go) go.addEventListener("click",function(){ sfx.warm(); sfx.tap(); launch(); });
}

function launch(){
  sfx.warm();
  DB.lastGame=pickGame; DB.lastBoard=pickBoard; DB.lastOpp=pickOpp;
  DB.lastTap=pickTap; DB.lastPool=pickPool; save();
  newMatch(pickGame,{ board:pickBoard, bot:pickOpp==="bot", tap:pickTap, pool:pickPool });
}
/* one-tap restart of whatever was played last */
function quickPlay(){
  pickGame=DB.lastGame; pickBoard=DB.lastBoard; pickOpp=DB.lastOpp;
  pickTap=(typeof DB.lastTap==="number")?DB.lastTap:null;
  pickPool=DB.lastPool||BID_POOL;
  launch();
}
function quickLabel(){
  var g=GAMES[DB.lastGame]; if(!g) return null;
  return g.name+" vs "+(DB.lastOpp==="bot"?"Bot":"a friend");
}

/* ============================================================
   Pass screen (shared by both duels)
   ============================================================ */

function screenPass(who,lead,then){
  if(G.vsBot){ then(); return; }   /* solo against the bot: there is nobody to hand the phone to */
  accent(phex(who)); enterGame(); chromeGame(true);
  show('<div class="screen pass" id="passHit" role="button" tabindex="0" aria-label="Tap to continue">'
     + '<div class="glyph">'+emblem(who,true)+"</div>"
     + '<div class="who">'+esc(pname(who))+"</div>"
     + '<div class="msg">'+esc(lead)+"</div>"
     + '<div class="hint lbl">Tap anywhere when ready</div></div>');
  var hit=document.getElementById("passHit");
  function go(){ sfx.warm(); sfx.tap(); then(); }
  hit.addEventListener("click",go);
  hit.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } });
  hit.focus({preventScroll:true});
}

/* ============================================================
   Timer duel
   ============================================================ */

function tActor(){ return G.turnIdx===0?G.first:1-G.first; }

function timerPass(){
  var lead = G.replay==="tie" ? "Sudden death. New target, same stakes."
           : G.replay==="void" ? "Round replayed. New target."
           : G.turnIdx===0 ? "You go first this round." : "Hand the phone over.";
  screenPass(tActor(), lead, screenTimer);
}

function screenTimer(){
  var p=tActor(), bot=isBot(p); accent(phex(p)); enterGame(); chromeGame(true);
  show('<div class="screen timer">'
     + '<div class="target"><span class="lbl">'+(bot?"Bot is up \u00b7 target":"Target")+'</span><span class="val">'+fx2(G.target)+"<small>s</small></span></div>"
     + '<div class="window" id="win">'
     +   '<div class="layer"><span class="live" id="live">0.00</span></div>'
     +   '<div class="layer"><span class="ticks" id="ticks"></span></div>'
     +   '<div class="fuse" id="fuse"><i id="fuseBar"></i></div>'
     +   '<div class="shutter" id="shutter"></div>'
     +   '<div class="prehint lbl" id="prehint">Clock hides after 1.00s</div>'
     +   '<div class="blindmsg lbl" id="blind">Running blind</div></div>'
     + '<button class="actuator" id="act" type="button"'+(bot?" disabled":"")+'><span class="cap2"></span><span class="cap"></span>'
     +   '<span class="txt" id="actTxt">'+(bot?"Bot":"Start")+"</span></button></div>");

  var winEl=document.getElementById("win"), live=document.getElementById("live"), ticks=document.getElementById("ticks"),
      shut=document.getElementById("shutter"), blind=document.getElementById("blind"), pre=document.getElementById("prehint"),
      fuse=document.getElementById("fuse"), fuseBar=document.getElementById("fuseBar"),
      btn=document.getElementById("act"), btnTxt=document.getElementById("actTxt");
  var running=false, armed=false, done=false, warned=false, t0=0;
  var botAt=bot?BOT.time(G.target):0;

  function begin(){
    running=true; t0=performance.now();
    btnTxt.textContent=bot?"Running":"Stop"; btn.classList.add("running");
    topbar.classList.add("recede"); pre.style.opacity="0"; fuse.classList.add("on");
    sfx.start(); buzz(8);
    later(function(){ armed=true; },ARM_DELAY);
    (function tick(now){
      if(!running) return;
      var ms=now-t0;
      if(ms<BLIND_AT){
        live.textContent=fx2(ms/1000);
        fuseBar.style.transform="scaleX("+(1-ms/BLIND_AT).toFixed(4)+")";
        if(!warned&&ms>BLIND_AT-260){ warned=true; sfx.warn(); }
      } else if(!live.classList.contains("gone")){
        live.classList.add("gone"); shut.classList.add("run"); blind.classList.add("on"); fuse.classList.remove("on"); buzz(6);
      } else {
        var s=(ms-BLIND_AT)/1000, ramp=Math.min(1,(ms-BLIND_AT)/620);
        ticks.style.opacity=(ramp*(.26+.24*(.5+.5*Math.sin(s*1.7))+.16*(.5+.5*Math.sin(s*.61+1.3)))).toFixed(3);
      }
      frame(tick);
    })(performance.now());
  }
  function end(forced){
    if(done) return;
    running=false; done=true;
    var elapsed=(typeof forced==="number")?forced:Math.round((performance.now()-t0)/10)/100;
    G.times[p]=elapsed; G.devs[p]=Math.round(Math.abs(elapsed-G.target)*100)/100;
    var st=ST(p);
    if(st.best===null||G.devs[p]<st.best) st.best=G.devs[p];
    bump(p,"roundsPlayed");
    if(G.devs[p]<=0.10){ bump(p,"sharp"); award(p,COIN_SHARP,"Inside 0.10s"); }
    save();
    sfx.stop(); buzz([16,26,12]);
    btn.disabled=true; btn.classList.remove("running"); btnTxt.textContent="Locked";
    winEl.innerHTML='<div class="layer"><div class="locked"><svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12.5 5.2 5.2L20 7"/></svg><span class="lbl">Time recorded</span></div></div>';
    later(function(){ if(G.turnIdx===0){ G.turnIdx=1; timerPass(); } else screenReveal(); },bot?560:760);
  }
  btn.addEventListener("click",function(){ if(done) return; if(!running) begin(); else if(armed) end(); });
  if(bot){
    pre.textContent="Bot is lining up its stop";
    later(function(){ begin(); later(function(){ end(botAt); },botAt*1000); },700);
  } else btn.focus({preventScroll:true});
}

function screenReveal(){
  accent(null); enterGame(); chromeGame(true);
  var d0=G.devs[0], d1=G.devs[1];
  if(d0>VOID_LIMIT&&d1>VOID_LIMIT){ G.outcome="void"; G.winner=null; }
  else if(d0===d1){ G.outcome="tie"; G.winner=null; }
  else { G.outcome="win"; G.winner=d0<d1?0:1; }

  function pinPos(i){ var d=G.times[i]-G.target; return 50+(Math.max(-VOID_LIMIT,Math.min(VOID_LIMIT,d))/VOID_LIMIT)*50; }
  function card(i){
    return '<div class="card" id="c'+i+'" style="--pc:'+phex(i)+'"><span class="nm">'+esc(pname(i))+" &middot; "+pmark(i)+"</span>"
      + '<span class="time masked" id="t'+i+'">&mdash;.&mdash;&mdash;</span><span class="off" id="o'+i+'">&mdash;</span></div>';
  }
  show('<div class="screen reveal">'
     + '<div class="rev-head"><span class="lbl">Target was</span><span class="t">'+fx2(G.target)+"s</span></div>"
     + '<div class="cards">'+card(0)+'<div class="vs"><span>VS</span></div>'+card(1)+"</div>"
     + '<div class="finish"><div class="pin" id="p0" data-mk="X" style="--pc:'+phex(0)+'; left:50%"></div>'
     +   '<div class="pin p2" id="p1" data-mk="O" style="--pc:'+phex(1)+'; left:50%"></div>'
     +   '<div class="axis"><div class="bound l"></div><div class="zero"></div><div class="bound r"></div>'
     +     '<span class="cap l">&minus;1.50 early</span><span class="cap c">Target</span><span class="cap r">+1.50 late</span></div></div>'
     + '<div class="banner" id="banner" aria-live="polite"><div class="dots"><i></i><i></i><i></i></div></div>'
     + '<div class="foot" id="foot"></div></div>');
  var banner=document.getElementById("banner"), foot=document.getElementById("foot");

  function drop(i,instant){
    var el=document.getElementById("t"+i), off=document.getElementById("o"+i), pin=document.getElementById("p"+i);
    var v=G.times[i], delta=v-G.target;
    el.classList.remove("masked");
    off.textContent=(G.devs[i]>VOID_LIMIT?"VOID \u2022 ":"")+(delta<0?"\u2212":"+")+fx2(Math.abs(delta))+"s "+(delta<0?"early":"late");
    if(G.devs[i]>VOID_LIMIT) off.style.color="var(--void)";
    pin.style.left=pinPos(i)+"%"; pin.classList.add("on");
    sfx.ping(i); buzz(10);
    if(instant){ el.textContent=fx2(v); off.classList.add("on"); return; }
    var t0=performance.now();
    (function roll(now){
      var k=Math.min(1,(now-t0)/420), e=1-Math.pow(1-k,3);
      el.textContent=fx2(v*e);
      if(k<1) frame(roll); else { el.textContent=fx2(v); off.classList.add("on"); }
    })(t0);
    /* frames stop in a backgrounded tab - make sure the figure still lands */
    later(function(){ el.textContent=fx2(v); off.classList.add("on"); },460);
  }
  function tension(instant){
    if(instant) return;
    document.getElementById("c0").classList.add("shiver");
    document.getElementById("c1").classList.add("shiver");
    sfx.tense();
  }
  function settle(){
    document.getElementById("c0").classList.remove("shiver");
    document.getElementById("c1").classList.remove("shiver");
    var head,sub,label,tint,detail;
    if(G.outcome==="win"){
      var w=G.winner;
      document.getElementById("c"+w).classList.add("hero");
      document.getElementById("c"+(1-w)).classList.add("dim");
      head=pname(w)+" wins the round";
      sub="Off by "+fx2(G.devs[w])+"s versus "+fx2(G.devs[1-w])+"s.";
      label=G.kind==="duel"?(B().drop?"Drop your piece":"Place your "+pmark(w)):"Next round";
      tint=phex(w); accent(phex(w)); sfx.win(); buzz([28,44,64]);
      creditRound(w);
    } else if(G.outcome==="tie"){
      document.getElementById("c0").classList.add("hero"); document.getElementById("c1").classList.add("hero");
      head="Dead heat"; sub="Both off by exactly "+fx2(G.devs[0])+"s. Sudden death \u2014 replay for a new target.";
      label="Replay round"; tint="#EDEFF5"; sfx.tie(); buzz([20,60,20]);
    } else {
      document.getElementById("c0").classList.add("dim"); document.getElementById("c1").classList.add("dim");
      head="Round void"; sub="Both players missed by more than "+fx2(VOID_LIMIT)+"s. Nobody wins it.";
      label="New target"; tint="var(--void)"; sfx.voided(); buzz([50]);
    }
    detail="Target "+fx2(G.target)+"s \u00b7 "+pname(0)+" "+fx2(G.times[0])+"s \u00b7 "+pname(1)+" "+fx2(G.times[1])+"s";
    logRound({ t:G.outcome==="win"?pname(G.winner)+" took the round":(G.outcome==="tie"?"Dead heat":"Void round"), d:detail,
               winner:G.outcome==="win"?G.winner:null });
    banner.innerHTML='<div class="head" style="color:'+tint+'">'+esc(head)+'</div><div class="sub">'+esc(sub)+"</div>";
    /* the result stays on screen, but the game moves on by itself */
    var wait=G.outcome==="win"?2600:2200, fired=false;
    foot.innerHTML='<button class="act accent" id="next" type="button">'+esc(label)+"</button>"+autoBar(wait);
    function go(){
      if(fired) return; fired=true; haltAll();
      if(G.outcome==="win") afterRound(G.winner); else startRound(G.outcome);
    }
    document.getElementById("next").addEventListener("click",function(){ sfx.tap(); go(); });
    later(go,wait);
  }
  var steps=[[300,drop.bind(null,0)],[1000,drop.bind(null,1)],[1600,tension],[2300,settle]], at=0;
  steps.forEach(function(s,i){ later(function(){ if(i>=at){ at=i+1; s[1](false); } },s[0]); });
  stage.querySelector(".reveal").addEventListener("click",function(e){
    if(at>=steps.length||e.target.closest("button")) return;
    haltAll(); while(at<steps.length){ steps[at][1](true); at++; }
  });
}

/* ============================================================
   Number duel
   ============================================================ */

function nActor(){ return G.guesses.length%2===0 ? G.first : 1-G.first; }
function triesBy(i){ return G.guesses.filter(function(g){ return g.by===i; }).length; }

/* what the history proves so far */
function knownRange(){
  var lo=1, hi=G.hi;
  G.guesses.forEach(function(g){
    if(g.res==="higher") lo=Math.max(lo,g.n+1);
    else if(g.res==="lower") hi=Math.min(hi,g.n-1);
  });
  return [lo,hi];
}
/* Duel rule: the nearest guess takes the square, and a shared distance goes to
   whoever reached it first - otherwise a 1-to-10 round could run forever. */
function closestWinner(){
  var best=[Infinity,Infinity], at=[Infinity,Infinity];
  G.guesses.forEach(function(g,i){
    if(g.dist<best[g.by]){ best[g.by]=g.dist; at[g.by]=i; }
  });
  if(best[0]!==best[1]) return best[0]<best[1]?0:1;
  return at[0]<at[1]?0:1;
}

function screenGuess(){
  var p=nActor(), bot=isBot(p), duel=G.kind==="duel";
  accent(phex(p)); enterGame(); chromeGame(true);
  G.entry="";
  var rng=knownRange(), small=G.hi<=12;

  /* the last two are what you actually reason from; the rest is reference */
  var recent=G.guesses.slice(-2), older=G.guesses.slice(0,Math.max(0,G.guesses.length-2));
  var recentHTML = recent.length ? '<div class="recentrow">'+recent.map(function(g,i){
      var word=g.res==="higher"?"Go higher":g.res==="lower"?"Go lower":"Correct";
      return '<div class="gbig'+(recent.length===2&&i===0?" prev":"")+'" style="color:'+phex(g.by)+'">'
        + '<span class="n">'+g.n+'</span><span class="r">'+word+"</span>"
        + '<span class="w">'+esc(pname(g.by))+"</span></div>";
    }).join("")+"</div>" : "";
  var chips=older.map(function(g){
    var ar=g.res==="higher"?"&uarr;":g.res==="lower"?"&darr;":"&check;";
    return '<span class="gchip'+(g.res==="hit"?" hit":"")+'" style="color:'+phex(g.by)+'">'+g.n+'<span class="ar">'+ar+"</span></span>";
  }).join("");
  /* say outright what is still possible rather than making both players re-derive it */
  var rangeHTML = G.guesses.length
    ? '<div class="rangeline"><small>Still in play</small>'+(rng[0]===rng[1]?"only "+rng[0]:rng[0]+" to "+rng[1])+"</div>"
    : "";
  var pins=G.guesses.map(function(g){
    return '<span class="gp" style="color:'+phex(g.by)+";left:calc("+((g.n-1)/(G.hi-1)*100)+"% - 1px)\"></span>";
  }).join("");
  var bandL=(rng[0]-1)/(G.hi-1)*100, bandR=100-(rng[1]-1)/(G.hi-1)*100;

  var pad;
  if(small){
    /* a ten-key grid guesses in one tap - no typing, no confirm */
    var nums="";
    for(var n=1;n<=G.hi;n++){
      var used=G.guesses.some(function(g){ return g.n===n; });
      var ruled=!used&&(n<rng[0]||n>rng[1]);            /* the clues already exclude it */
      var off=used||ruled;
      nums+='<button class="key'+(used?" used":ruled?" ruled":"")+'" data-n="'+n+'" type="button"'+(off?" disabled":"")
          + ' aria-label="'+n+(used?", already guessed":ruled?", ruled out":"")+'">'+n+"</button>";
    }
    pad='<div class="numgrid">'+nums+"</div>";
  } else {
    var keys="";
    [1,2,3,4,5,6,7,8,9].forEach(function(k){ keys+='<button class="key" data-k="'+k+'" type="button">'+k+"</button>"; });
    keys+='<button class="key wide" data-k="del" type="button">Del</button>';
    keys+='<button class="key" data-k="0" type="button">0</button>';
    keys+='<button class="key go" id="goKey" data-k="go" type="button" disabled>Guess</button>';
    pad='<div class="entry" id="entry"><span class="val empty" id="entryVal">\u2014\u2014</span>'
      + '<span class="note" id="note">Between 1 and '+G.hi+"</span></div>"
      + '<div class="keypad">'+keys+"</div>";
  }

  var subs = duel
    ? [sub(triesBy(0)+" of "+DUEL_TRIES),sub(triesBy(1)+" of "+DUEL_TRIES)]
    : [sub("1 to "+G.hi),sub("1 to "+G.hi)];

  show('<div class="screen guess">'
     + playerBar(p,subs,!bot)
     + '<div class="statusline lbl">'+(duel?"Closest guess takes the square":"Guess "+(G.guesses.length+1)+" of "+G.cap)+"</div>"
     + '<div class="scale100"><div class="track"><div class="band" style="left:'+bandL+"%;right:"+bandR+'%"></div></div>'
     +   pins+'<div class="ends"><span>1</span><span>'+G.hi+"</span></div></div>"
     + rangeHTML
     + (recentHTML||'<div class="hist"><span class="lbl">No guesses yet</span></div>')
     + (chips?'<div class="hist">'+chips+"</div>":"")
     + (bot?'<div class="turnflash"><div class="sub2">Bot is working it out</div><div class="dots"><i></i><i></i><i></i></div></div>':pad)
     + "</div>");

  if(bot){
    later(function(){
      var taken=G.guesses.map(function(g){ return g.n; });
      submitGuess(BOT.guess(rng[0],rng[1],taken),p);
    },850);
    return;
  }

  /* out of time: the app guesses somewhere still in play rather than stalling */
  function autoGuess(){
    var taken=G.guesses.map(function(g){ return g.n; }), pool=[];
    for(var n=rng[0];n<=rng[1];n++) if(taken.indexOf(n)===-1) pool.push(n);
    if(!pool.length) for(var m=1;m<=G.hi;m++) if(taken.indexOf(m)===-1) pool.push(m);
    submitGuess(pool.length?pool[Math.floor(Math.random()*pool.length)]:1,p);
  }

  if(small){
    stage.querySelectorAll("[data-n]").forEach(function(b){
      b.addEventListener("click",function(){ sfx.key(); buzz(6); submitGuess(+b.dataset.n,p); });
    });
    runTurnClock(TURN_GUESS,autoGuess);
    return;
  }

  var entry=document.getElementById("entry"), val=document.getElementById("entryVal"),
      note=document.getElementById("note"), go=document.getElementById("goKey");
  function state(){
    var s=G.entry;
    val.textContent=s||"\u2014\u2014";
    val.classList.toggle("empty",!s);
    var n=parseInt(s,10), ok=false;
    var msg=G.guesses.length ? "Still in play: "+rng[0]+"\u2013"+rng[1] : "Between 1 and "+G.hi;
    if(s){
      if(!(n>=1&&n<=G.hi)) msg="Out of range";
      else if(G.guesses.some(function(g){ return g.n===n; })) msg="Already guessed";
      else if(n<rng[0]) msg="Ruled out \u2014 it is above "+(rng[0]-1);
      else if(n>rng[1]) msg="Ruled out \u2014 it is below "+(rng[1]+1);
      else { ok=true; msg=""; }
    }
    note.textContent=msg; note.classList.toggle("bad",!!s&&!ok);
    go.disabled=!ok;
    return ok;
  }
  function press(k){
    if(k==="del"){ G.entry=G.entry.slice(0,-1); sfx.key(); buzz(5); }
    else if(k==="go"){
      if(!state()){ entry.classList.add("shake"); sfx.nope(); buzz(30); setTimeout(function(){ entry.classList.remove("shake"); },320); return; }
      submitGuess(parseInt(G.entry,10),p); return;
    }
    else {
      if(G.entry.length>=String(G.hi).length) return;
      if(G.entry===""&&k==="0") return;
      G.entry+=k; sfx.key(); buzz(5);
    }
    state();
  }
  stage.querySelectorAll(".key").forEach(function(b){ b.addEventListener("click",function(){ press(b.dataset.k); }); });
  state();
  runTurnClock(TURN_GUESS,autoGuess);
}

function submitGuess(n,by){
  var res = n===G.secret ? "hit" : (n<G.secret ? "higher" : "lower");
  G.guesses.push({ n:n, by:by, res:res, dist:Math.abs(n-G.secret) });
  G.lastVerdict={ n:n, by:by, res:res };
  /* a hit gets checked before it gets celebrated, so the sound waits too */
  if(res==="hit"){ buzz(12); }
  else { buzz(14); if(res==="higher") sfx.higher(); else sfx.lower(); }

  var duel=G.kind==="duel", spent = duel ? G.guesses.length>=DUEL_TRIES*2 : G.guesses.length>=G.cap;
  if(res==="hit"){ flashHit(n,by,function(){ numberResult(by,"hit"); }); return; }
  if(spent){ numberResult(duel?closestWinner():null, duel?"closest":"spent"); return; }
  /* No hand-over screen: both players see the same clues, so flash and roll on. */
  flashVerdict(res,n,by,screenGuess);
}

/* ============================================================
   Sequence Race - crack the hidden order of four
   ============================================================ */

function seqShape(id){
  var it=SEQ_ITEMS.filter(function(x){ return x.id===id; })[0]||SEQ_ITEMS[0], s;
  if(it.shape==="circle")        s='<circle cx="50" cy="50" r="35"/>';
  else if(it.shape==="square")   s='<rect x="17" y="17" width="66" height="66" rx="11"/>';
  else if(it.shape==="triangle") s='<path d="M50 13 L89 83 L11 83 Z"/>';
  else                           s='<path d="M50 9 L91 50 L50 91 L9 50 Z"/>';
  return '<svg class="seqshape" viewBox="0 0 100 100" style="color:'+it.hex+'" role="img" aria-label="'+it.name+'">'
       + '<g fill="currentColor">'+s+"</g></svg>";
}
function seqShuffle(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function seqExact(arr,against){
  var n=0; for(var i=0;i<arr.length;i++) if(arr[i]===against[i]) n++;
  return n;
}
function seqPerms(list){
  if(list.length<=1) return [list];
  var out=[];
  list.forEach(function(v,i){
    var rest=list.slice(0,i).concat(list.slice(i+1));
    seqPerms(rest).forEach(function(p){ out.push([v].concat(p)); });
  });
  return out;
}
/* the bot only ever plays an order still consistent with everything it has
   been told, which is exactly what a sharp human would do */
function botSeq(p){
  var all=seqPerms(SEQ_ITEMS.map(function(x){ return x.id; }));
  var hist=G.seqHist[p];
  var ok=all.filter(function(cand){
    return hist.every(function(h){ return seqExact(h.arr,cand)===h.score; });
  });
  var pool=ok.length?ok:all;
  return pool[Math.floor(Math.random()*pool.length)];
}

function seqStart(){
  var ids=SEQ_ITEMS.map(function(x){ return x.id; });
  G.seqSecret=seqShuffle(ids);
  G.seqArr=[seqShuffle(ids),seqShuffle(ids)];
  G.seqBest=[0,0]; G.seqTries=[0,0]; G.seqHist=[[],[]];
  G.seqTurn=G.first; G.seqSel=-1;
  seqTurnStart();
}
function seqTurnStart(){
  var p=G.seqTurn;
  if(isBot(p)){
    accent(phex(p)); enterGame(); chromeGame(true);
    show('<div class="screen seqscreen">'+playerBar(p,seqSubs(),false)
       + '<div class="turnflash"><div class="sub2">Bot is working the order out</div>'
       + '<div class="dots"><i></i><i></i><i></i></div></div></div>');
    later(function(){ G.seqArr[p]=botSeq(p); seqSubmit(p); },900);
    return;
  }
  screenSeq();
}
function seqSubs(){
  return [ sub(G.seqBest[0]+"/"+SEQ_N+" best"), sub(G.seqBest[1]+"/"+SEQ_N+" best") ];
}

function screenSeq(){
  var p=G.seqTurn, o=1-p;
  accent(phex(p)); enterGame(); chromeGame(true);
  G.seqSel=-1;

  var slots=G.seqArr[p].map(function(id,i){
    return '<button type="button" class="seqslot" data-s="'+i+'" style="color:'+phex(p)+'" aria-label="Position '+(i+1)+'">'
         + seqShape(id)+"</button>";
  }).join("");

  show('<div class="screen seqscreen">'
     + playerBar(p,seqSubs(),true)
     + '<div class="statusline lbl">Put the four in the right order</div>'
     + '<div class="seqrow" id="seqRow">'+slots+"</div>"
     + '<div class="seqpos"><span>1st</span><span>2nd</span><span>3rd</span><span>4th</span></div>'
     + '<div class="seqstats">'
     +   '<div class="seqstat"><span class="k">Your best</span><span class="v" style="color:'+phex(p)+'">'+G.seqBest[p]+"/"+SEQ_N+" &middot; "+G.seqTries[p]+" tries</span></div>"
     +   '<div class="seqstat"><span class="k">'+esc(pname(o))+"'s best</span><span class=\"v\" style=\"color:"+phex(o)+'">'+G.seqBest[o]+"/"+SEQ_N+" &middot; "+G.seqTries[o]+" tries</span></div>"
     + "</div>"
     + '<div class="seqhint">Tap two to swap them</div>'
     + '<div class="foot"><button class="act hero" id="seqGo" type="button">Submit order</button></div></div>');

  var row=document.getElementById("seqRow");
  row.addEventListener("click",function(e){
    var b=e.target.closest(".seqslot"); if(!b) return;
    var i=+b.dataset.s;
    if(G.seqSel<0){ G.seqSel=i; b.classList.add("sel"); sfx.key(); buzz(6); return; }
    if(G.seqSel===i){ G.seqSel=-1; b.classList.remove("sel"); sfx.key(); return; }
    var a=row.querySelector('.seqslot[data-s="'+G.seqSel+'"]');
    var arr=G.seqArr[p], t=arr[G.seqSel]; arr[G.seqSel]=arr[i]; arr[i]=t;
    a.classList.remove("sel");
    a.innerHTML=seqShape(arr[G.seqSel]); b.innerHTML=seqShape(arr[i]);
    [a,b].forEach(function(el){ el.classList.remove("swap"); void el.offsetWidth; el.classList.add("swap"); });
    G.seqSel=-1; sfx.place(); buzz(10);
  });
  document.getElementById("seqGo").addEventListener("click",function(){ haltAll(); seqSubmit(p); });
  runTurnClock(TURN_SEQ,function(){ seqSubmit(p); });   /* out of time submits what is on screen */
}

function seqSubmit(p){
  var score=seqExact(G.seqArr[p],G.seqSecret);
  G.seqTries[p]++;
  G.seqHist[p].push({ arr:G.seqArr[p].slice(), score:score });
  if(score>G.seqBest[p]) G.seqBest[p]=score;
  var won=(score===SEQ_N);
  buzz(won?[30,50,80]:12);
  if(!won){ if(score>0) sfx.ping(score>2?1:0); else sfx.lower(); }

  /* punchy, not a pause: they will be submitting fast */
  var el=stage.querySelector(".screen.seqscreen");
  if(el){
    [".seqrow",".seqpos",".seqstats",".seqhint",".foot",".turnflash",".statusline"].forEach(function(s){
      var x=el.querySelector(s); if(x) x.remove();
    });
    var box=document.createElement("div");
    box.className="turnflash"; box.style.color=won?phex(p):"var(--text)";
    box.innerHTML='<div class="seqbig">'+score+"/"+SEQ_N+"</div>"
      + '<div class="sub2">'+(won?"That is the order":"in the right place")+"</div>";
    el.appendChild(box);
  }
  later(function(){
    if(won){ seqResult(p); return; }
    G.seqTurn=1-p; seqTurnStart();
  }, won?900:820);
}

function seqResult(w){
  accent(phex(w)); enterGame(); chromeGame(true);
  creditRound(w); save();
  logRound({ t:pname(w)+" cracked the order",
             d:"Order "+G.seqSecret.map(function(id){ return SEQ_ITEMS.filter(function(x){return x.id===id;})[0].name; }).join(" ")
               + " \u00b7 "+G.seqTries[0]+" v "+G.seqTries[1]+" tries", winner:w });
  var wait=3200, fired=false;
  var cells=G.seqSecret.map(function(id){ return '<div class="cell">'+seqShape(id)+"</div>"; }).join("");
  show('<div class="screen verdict" style="color:'+phex(w)+'">'
     + '<div class="big">'+esc(pname(w))+" wins the round</div>"
     + '<div class="sub" style="color:var(--grey);margin-bottom:14px">Cracked it in '+G.seqTries[w]+" attempt"+(G.seqTries[w]===1?"":"s")+".</div>"
     + '<div style="width:100%;max-width:300px"><div class="lbl" style="text-align:center;margin-bottom:8px">The order was</div>'
     +   '<div class="seqreveal">'+cells+"</div></div>"
     + '<div class="seqstats" style="width:100%;max-width:300px;margin-top:14px">'
     +   '<div class="seqstat"><span class="k">'+esc(pname(0))+'</span><span class="v" style="color:'+phex(0)+'">'+G.seqBest[0]+"/"+SEQ_N+" &middot; "+G.seqTries[0]+" tries</span></div>"
     +   '<div class="seqstat"><span class="k">'+esc(pname(1))+'</span><span class="v" style="color:'+phex(1)+'">'+G.seqBest[1]+"/"+SEQ_N+" &middot; "+G.seqTries[1]+" tries</span></div>"
     + "</div>"
     + '<div class="foot" style="width:100%"><button class="act accent" id="next" type="button">'
     +   (B().drop?"Drop your piece":"Place your "+pmark(w))+"</button>"+autoBar(wait)+"</div></div>");
  sfx.win();
  function go(){ if(fired) return; fired=true; haltAll(); afterRound(w); }
  document.getElementById("next").addEventListener("click",function(){ sfx.tap(); go(); });
  later(go,wait);
}

/* A hit lands in two beats: the number is checked, then it is confirmed. Cutting
   straight to "correct" throws away the one moment the whole round builds to. */
function flashHit(n,by,then){
  var el=stage.querySelector(".screen.guess");
  if(!el){ then(); return; }
  [".keypad",".entry",".numgrid",".recentrow",".hist",".rangeline"].forEach(function(sel){
    var x=el.querySelector(sel); if(x) x.remove();
  });
  var box=document.createElement("div");
  box.className="turnflash"; box.style.color=phex(by);
  box.innerHTML='<div class="hitcheck">'
    + '<div class="lbl" id="hitLbl">Checking '+n+"</div>"
    + '<div class="hitstack"><span class="hitring" id="hitRing"></span><span class="hitnum" id="hitNum">'+n+"</span></div>"
    + '<div class="dots" id="hitDots"><i></i><i></i><i></i></div></div>';
  el.appendChild(box);
  sfx.tense();
  later(function(){
    var num=document.getElementById("hitNum"), ring=document.getElementById("hitRing"),
        lbl=document.getElementById("hitLbl"), dots=document.getElementById("hitDots");
    if(num) num.classList.add("pop");
    if(ring) ring.classList.add("go");
    if(lbl) lbl.textContent="That is the number";
    if(dots) dots.remove();
    sfx.win(); buzz([30,50,80]);
  },950);
  later(then,2050);
}

/* the higher/lower reply, shown in place for a beat instead of costing a tap */
function flashVerdict(res,n,by,then){
  var el=stage.querySelector(".screen.guess");
  if(!el){ then(); return; }
  var next=nActor();
  var box=document.createElement("div");
  box.className="turnflash"; box.style.color=phex(by);
  box.innerHTML='<div class="big2">'+(res==="higher"?"Higher":"Lower")+"</div>"
    + '<div class="sub2">'+n+" is too "+(res==="higher"?"low":"high")+". "+esc(pname(next))+" is up.</div>"
    + autoBar(1150);
  [".keypad",".entry",".numgrid"].forEach(function(sel){
    var x=el.querySelector(sel); if(x) x.remove();
  });
  el.appendChild(box);
  later(then,1150);
}

function numberResult(w,why){
  var head,sub,icon,tint,label;
  if(why==="hit"){
    head="Correct"; icon=I.bullseye; tint=phex(w);
    sub="The number was "+G.secret+". "+pname(w)+" takes the round.";
    var used=triesBy(w), st=ST(w);
    if(st.bestGuess===null||used<st.bestGuess) st.bestGuess=used;
    if(used<=2) bump(w,"mind");
    creditRound(w); save();
  } else if(why==="closest"){
    head=pname(w)+" was closest"; icon=I.bullseye; tint=phex(w);
    var mine=Math.min.apply(null,G.guesses.filter(function(g){ return g.by===w; }).map(function(g){ return g.dist; }));
    sub="The number was "+G.secret+". Nobody hit it \u2014 "+pname(w)+" came within "+mine+".";
    sfx.win(); creditRound(w);
  } else {
    head="Out of guesses"; icon=I.bullseye; tint="var(--void)";
    sub="The number was "+G.secret+". Nobody takes it.";
    sfx.voided();
  }
  accent(w===null?null:phex(w)); enterGame(); chromeGame(true);
  label = w===null ? "New number"
        : G.kind==="duel" ? (B().drop?"Drop your piece":"Place your "+pmark(w)) : "Next round";
  logRound({ t:head, d:"Secret "+G.secret+" \u00b7 guesses "+G.guesses.map(function(g){ return g.n; }).join(", "), winner:w });

  var wait=(w===null?2200:2600), fired=false;
  show('<div class="screen verdict" style="color:'+tint+'">'
     + '<div class="arrowbox">'+icon+"</div>"
     + '<div class="big">'+esc(head)+"</div>"
     + '<div class="sub" style="color:var(--grey)">'+esc(sub)+"</div>"
     + '<div class="foot" style="width:100%"><button class="act accent" id="next" type="button">'+esc(label)+"</button>"
     +   autoBar(wait)+"</div></div>");
  function go(){
    if(fired) return; fired=true; haltAll();
    if(w===null) startRound("void"); else afterRound(w);
  }
  document.getElementById("next").addEventListener("click",function(){ sfx.tap(); go(); });
  later(go,wait);
}


/* ============================================================
   Bid-Tac-Toe - sealed bids, one square at a time
   ============================================================ */

var SQNAMES=["Top left","Top middle","Top right","Middle left","Centre","Middle right",
             "Bottom left","Bottom middle","Bottom right"];

var PASS_BANK=1;      /* passing banks a point, so an empty pool can always climb back */
var PASS_LIMIT=3;     /* ...but three double-passes running would loop forever, so it resolves */

function bidStart(pool){
  G.pool=pool; G.bal=[pool,pool]; G.bids=[null,null]; G.bidLog=[]; G.bidSquare=-1;
  G.bidChooser=-1; G.passRun=0;
  screenBidDraw();
}

/* a pass is worth points rather than costing them */
function bidCost(b){ return b===0 ? -PASS_BANK : b; }

/* the toss: names flick past, one lands, and that player names the first square */
function screenBidDraw(){
  var won=Math.random()<0.5?0:1;
  accent(null); enterGame(); chromeGame(true);
  show('<div class="screen draw">'
     + '<span class="lbl">Drawing for first pick</span>'
     + '<div class="drawslot" id="slot">&nbsp;</div>'
     + '<div class="glyph" id="drawGlyph"></div>'
     + '<div class="goes" id="goes"><span class="lbl">picks the first square</span></div></div>');

  var slot=document.getElementById("slot"), goes=document.getElementById("goes"),
      gl=document.getElementById("drawGlyph");

  var N=13, gap=42, steps=[], i;
  for(i=0;i<N;i++){ steps.push(gap); gap*=1.21; }   /* flicks fast, then drags out */
  var flip=((won-(N-1))%2+2)%2;                     /* parity so the last frame is the winner */
  var t=0;
  steps.forEach(function(ms,k){
    t+=ms;
    later(function(){
      var who=(k+flip)%2;
      slot.textContent=pname(who);
      slot.style.color=phex(who);
      slot.classList.remove("flick"); void slot.offsetWidth; slot.classList.add("flick");
      if(k<N-1){ sfx.key(); buzz(3); }
    },t);
  });
  later(function(){
    slot.classList.remove("flick"); slot.classList.add("settled");
    accent(phex(won));
    gl.innerHTML=emblem(won,true); gl.classList.add("on");
    goes.classList.add("on");
    sfx.win(); buzz([24,40,60]);
  },t+100);
  later(function(){
    G.bidChooser=won; G.first=won;
    logRound({ t:pname(won)+" won the toss", d:"Picks the first square", winner:won });
    bidRound();
  },t+1600);
}

function bidRound(){
  G.bids=[null,null];
  /* a tie leaves the square up: same square, same chooser, straight back to bidding */
  if(G.bidSquare>=0 && !G.cells[G.bidSquare]){ bidAsk(G.bidChooser); return; }
  if(!G.cells.some(function(v){ return !v; })){ bidEnd(); return; }
  G.bidSquare=-1;
  bidPick();
}

/* whoever's turn it is names the square. No hand-over first: a pick is public,
   so the lit player bar is enough, and it saves a tap. */
function bidPick(){
  var p=G.bidChooser;
  if(isBot(p)){ screenBidBotPick(p); return; }
  screenBidPick(p);
}

function bidAsk(p){
  if(isBot(p)){ G.bids[p]=botBid(p); bidAfter(p); return; }
  screenBidEntry(p);
}
/* either player can be first to seal now, so work it out from who is still missing */
function bidAfter(p){
  var o=1-p;
  if(G.bids[o]!==null){ screenBidReveal(); return; }
  if(isBot(o)){ G.bids[o]=botBid(o); screenBidReveal(); return; }
  screenPass(o,"Bid sealed. "+SQNAMES[G.bidSquare]+" is up \u2014 hand the phone to "+pname(o)+".",
             function(){ bidAsk(o); });
}

function screenBidPick(p){
  accent(phex(p)); enterGame(); stage.classList.add("scrolls"); chromeGame(true);
  show('<div class="screen bidscreen">'
     + playerBar(p,[subBig(G.bal[0]+"<small>PTS</small>"),subBig(G.bal[1]+"<small>PTS</small>")],true)
     + '<div class="squp"><span class="lbl">'+esc(pname(p))+" picks</span>"
     +   '<span class="n">Choose the square</span></div>'
     + bidBoardHTML(p)
     + '<div class="bidhint">Then you both bid on it</div>'
     + bidLogHTML()+"</div>");

  var fired=false;
  function choose(i){
    if(fired||G.cells[i]) return;
    fired=true; haltAll();
    G.bidSquare=i; sfx.place(); buzz(12);
    bidAsk(p);
  }
  stage.querySelector(".board.ttt").addEventListener("click",function(e){
    var c=e.target.closest(".cell.pickable"); if(!c) return;
    choose(parseInt(c.dataset.i,10));
  });
  runTurnClock(TURN_MOVE,function(){          /* out of time: pick for them rather than stall */
    var open=[]; for(var i=0;i<9;i++) if(!G.cells[i]) open.push(i);
    if(open.length) choose(open[Math.floor(Math.random()*open.length)]);
  });
}

function screenBidBotPick(p){
  accent(phex(p)); enterGame(); stage.classList.add("scrolls"); chromeGame(true);
  show('<div class="screen bidscreen">'
     + playerBar(p,[subBig(G.bal[0]+"<small>PTS</small>"),subBig(G.bal[1]+"<small>PTS</small>")],false)
     + '<div class="squp"><span class="lbl">'+esc(pname(p))+' picks</span><span class="n" id="botPick">&hellip;</span></div>'
     + bidBoardHTML()
     + '<div class="bidhint">Then you both bid on it</div>'
     + bidLogHTML()+"</div>");
  later(function(){
    G.bidSquare=botPickSquare(p);
    var lab=document.getElementById("botPick");
    if(lab) lab.textContent=SQNAMES[G.bidSquare];
    var wrap=stage.querySelector(".board.ttt");
    if(wrap) wrap.outerHTML=bidBoardHTML();
    var c=stage.querySelector('.cell[data-i="'+G.bidSquare+'"]');
    if(c) c.classList.add("justpicked");
    sfx.place(); buzz(10);
    later(function(){ bidAsk(p); },850);
  },700);
}

/* same shape as the bot's valuation: take the win, else deny it, else centre */
function botPickSquare(p){
  var me=pmark(p), you=pmark(1-p), b=BOARDS.ttt, open=[], i;
  for(i=0;i<9;i++) if(!G.cells[i]) open.push(i);
  function makes(i,m){ var t=G.cells.slice(); t[i]=m; var r=judgeOn(t,b); return !!(r&&r.line); }
  for(i=0;i<open.length;i++) if(makes(open[i],me)) return open[i];
  for(i=0;i<open.length;i++) if(makes(open[i],you)) return open[i];
  if(open.indexOf(4)>-1) return 4;
  var corners=open.filter(function(i){ return i===0||i===2||i===6||i===8; });
  var pool=corners.length?corners:open;
  return pool[Math.floor(Math.random()*pool.length)];
}

/* what a square is worth to the bot right now */
function botBid(p){
  var bal=G.bal[p]; if(bal<=0) return 0;
  var i=G.bidSquare, me=pmark(p), you=pmark(1-p), b=BOARDS.ttt;
  var t=G.cells.slice(); t[i]=me;
  var mine=judgeOn(t,b), win=mine&&mine.winner===p;
  t[i]=you;
  var theirs=judgeOn(t,b), block=theirs&&theirs.winner===(1-p);
  /* a square it doesn't need is worth more as a banked point when it's short */
  if(!win && !block && i!==4 && bal < G.bal[1-p]*0.6 && Math.random()<0.55) return 0;
  var weight = win?1 : block?0.9 : (i===4?0.45 : (i%2===0?0.32:0.22));
  var bid=Math.round(bal*weight*(0.55+Math.random()*0.5));
  if(win||block) bid=Math.max(bid,Math.ceil(bal*(win?0.7:0.5)));
  return Math.max(0,Math.min(bal,bid));
}

/* both pools, nobody on the clock */
function bidBar(){
  return playerBar(-1,[subBig(G.bal[0]+"<small>PTS</small>"),subBig(G.bal[1]+"<small>PTS</small>")],false);
}
function bidLogHTML(){
  if(!G.bidLog.length) return "";
  return '<div class="bidlog">'+G.bidLog.slice().reverse().map(function(e){
    var tint=e.w===null?"var(--grey-dim)":phex(e.w);
    return '<div class="blrow" style="--pc:'+tint+'"><span class="sq">'+SQNAMES[e.sq]+"</span>"
      + '<span class="b" style="color:'+phex(0)+'">'+e.b0+"</span>"
      + '<span class="vs">v</span>'
      + '<span class="b" style="color:'+phex(1)+'">'+e.b1+"</span>"
      + '<span class="w" style="color:'+tint+'">'+(e.w===null?"tied":esc(pname(e.w)).slice(0,8))+"</span></div>";
  }).join("")+"</div>";
}
/* pickFor = the player choosing a square; omit for a display-only board */
function bidBoardHTML(pickFor){
  var k=G.bidSquare, live=(pickFor===0||pickFor===1);
  var cells=G.cells.map(function(v,i){
    var col=v?phex(v==="X"?0:1):null;
    var isWin=G.result&&G.result.line&&G.result.line.indexOf(i)>-1;
    var open=!v&&live;
    var inner=v?'<span style="color:'+col+';display:block;width:100%;height:100%">'+markSVG(v,i===G.lastPlaced,v==="X"?0:1)+"</span>"
             :(open?'<span class="ghost" style="color:'+phex(pickFor)+'">'+markSVG(pmark(pickFor),false,pickFor)+"</span>":"");
    var cls="cell"+(i===k?" bidcell":"")+(isWin?" wincell":"")+(open?" pickable":"");
    return open
      ? '<button type="button" class="'+cls+'" data-i="'+i+'" aria-label="Put '+SQNAMES[i]+' up for bid"><span class="pad">'+inner+"</span></button>"
      : '<div class="'+cls+'" data-i="'+i+'"><span class="pad">'+inner+"</span></div>";
  }).join("");
  return '<div class="board ttt md" style="'+terrainVars()+'">'+cells+winLineSVG()+"</div>";
}

function screenBidEntry(p){
  accent(phex(p)); enterGame(); stage.classList.add("scrolls"); chromeGame(true);
  var bal=G.bal[p], val=0;

  show('<div class="screen bidscreen">'
     + playerBar(p,[subBig(G.bal[0]+"<small>PTS</small>"),subBig(G.bal[1]+"<small>PTS</small>")],true)
     + '<div class="squp"><span class="lbl">Up for bid</span><span class="n">'+SQNAMES[G.bidSquare]+"</span></div>"
     + bidBoardHTML()
     + '<div class="bidctl">'
     +   '<div class="bidval">'
     +     '<button class="rnd" id="bidDown" type="button" aria-label="Bid one less">&minus;</button>'
     +     '<span class="v" id="bidV">0</span>'
     +     '<button class="rnd" id="bidUp" type="button" aria-label="Bid one more">+</button></div>'
     +   '<input class="slider" id="bidSlide" type="range" min="0" max="'+bal+'" value="0" step="1" aria-label="Your bid">'
     +   '<div class="chips">'
     +     '<button class="chip" data-set="0" type="button">Pass &middot; +'+PASS_BANK+"</button>"
     +     '<button class="chip" data-set="half" type="button">Half &middot; '+Math.floor(bal/2)+"</button>"
     +     '<button class="chip" data-set="all" type="button">All in &middot; '+bal+"</button></div>"
     +   '<div class="bidhint" id="bidHint">&nbsp;</div>'
     +   '<button class="act hero" id="sealBtn" type="button">Seal 0</button></div>'
     + bidLogHTML()+"</div>");

  var vEl=document.getElementById("bidV"), slide=document.getElementById("bidSlide"),
      hint=document.getElementById("bidHint"), seal=document.getElementById("sealBtn");

  function paint(){
    vEl.textContent=val;
    slide.value=val;
    slide.style.setProperty("--f",(bal?val/bal*100:0)+"%");
    hint.innerHTML = val===0 ? "Passing &middot; banks +"+PASS_BANK+" &rarr; "+(bal+PASS_BANK)
      : (bal-val)+" would be left of "+bal;
    seal.textContent="Seal "+val;
  }
  function set(n,quiet){
    var next=Math.max(0,Math.min(bal,Math.round(n)));
    if(next===val){ paint(); return; }
    val=next; if(!quiet) sfx.key();
    paint();
  }
  document.getElementById("bidDown").addEventListener("click",function(){ set(val-1); buzz(4); });
  document.getElementById("bidUp").addEventListener("click",function(){ set(val+1); buzz(4); });
  slide.addEventListener("input",function(){ set(+slide.value,true); });
  slide.addEventListener("change",function(){ sfx.key(); buzz(5); });
  stage.querySelectorAll("[data-set]").forEach(function(b){
    b.addEventListener("click",function(){
      var d=b.dataset.set;
      set(d==="all"?bal:d==="half"?Math.floor(bal/2):0);
      buzz(6);
    });
  });
  function lockIn(){
    sfx.seal(); buzz([10,20,10]);
    G.bids[p]=val; bidAfter(p);
  }
  seal.addEventListener("click",lockIn);
  paint();
  runTurnClock(TURN_BID,lockIn);   /* time up seals whatever is on the dial */
}

/* the reveal: a held breath, then both numbers at once */
function screenBidReveal(){
  accent(null); enterGame(); chromeGame(true);
  var b0=G.bids[0], b1=G.bids[1];
  function card(i){
    return '<div class="card" id="bc'+i+'" style="--pc:'+phex(i)+'"><span class="nm">'+esc(pname(i))+" &middot; "+pmark(i)+"</span>"
      + '<span class="time masked" id="bv'+i+'">?</span>'
      + '<span class="off" id="bo'+i+'">&mdash;</span></div>';
  }
  show('<div class="screen reveal">'
     + bidBar()
     + '<div class="rev-head"><span class="lbl">Sealed bids for</span><span class="t">'+SQNAMES[G.bidSquare]+"</span></div>"
     + '<div class="cards">'+card(0)+'<div class="vs"><span>VS</span></div>'+card(1)+"</div>"
     + bidBoardHTML()
     + '<div class="banner" id="banner" aria-live="polite"><div class="dots"><i></i><i></i><i></i></div></div>'
     + '<div class="foot" id="foot"></div></div>');
  sfx.tense(); buzz(12);
  later(function(){ flipBids(b0,b1); },1000);
}

function flipBids(b0,b1){
  var w = b0>b1 ? 0 : (b1>b0 ? 1 : null);
  /* both passing pays both of them, so it can repeat forever; after a few in a
     row the square goes to whoever named it rather than coming back again */
  var bothPassed = (b0===0 && b1===0);
  G.passRun = (w===null && bothPassed) ? (G.passRun||0)+1 : 0;
  var forced = (w===null && G.passRun>=PASS_LIMIT);
  if(forced){ w=G.bidChooser; G.passRun=0; }
  var diff=Math.abs(b0-b1), pool=G.pool||24;
  var decisive = w!==null && !forced && diff>=Math.max(3,Math.round(pool*0.25));
  var close = w!==null && !forced && diff<=1;
  [0,1].forEach(function(i){
    var v=document.getElementById("bv"+i), c=document.getElementById("bc"+i);
    v.textContent=(i?b1:b0); v.classList.remove("masked");
    c.classList.add("pop");
  });
  sfx.flip(); buzz([14,30,14]);

  later(function(){
    var head,sub,tint;
    if(w===null){
      document.getElementById("bc0").classList.add("hero");
      document.getElementById("bc1").classList.add("hero");
      head=bothPassed?"Both passed":"Tied at "+b0; tint="var(--void)";
      sub=(bothPassed ? "Both bank +"+PASS_BANK+". " : "Both pay "+b0+". ")
        + SQNAMES[G.bidSquare]+" stays up for bid.";
      sfx.tie(); buzz([20,60,20]);
    } else if(forced){
      var fc=document.getElementById("bc"+w);
      fc.classList.add("hero");
      document.getElementById("bc"+(1-w)).classList.add("dim");
      tint=phex(w); accent(phex(w));
      head=pname(w)+" takes it by default";
      sub="Passed "+PASS_LIMIT+" times over. It goes to whoever named it \u2014 both still bank +"+PASS_BANK+".";
      sfx.win(); buzz([26,40,60]);
    } else {
      var c=document.getElementById("bc"+w);
      c.classList.add("hero");
      document.getElementById("bc"+(1-w)).classList.add("dim");
      tint=phex(w); accent(phex(w));
      head=pname(w)+" takes it"+(close?" by one":"");
      sub=(decisive?"Blown away by "+diff+". ":close?"The narrowest of margins. ":"")
        + (G.bids[1-w]===0 ? pname(1-w)+" passed and banks +"+PASS_BANK+"."
                           : pname(1-w)+" still pays "+G.bids[1-w]+".");
      if(decisive||close){ c.classList.add("burstfx"); sfx.burst(); buzz([30,40,80]); }
      else { sfx.win(); buzz([26,40,60]); }
    }
    [0,1].forEach(function(i){
      var o=document.getElementById("bo"+i), after=G.bal[i]-bidCost(G.bids[i]);
      o.textContent=(G.bids[i]===0?"+"+PASS_BANK+" banked \u00b7 ":"")+after+" left";
      o.classList.add("on");
    });
    document.getElementById("banner").innerHTML='<div class="head" style="color:'+tint+'">'+esc(head)+"</div>"
      + '<div class="sub">'+esc(sub)+"</div>";
    later(function(){ settleBids(w,b0,b1); },900);
  },620);
}

function settleBids(w,b0,b1){
  var sq=G.bidSquare;
  G.bal[0]-=bidCost(b0); G.bal[1]-=bidCost(b1);
  G.bidLog.push({ sq:sq, b0:b0, b1:b1, w:w });
  if(w!==null){
    G.cells[sq]=pmark(w); G.lastPlaced=sq;
    sfx.place(); creditRound(w);
    G.result=judge();
    G.bidChooser=1-G.bidChooser;   /* the pick alternates, but only once a square actually settles */
  }
  logRound({
    t: w===null ? ((b0===0&&b1===0) ? "Both passed on "+SQNAMES[sq] : "Tied at "+b0+" on "+SQNAMES[sq])
                : pname(w)+" took "+SQNAMES[sq].toLowerCase(),
    d: pname(0)+" bid "+b0+" \u00b7 "+pname(1)+" bid "+b1+" \u00b7 "+G.bal[0]+" and "+G.bal[1]+" left",
    winner: w
  });
  chromeGame(true);

  /* a pool can always climb back now, so the only ends are a line or a full board */
  var done = !!G.result;
  var wait=done?1500:2000, fired=false;
  var foot=document.getElementById("foot");
  var label = done ? "See the result" : (w===null?"Bid again":pname(G.bidChooser)+" picks next");
  foot.innerHTML='<button class="act accent" id="next" type="button">'+label+"</button>"+autoBar(wait);
  var wrap=stage.querySelector(".board.ttt.md");
  if(wrap) wrap.outerHTML=bidBoardHTML();
  var br=stage.querySelector(".pbar");
  if(br) br.outerHTML=bidBar();
  function go(){
    if(fired) return; fired=true; haltAll();
    if(done) bidEnd(); else bidRound();
  }
  document.getElementById("next").addEventListener("click",function(){ sfx.tap(); go(); });
  later(go,wait);
}

function bidEnd(){
  G.result=G.result||judge()||{ winner:null, line:null };
  finishMatch(G.result.winner);
}
/* ============================================================
   Placement + game over
   ============================================================ */

function autoBar(ms){ return '<div class="autoline"><i style="--dur:'+(ms/1000).toFixed(2)+'s"></i></div>'; }
function rnd2(a,b){ return Math.round((a+Math.random()*(b-a))*100)/100; }

function creditRound(w){
  ST(w).roundsWon++; bump(w,"roundsWon"); bump(1-w,"roundsPlayed",0);
  if(G.mode==="number"){ bump(0,"roundsPlayed"); bump(1,"roundsPlayed"); }
  if(G.mode==="timer"&&G.target>6) bump(w,"longWins");
  award(w,COIN_ROUND,"Round won");
  save();
}

/* ---------- shared board wiring ---------- */

function wireBoard(wrap,w,onPick){
  if(B().drop){
    var ghostCell=null;
    var clearGhost=function(){ if(ghostCell){ ghostCell.innerHTML=""; ghostCell=null; } };
    var preview=function(col){
      clearGhost();
      var r=dropRow(col); if(r<0) return;
      ghostCell=wrap.querySelector('.cell[data-i="'+idx(r,col)+'"]');
      if(ghostCell) ghostCell.innerHTML='<span class="pad"><span class="discghost" style="color:'+phex(w)+'"></span></span>';
    };
    wrap.addEventListener("pointerdown",function(e){ var b=e.target.closest(".c4col"); if(b&&!b.disabled) preview(+b.dataset.col); });
    wrap.addEventListener("pointerover",function(e){ var b=e.target.closest(".c4col"); if(b&&!b.disabled&&e.pointerType==="mouse") preview(+b.dataset.col); });
    wrap.addEventListener("pointerleave",clearGhost);
    wrap.addEventListener("pointercancel",clearGhost);
    wrap.addEventListener("click",function(e){
      var b=e.target.closest(".c4col"); if(!b||b.disabled) return;
      var col=+b.dataset.col, r=dropRow(col); if(r<0) return;
      clearGhost(); onPick(idx(r,col),r);
    });
  } else {
    wrap.addEventListener("click",function(e){
      var cell=e.target.closest(".cell.live"); if(!cell) return;
      onPick(parseInt(cell.dataset.i,10),0);
    });
  }
}
function moveNote(i){
  var b=B();
  return b.drop ? "Column "+((i%b.cols)+1)
                : "Row "+(Math.floor(i/b.cols)+1)+", column "+((i%b.cols)+1);
}

/* ---------- classic: play the board itself ---------- */

function screenClassic(){
  var p=G.turn, bot=isBot(p);
  accent(phex(p)); enterGame(); chromeGame(true);
  var counts=[
    G.cells.filter(function(v){ return v==="X"; }).length,
    G.cells.filter(function(v){ return v==="O"; }).length
  ];
  show('<div class="screen classic">'
     + playerBar(p,[sub(counts[0]+" placed"),sub(counts[1]+" placed")],!bot)
     + '<div id="boardWrap">'+boardHTML("lg",bot?null:p)+"</div>"
     + '<div class="statusline lbl" id="status">'+(bot?"Bot is thinking":B().pick)+"</div></div>");
  var wrap=document.getElementById("boardWrap");
  if(bot){
    later(function(){ playFor(p,BOT.move(G.cells,G.board,p)); },560);
    return;
  }
  wireBoard(wrap,p,function(i,row){ commit(i,p,row); });
  runTurnClock(TURN_MOVE,function(){ playFor(p,randomPick()); });
}

/* pick = a cell index on tic-tac-toe, a column on connect 4 */
function playFor(p,pick){
  if(pick<0||pick===undefined) return;
  var i=B().drop?idx(dropRow(pick),pick):pick, row=B().drop?dropRow(pick):0;
  if(i<0) return;
  commit(i,p,row);
}
function randomPick(){
  var open=[];
  if(B().drop){ for(var c=0;c<B().cols;c++) if(dropRow(c)>=0) open.push(c); }
  else G.cells.forEach(function(v,i){ if(!v) open.push(i); });
  return open.length?open[Math.floor(Math.random()*open.length)]:-1;
}

/* ---------- duel: the round winner claims a square ---------- */

function screenPlace(w){
  G.winner=w; accent(phex(w)); enterGame(); chromeGame(true);
  var bot=isBot(w);
  show('<div class="screen place">'
     + playerBar(w,[sub(w===0?"Round won":"\u2014"),sub(w===1?"Round won":"\u2014")],!bot)
     + '<div id="boardWrap">'+boardHTML("lg",bot?null:w)+"</div>"
     + '<div class="statusline lbl" id="status">'+(bot?"Bot is picking its square":B().pick)+"</div></div>");
  var wrap=document.getElementById("boardWrap");
  if(bot){
    later(function(){ playFor(w,BOT.move(G.cells,G.board,w)); },700);
    return;
  }
  wireBoard(wrap,w,function(i,row){ commit(i,w,row); });
  runTurnClock(TURN_MOVE,function(){ playFor(w,randomPick()); });
}

function commit(i,w,row){
  var wrap=document.getElementById("boardWrap");
  G.cells[i]=pmark(w); G.lastPlaced=i;
  if(G.kind==="board") logRound({ t:pname(w)+" played", d:moveNote(i), winner:w });
  else if(G.log.length) G.log[G.log.length-1].cells=G.cells.slice();
  sfx.place();
  if(B().drop){
    G.inFlight=i;
    wrap.innerHTML=boardHTML("lg",null);
    dropDisc(wrap,i,w,function(){ G.inFlight=-1; settleMove(w); });
  } else {
    buzz(14);
    settleMove(w);
  }
}
function settleMove(w){
  var wrap=document.getElementById("boardWrap");
  G.result=judge();
  /* a dropped disc already put itself in its cell; only redraw when a line needs drawing */
  if(wrap&&(G.result||!B().drop)) wrap.innerHTML=boardHTML("lg",null);
  chromeGame(true);
  if(G.result){
    if(G.result.winner!==null){ later(sfx.game,380); later(function(){ finishMatch(G.result.winner); },1450); }
    else { later(sfx.draw,260); later(function(){ finishMatch(null); },1000); }
    return;
  }
  var status=document.getElementById("status");
  if(G.kind==="board"){
    G.turn=1-G.turn;
    later(screenClassic,B().drop?260:200);
  } else {
    if(status) status.textContent="";
    later(function(){ startRound(null); },620);
  }
}

/* ---------- results ---------- */

function afterRound(w){
  if(G.kind==="duel"){ screenPlace(w); return; }
  G.score[w]++;
  if(G.score[w]>=(GAMES[G.game].winTo||3)) finishMatch(w);
  else startRound(null);
}

function finishMatch(w){
  if(w!==null){
    if(!G.vsBot) DB.series[w]++;
    var st=ST(w);
    st.wins++; st.streak++;
    if(st.streak>st.bestStreak) st.bestStreak=st.streak;
    ST(1-w).streak=0;
    bump(w,"matchesWon");
    if(hasBoard()&&G.board==="c4") bump(w,"c4Wins");
    award(w,COIN_MATCH,"Match won");
  }
  ST(0).matches++; ST(1).matches++;
  save();
  archiveMatch(w);
  screenOver(w);
}

function screenOver(w){
  accent(w===null?null:phex(w)); enterGame(); chromeGame(false);
  var g=GAMES[G.game];
  var line = w===null ? (G.kind==="bid"&&!boardFull() ? "Both pools are empty. Honours even."
                                                      : "Board full, no line. Honours even.")
    : hasBoard() ? B().need+" in a row."
    : "First to "+(g.winTo||3)+" rounds.";
  /* a friend match keeps a running series; against the bot only this match counts */
  if(hasBoard()) G.score=[
    G.cells.filter(function(v){ return v==="X"; }).length,
    G.cells.filter(function(v){ return v==="O"; }).length
  ];
  var useSeries=hasBoard()&&!G.vsBot;
  var s0=useSeries?DB.series[0]:G.score[0], s1=useSeries?DB.series[1]:G.score[1];
  var slabel=useSeries?"Series":hasBoard()?"Squares":"Rounds";
  if(G.kind==="bid"){ s0=G.bal[0]; s1=G.bal[1]; slabel="Points left"; }
  var scoreRow='<div class="series"><span class="sc" style="color:'+phex(0)+'">'+s0+"</span>"
    + '<span class="vlabel">'+slabel+"</span>"
    + '<span class="sc" style="color:'+phex(1)+'">'+s1+"</span></div>";
  show('<div class="screen over">'
     + '<div class="head"><span class="lbl">'+esc(w===null?"Stalemate":g.name)+"</span>"
     +   '<span class="who">'+esc(w===null?"Draw":pname(w)+" wins")+"</span>"
     +   '<span class="sub">'+esc(line)+"</span></div>"
     + (hasBoard()?boardHTML("lg",null):"")
     + scoreRow
     /* one clear primary action, and the two ways out side by side under it */
     + '<div class="foot"><button class="act hero" id="again" type="button">Play again</button>'
     +   '<div class="footrow">'
     +     '<button class="act" id="toHub" type="button">'+I.home+"Home</button>"
     +     '<button class="act" id="hist" type="button">'+I.hist+"History</button>"
     +   "</div></div></div>");
  document.getElementById("again").addEventListener("click",function(){
    sfx.tap();
    newMatch(G.game,{ board:G.board, bot:G.vsBot, tap:G.tapTarget });
  });
  document.getElementById("hist").addEventListener("click",function(){ sfx.tap(); openHistory(); });
  document.getElementById("toHub").addEventListener("click",function(){ sfx.tap(); tab="home"; showHub(); });
}

/* ============================================================
   Flow
   ============================================================ */

function newMatch(id,opts){
  var g=GAMES[id]; opts=opts||{};
  G.game=id; G.kind=g.kind; G.mode=g.mode||null;
  G.board=g.board||opts.board||"ttt";
  G.vsBot=!!opts.bot; G.bot=G.vsBot?1:-1;
  G.tapTarget=(typeof opts.tap==="number")?opts.tap:null;
  G.log=[]; G.round=1; G.score=[0,0];
  G.cells=hasBoard() ? new Array(BOARDS[G.board].cols*BOARDS[G.board].rows).fill(null) : [];
  G.lastPlaced=-1; G.inFlight=-1; G.result=null; G.winner=null;
  G.first=Math.random()<.5?0:1; G.turn=G.first;
  /* you play at somebody's place, and their terrain is the board. Against the
     bot that is always you; between two players it takes turns. */
  G.home = G.vsBot ? 0 : DB.lastHome;
  if(!G.vsBot){ DB.lastHome=1-DB.lastHome; save(); }
  if(hasBoard()) logRound({ t:"At "+pname(G.home)+"'s place", d:terrainOf(G.home).name+" terrain", winner:null });
  if(g.kind==="board") screenClassic();
  else if(g.kind==="bid") bidStart(Math.min(BID_MAX,Math.max(BID_MIN,opts.pool||BID_POOL)));
  else startRound(null,true);
}

function startRound(reason,keepFirst){
  G.replay=reason; G.outcome=null; G.winner=null;
  if(!keepFirst) G.first=1-G.first;
  if(G.mode==="seq"){ seqStart(); }
  else if(G.kind==="tap"||G.mode==="timer"){
    G.target = (G.kind==="tap")
      ? (G.tapTarget!==null ? G.tapTarget : rnd2(TAP_MIN,TAP_MAX))
      : rnd2(TARGET_MIN,TARGET_MAX);
    G.times=[null,null]; G.devs=[null,null]; G.turnIdx=0;
    timerPass();
  } else {
    G.hi = (G.kind==="duel") ? DUEL_HI : SOLO_HI;
    G.cap = (G.kind==="duel") ? DUEL_TRIES*2 : SOLO_CAP;
    G.secret = 1+Math.floor(Math.random()*G.hi);
    G.guesses=[]; G.entry=""; G.lastVerdict=null;
    screenGuess();
  }
}

load();
showHub();

})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0A0C11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="A two-player pass-and-play game of blind timing, with coins, quests and a shop.">
<title>Timer Tic-Tac-Toe</title>
</head>
<body>
<!-- ARTIFACT:BEGIN -->
<style>
/* ============================================================
   Timer Tic-Tac-Toe — precision-instrument treatment.
   Single dark visual world, deliberately.
   ============================================================ */

:root{
  --ink:#0A0C11; --panel:#12151D; --panel-2:#171B25; --panel-3:#1D2230;
  --hair:rgba(255,255,255,.085); --hair-2:rgba(255,255,255,.16);
  --text:#EDEFF5; --grey:#8A8FA0; --grey-dim:#5A6072;
  --coin:#E8B44A; --void:#E4A33B; --good:#3ED598;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Mono","Roboto Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --ease:cubic-bezier(.2,.85,.3,1);
  --pc:#8A8FA0;
  color-scheme:dark;
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; height:100%; background:var(--ink); }
body{
  color:var(--text); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior:none; touch-action:manipulation;
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;
}
input,textarea{ -webkit-user-select:text; user-select:text; font:inherit; }
button{ font:inherit; }

#app{
  position:fixed; inset:0; max-width:560px; margin-inline:auto;
  display:flex; flex-direction:column; overflow:hidden; isolation:isolate;
  padding:
    calc(env(safe-area-inset-top) + 12px)
    calc(env(safe-area-inset-right) + 18px)
    calc(env(safe-area-inset-bottom) + 14px)
    calc(env(safe-area-inset-left) + 18px);
}
#app::before{
  content:''; position:fixed; inset:-30% -30% auto -30%; height:75%; z-index:-1; pointer-events:none;
  background:radial-gradient(50% 55% at 50% 20%, var(--glow, rgba(120,130,160,.10)), transparent 72%);
  transition:background .7s var(--ease);
}

.lbl{ font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.185em; text-transform:uppercase; color:var(--grey-dim); }
.num{ font-family:var(--mono); font-variant-numeric:tabular-nums; }

/* ---------- chrome ---------- */

#topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; height:44px; flex:none;
  transition:opacity .35s var(--ease), transform .35s var(--ease); }
#topbar.recede{ opacity:0; transform:translateY(-8px); pointer-events:none; }
#topbar .slot{ flex:1 1 0; display:flex; align-items:center; min-width:0; }
#topbar .slot.right{ justify-content:flex-end; }
#topbar .slot.mid{ flex:none; }

.icon-btn{
  appearance:none; border:1px solid var(--hair); background:var(--panel); color:var(--grey);
  width:34px; height:34px; border-radius:10px; display:grid; place-items:center; padding:0; cursor:pointer;
  transition:color .2s,border-color .2s,background .2s,transform .1s;
}
.icon-btn:hover{ color:var(--text); border-color:var(--hair-2); }
.icon-btn:active{ transform:scale(.94); }
.icon-btn svg{ width:17px; height:17px; }

.whoami{
  display:flex; align-items:center; gap:8px; padding:5px 10px 5px 6px;
  border:1px solid var(--hair); border-radius:999px; background:var(--panel);
  cursor:pointer; min-width:0; color:var(--text);
}
.whoami:active{ transform:scale(.97); }
.whoami .dot{ width:9px; height:9px; border-radius:50%; background:var(--pc); flex:none; box-shadow:0 0 8px -1px var(--pc); }
.whoami .nm{ font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.04em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.whoami .sw{ color:var(--grey-dim); font-size:10px; }

.coinpill{ display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:12.5px; font-weight:700; color:var(--coin); border:1px solid rgba(232,180,74,.28);
  background:rgba(232,180,74,.08); border-radius:999px; padding:5px 11px 5px 8px; }
.coinpill svg{ width:13px; height:13px; flex:none; }

/* ---------- stage ---------- */

#stage{ flex:1 1 auto; min-height:0; display:flex; }
#stage.scrolls{ overflow-y:auto; overflow-x:hidden; scrollbar-width:none; }
#stage.scrolls::-webkit-scrollbar{ display:none; }

.screen{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; animation:screenIn .38s var(--ease) both; }
@keyframes screenIn{ from{ opacity:0; transform:translateY(10px); } }
.view{ flex:1 1 auto; display:flex; flex-direction:column; gap:14px; padding:4px 0 8px; animation:screenIn .3s var(--ease) both; }

/* ---------- tab bar ---------- */

#tabbar{ flex:none; display:grid; grid-template-columns:repeat(5,1fr); gap:2px; padding-top:10px; margin-top:2px; border-top:1px solid var(--hair); }
#tabbar.hidden{ display:none; }
.tab{
  appearance:none; border:0; background:transparent; padding:7px 2px 3px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:5px; color:var(--grey-dim);
  transition:color .2s; position:relative;
}
.tab svg{ width:19px; height:19px; }
.tab span{ font-family:var(--mono); font-size:8.5px; letter-spacing:.1em; text-transform:uppercase; }
.tab.on{ color:var(--text); }
.tab.on::before{ content:''; position:absolute; top:-11px; left:50%; transform:translateX(-50%); width:22px; height:2px; border-radius:2px; background:var(--pc); }
.tab .badge{ position:absolute; top:3px; right:calc(50% - 17px); width:7px; height:7px; border-radius:50%; background:var(--coin); border:1.5px solid var(--ink); }

/* ---------- panels ---------- */

.panel{ border:1px solid var(--hair); border-radius:16px; background:var(--panel); padding:15px 16px; display:flex; flex-direction:column; gap:12px; }
.panel.tight{ padding:13px 14px; gap:9px; }
.panel-h{ display:flex; align-items:center; justify-content:space-between; gap:10px; }

.headline{ display:flex; flex-direction:column; gap:3px; }
.headline .big{ font-family:var(--mono); font-size:19px; font-weight:700; letter-spacing:-.02em; }

.statgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
.stat{ border:1px solid var(--hair); border-radius:12px; background:var(--panel-2); padding:10px 8px; text-align:center; display:flex; flex-direction:column; gap:4px; }
.stat .v{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; letter-spacing:-.02em; }
.stat .k{ font-family:var(--mono); font-size:8.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--grey-dim); }

/* ---------- action buttons ---------- */

.act{
  appearance:none; width:100%; flex:none; border:1px solid var(--hair-2); border-radius:16px;
  background:var(--panel-2); color:var(--text); font-family:var(--mono); font-size:12px; font-weight:600;
  letter-spacing:.16em; text-transform:uppercase; padding:17px 20px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:10px;
  transition:transform .12s var(--ease), background .2s, border-color .2s, opacity .2s;
}
.act:hover{ background:var(--panel-3); border-color:rgba(255,255,255,.24); }
.act:active{ transform:scale(.985); background:#161a24; }
.act:focus-visible{ outline:2px solid var(--grey); outline-offset:2px; }
.act.accent{ border-color:var(--pc); color:var(--pc); background:transparent; }
.act.hero{ background:var(--pc); border-color:var(--pc); color:#0A0C11; font-weight:700; }
.act.hero:hover{ filter:brightness(1.08); background:var(--pc); }
.act[disabled]{ opacity:.4; cursor:default; transform:none; }
.act.sm{ padding:10px 14px; font-size:10.5px; border-radius:11px; width:auto; }

/* ---------- board ---------- */

.board{
  position:relative; display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);   /* without this, rows size to content and a row holding a mark grows */
  aspect-ratio:1/1;
}
.board.lg{ width:100%; max-width:min(78vw,320px); gap:9px; margin-inline:auto; }
.board.sm{ width:56px; gap:3px; }
.cell{
  position:relative; appearance:none; padding:0; min-width:0; min-height:0;
  background:var(--panel); border:1px solid var(--hair); border-radius:14px; overflow:hidden;
  display:grid; place-items:center;
  transition:background .2s, border-color .2s, transform .12s var(--ease);
}
.board.sm .cell{ border-radius:4px; border-color:rgba(255,255,255,.07); }
.cell:disabled{ cursor:default; }
.cell.live{ cursor:pointer; }
.cell.live:hover{ border-color:var(--hair-2); background:var(--panel-2); }
.cell.live:active{ transform:scale(.94); background:var(--panel-2); }
.cell.live:focus-visible{ outline:2px solid var(--pc); outline-offset:2px; }
.cell .pad{ width:100%; height:100%; padding:19%; display:block; }
.board.sm .cell .pad{ padding:17%; }
.cell.wincell{ background:var(--panel-2); border-color:var(--pc); }

/* board themes (shop) */
.board.t-etched .cell{ border-radius:3px; background:transparent; border-color:var(--hair-2); box-shadow:inset 0 1px 0 rgba(255,255,255,.06); }
.board.t-void .cell{ border-radius:50%; background:#0C0E14; border-color:rgba(255,255,255,.06); }

.ghost{ opacity:.11; transition:opacity .18s, transform .18s var(--ease); display:block; width:100%; height:100%; }
.cell.live:hover .ghost{ opacity:.24; }
.cell.live:active .ghost{ opacity:.42; transform:scale(1.06); }

.mk{ display:block; width:100%; height:100%; overflow:visible; }
.mk line,.mk circle{ fill:none; stroke:currentColor; stroke-width:9; stroke-linecap:round; }
.board.sm .mk line,.board.sm .mk circle{ stroke-width:13; }
.mk.anim.mk-x line{ stroke-dasharray:74; stroke-dashoffset:74; animation:draw .3s var(--ease) forwards; }
.mk.anim.mk-x line.s2{ animation-delay:.13s; }
.mk.anim.mk-o circle{ stroke-dasharray:164; stroke-dashoffset:164; animation:draw .44s var(--ease) forwards; }
.mk-o circle{ transform:rotate(-90deg); transform-origin:50% 50%; }
@keyframes draw{ to{ stroke-dashoffset:0; } }

.winline{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
.winline line{ stroke:var(--pc); stroke-width:3; stroke-linecap:round; stroke-dasharray:210; stroke-dashoffset:210;
  animation:draw .55s .3s var(--ease) forwards; filter:drop-shadow(0 0 7px var(--pc)); }

/* ---------- hub: home ---------- */

.wordmark h1{ margin:0; font-family:var(--mono); font-weight:700; font-size:clamp(27px,9vw,36px); line-height:.94; letter-spacing:-.035em; }
.wordmark h1 .l2{ color:var(--grey); }
.wordmark p{ margin:8px 0 0; color:var(--grey); font-size:13.5px; line-height:1.5; max-width:34ch; }

.demo{ position:relative; height:88px; flex:none; border-block:1px solid var(--hair); display:grid; place-items:center; overflow:hidden; }
.demo::before,.demo::after{ content:''; position:absolute; top:0; bottom:0; width:1px; background:var(--hair); }
.demo::before{ left:0; } .demo::after{ right:0; }
.demo .readout{ font-family:var(--mono); font-size:40px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.03em; }
.demo .layer{ position:absolute; inset:0; display:grid; place-items:center; }

.ticks{ width:100%; height:34px; opacity:0; color:var(--pc);
  background-image:repeating-linear-gradient(90deg,currentColor 0 1px,transparent 1px 10px);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent); }

.vsrow{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; }
.vsrow .side{ display:flex; flex-direction:column; align-items:center; gap:6px; }
.vsrow .side .g{ width:34px; height:34px; }
.vsrow .side .n{ font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.05em; color:var(--pc);
  max-width:13ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.vsrow .side .r{ font-family:var(--mono); font-size:9px; letter-spacing:.1em; color:var(--grey-dim); }
.vsrow .mid{ font-family:var(--mono); font-size:9px; letter-spacing:.18em; color:var(--grey-dim); }

/* ---------- hub: quests ---------- */

.qrow{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--hair); }
.qrow:last-child{ border-bottom:0; padding-bottom:2px; }
.qrow .body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:6px; }
.qrow .t{ font-size:13.5px; font-weight:600; }
.qrow .d{ font-size:11.5px; color:var(--grey); }
.bar{ height:4px; border-radius:4px; background:rgba(255,255,255,.08); overflow:hidden; }
.bar i{ display:block; height:100%; background:var(--pc); border-radius:4px; transition:width .5s var(--ease); }
.qrow .side{ flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.qmeta{ font-family:var(--mono); font-size:10px; color:var(--grey-dim); font-variant-numeric:tabular-nums; }
.done{ color:var(--good); }

/* ---------- hub: shop ---------- */

.swatches{ display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
.sw{
  appearance:none; border:1px solid var(--hair); border-radius:13px; background:var(--panel-2);
  padding:10px 4px 8px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:7px;
  transition:border-color .2s, transform .1s, opacity .2s;
}
.sw:active{ transform:scale(.95); }
.sw .chip{ width:26px; height:26px; border-radius:50%; box-shadow:0 0 12px -3px currentColor; }
.sw .p{ font-family:var(--mono); font-size:9px; letter-spacing:.05em; color:var(--grey-dim); display:flex; align-items:center; gap:3px; }
.sw .p svg{ width:9px; height:9px; }
.sw.owned{ border-color:var(--hair-2); }
.sw.equipped{ border-color:currentColor; background:var(--panel-3); }
.sw.taken{ opacity:.32; cursor:not-allowed; }
.sw.locked .chip{ opacity:.35; }

.themerow{ display:flex; flex-direction:column; gap:8px; }
.theme{ display:flex; align-items:center; gap:12px; border:1px solid var(--hair); border-radius:13px; background:var(--panel-2); padding:10px 12px; cursor:pointer; transition:border-color .2s, transform .1s; }
.theme:active{ transform:scale(.99); }
.theme.equipped{ border-color:var(--pc); }
.theme .prev{ width:38px; height:38px; flex:none; }
.theme .body{ flex:1 1 auto; display:flex; flex-direction:column; gap:2px; min-width:0; }
.theme .t{ font-size:13px; font-weight:600; }
.theme .d{ font-size:11px; color:var(--grey-dim); }

/* ---------- hub: players + chat ---------- */

.pcard{ display:flex; align-items:center; gap:12px; border:1px solid var(--hair); border-radius:14px; background:var(--panel-2); padding:12px; }
.pcard .g{ width:36px; height:36px; flex:none; }
.pcard .body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px; }
.pcard .n{ font-family:var(--mono); font-size:13px; font-weight:700; letter-spacing:-.01em; color:var(--pc); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pcard .s{ font-size:11px; color:var(--grey); font-variant-numeric:tabular-nums; }
.pcard .me{ font-family:var(--mono); font-size:8px; letter-spacing:.14em; color:var(--ink); background:var(--pc); border-radius:4px; padding:2px 5px; }

.chat{ display:flex; flex-direction:column; gap:9px; }
.msgs{ display:flex; flex-direction:column; gap:8px; min-height:90px; max-height:34vh; overflow-y:auto; scrollbar-width:none; padding-right:2px; }
.msgs::-webkit-scrollbar{ display:none; }
.msg{ max-width:82%; padding:8px 11px; border-radius:14px; font-size:13px; line-height:1.4; word-wrap:break-word; overflow-wrap:anywhere; }
.msg.a{ align-self:flex-start; background:var(--panel-2); border:1px solid var(--hair); border-bottom-left-radius:5px; }
.msg.b{ align-self:flex-end; background:color-mix(in srgb, var(--pc) 20%, var(--panel-2)); border:1px solid color-mix(in srgb, var(--pc) 40%, transparent); border-bottom-right-radius:5px; }
.msg .who{ font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--pc); display:block; margin-bottom:3px; }
.msg .tm{ font-family:var(--mono); font-size:9px; color:var(--grey-dim); margin-left:6px; }
.emptychat{ text-align:center; color:var(--grey-dim); font-size:12px; padding:20px 0; }
.composer{ display:flex; gap:8px; align-items:center; }
.composer input{
  flex:1 1 auto; min-width:0; background:var(--panel-2); border:1px solid var(--hair); border-radius:12px;
  padding:12px 13px; color:var(--text); font-size:14px; outline:none; transition:border-color .2s;
}
.composer input:focus{ border-color:var(--pc); }
.composer input::placeholder{ color:var(--grey-dim); }
.send{ appearance:none; border:0; border-radius:12px; background:var(--pc); color:#0A0C11; width:44px; height:44px; flex:none; display:grid; place-items:center; cursor:pointer; transition:transform .1s, opacity .2s; }
.send:active{ transform:scale(.93); }
.send[disabled]{ opacity:.3; cursor:default; }
.send svg{ width:18px; height:18px; }

/* ---------- hub: profile ---------- */

.field{ display:flex; flex-direction:column; gap:7px; }
.field input{ background:var(--panel-2); border:1px solid var(--hair); border-radius:12px; padding:12px 13px; color:var(--text); font-size:14px; outline:none; transition:border-color .2s; }
.field input:focus{ border-color:var(--pc); }

/* ---------- game: pass ---------- */

.pass{ align-items:center; justify-content:center; cursor:pointer; text-align:center; }
.pass .glyph{ width:96px; height:96px; margin-bottom:26px; }
.pass .who{ font-family:var(--mono); font-size:clamp(24px,7.5vw,32px); font-weight:700; letter-spacing:-.02em; color:var(--pc); }
.pass .msg{ margin-top:10px; color:var(--grey); font-size:14.5px; }
.pass .hint{ margin-top:34px; animation:breathe 2.4s ease-in-out infinite; }
@keyframes breathe{ 50%{ opacity:.35; } }

/* ---------- game: timer ---------- */

.timer{ align-items:center; justify-content:space-between; gap:14px; padding-top:6px; }
.target{ text-align:center; display:flex; flex-direction:column; align-items:center; gap:7px; }
.target .val{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:clamp(44px,14vw,58px); font-weight:700; line-height:1; letter-spacing:-.045em; }
.target .val small{ font-size:.4em; font-weight:600; color:var(--grey); margin-left:3px; letter-spacing:0; }

.window{ position:relative; width:100%; height:112px; flex:none; display:grid; place-items:center; border-block:1px solid var(--hair); }
.window::before,.window::after{ content:''; position:absolute; top:0; bottom:0; width:1px; background:var(--hair); }
.window::before{ left:0; } .window::after{ right:0; }
.window .layer{ position:absolute; inset:0; display:grid; place-items:center; padding-inline:18px; }

.live{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:52px; font-weight:600; letter-spacing:-.04em; color:var(--pc);
  transition:opacity .46s var(--ease), filter .46s var(--ease), transform .46s var(--ease); }
.live.gone{ opacity:0; filter:blur(16px); transform:scale(.93); }

/* the visible-phase fuse: you can watch the clock run out before it hides */
.fuse{ position:absolute; left:50%; transform:translateX(-50%); bottom:20px; width:104px; height:2px;
  border-radius:2px; background:rgba(255,255,255,.10); overflow:hidden; opacity:0; transition:opacity .3s; }
.fuse.on{ opacity:1; }
.fuse i{ display:block; height:100%; width:100%; background:var(--pc); border-radius:2px; transform-origin:left center; }

.shutter{ position:absolute; left:0; right:0; height:1px; top:0; background:var(--pc); opacity:0; }
.shutter.run{ animation:sweep .42s var(--ease) forwards; }
@keyframes sweep{ 0%{ opacity:0; top:0 } 16%{ opacity:.95 } 100%{ opacity:0; top:100% } }

.blindmsg{ position:absolute; bottom:11px; left:0; right:0; text-align:center; opacity:0;
  transition:opacity .5s .22s var(--ease), letter-spacing .5s .22s var(--ease); letter-spacing:.05em; }
.blindmsg.on{ opacity:1; letter-spacing:.185em; color:var(--pc); }

.prehint{ position:absolute; bottom:11px; left:0; right:0; text-align:center; transition:opacity .25s; }

.locked{ display:flex; flex-direction:column; align-items:center; gap:10px; animation:screenIn .26s var(--ease) both; }
.locked .tick{ width:34px; height:34px; color:var(--pc); }
.locked .tick path{ fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:32; stroke-dashoffset:32; animation:draw .3s var(--ease) forwards; }

.actuator{
  position:relative; flex:none; width:min(60vw,232px); aspect-ratio:1/1; margin-bottom:6px;
  appearance:none; border:0; padding:0; cursor:pointer; border-radius:50%;
  background:radial-gradient(120% 120% at 50% 18%, #232936 0%, #161A24 52%, #0F131B 100%);
  color:var(--pc); display:grid; place-items:center;
  box-shadow:0 1px 0 rgba(255,255,255,.10) inset, 0 -14px 26px rgba(0,0,0,.5) inset,
             0 14px 34px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
  transition:transform .09s var(--ease), box-shadow .09s var(--ease), color .3s;
}
.actuator .cap{ position:absolute; inset:13px; border-radius:50%; border:1px solid currentColor; opacity:.34; transition:opacity .2s, transform .3s var(--ease); }
.actuator .cap2{ position:absolute; inset:13px; border-radius:50%; box-shadow:0 0 34px -4px currentColor; opacity:.22; transition:opacity .3s; }

    var inner = v ? '<span style="color:'+col+';display:block;width:100%;height:100%">'+markSVG(v,i===G.lastPlaced)+"</span>"
              : (open ? '<span class="ghost" style="color:'+col+'">'+markSVG(mark,false)+"</span>" : "");
    return '<button type="button" class="cell'+(open?" live":"")+(isWin?" wincell":"")+'" data-i="'+i+'"'+(open?"":" disabled")+
           ' aria-label="Square '+(i+1)+(v?", "+v:", empty")+'"><span class="pad">'+inner+"</span></button>";
  }).join("");
  return '<div class="board '+size+" t-"+DB.shared.theme+'" role="group" aria-label="Board">'+cells+winLineSVG()+"</div>";
}

   Rewards

function bump(pi,key,n){
  var q=P(pi).q; q[key]=(q[key]||0)+(n||1);
}
function award(pi,amount,reason){
  P(pi).coins+=amount; save();
  toast(amount, reason);
}
function questsReady(pi){
  var p=P(pi), n=0;
  QUESTS.forEach(function(q){ if(!p.claimed[q.id] && (p.q[q.track]||0)>=q.goal) n++; });
  return n;
}

function show(html){ haltAll(); stage.innerHTML=html; }
function enterGame(){ stage.classList.remove("scrolls"); tabbar.classList.add("hidden"); }

function screenPass(){
  var p=actor(); accent(phex(p)); enterGame(); chromeGame(true);
  var lead = G.replay==="tie" ? "Sudden death. New target, same stakes."
           : G.replay==="void" ? "Round replayed. New target."
           : G.turnIdx===0 ? "You go first this round." : "Hand the phone over.";
  show('<div class="screen pass" id="passHit" role="button" tabindex="0" aria-label="Tap to continue">'
     + '<div class="glyph">'+glyph(p,true)+"</div>"
     + '<div class="who">'+esc(pname(p))+"</div>"
     + '<div class="msg">'+esc(lead)+"</div>"
     + '<div class="hint lbl">Tap anywhere when ready</div></div>');
  var hit=document.getElementById("passHit");
  function go(){ sfx.warm(); sfx.tap(); screenTimer(); }
  hit.addEventListener("click",go);
  hit.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } });
  hit.focus({preventScroll:true});
}

function screenTimer(){
  var p=actor(); accent(phex(p)); enterGame(); chromeGame(true);
  show('<div class="screen timer">'
     + '<div class="target"><span class="lbl">Target</span><span class="val">'+fx2(G.target)+"<small>s</small></span></div>"
     + '<div class="window" id="win">'
     +   '<div class="layer"><span class="live" id="live">0.00</span></div>'
     +   '<div class="layer"><span class="ticks" id="ticks"></span></div>'
     +   '<div class="fuse" id="fuse"><i id="fuseBar"></i></div>'
     +   '<div class="shutter" id="shutter"></div>'
     +   '<div class="prehint lbl" id="prehint">Clock hides after 1.00s</div>'
     +   '<div class="blindmsg lbl" id="blind">Running blind</div>'
     + "</div>"
     + '<button class="actuator" id="act" type="button"><span class="cap2"></span><span class="cap"></span><span class="txt" id="actTxt">Start</span></button>'
     + "</div>");

  var winEl=document.getElementById("win"), live=document.getElementById("live"), ticks=document.getElementById("ticks"),
      shut=document.getElementById("shutter"), blind=document.getElementById("blind"), pre=document.getElementById("prehint"),
      fuse=document.getElementById("fuse"), fuseBar=document.getElementById("fuseBar"),
      btn=document.getElementById("act"), btnTxt=document.getElementById("actTxt");

  var running=false, armed=false, done=false, warned=false, t0=0;

  function begin(){
    running=true; t0=performance.now();
    btnTxt.textContent="Stop"; btn.classList.add("running");
    topbar.classList.add("recede");
    pre.style.opacity="0"; fuse.classList.add("on");
    sfx.start(); buzz(8);
    later(function(){ armed=true; }, ARM_DELAY);

    (function tick(now){
      if(!running) return;
      var ms=now-t0;
      if(ms<BLIND_AT){
        live.textContent=fx2(ms/1000);
        fuseBar.style.transform="scaleX("+(1-ms/BLIND_AT).toFixed(4)+")";
        if(!warned && ms>BLIND_AT-260){ warned=true; sfx.warn(); }   // audible tell just before it hides
      } else if(!live.classList.contains("gone")){
        live.classList.add("gone");
        shut.classList.add("run");
        blind.classList.add("on");
        fuse.classList.remove("on");
        buzz(6);
      } else {
        var s=(ms-BLIND_AT)/1000;
        var ramp=Math.min(1,(ms-BLIND_AT)/620);                      // ease the scale in rather than popping
        var breathe=.26+.24*(.5+.5*Math.sin(s*1.7))+.16*(.5+.5*Math.sin(s*.61+1.3));
        ticks.style.opacity=(ramp*breathe).toFixed(3);
      }
      frame(tick);
    })(performance.now());
  }

  function end(){
    running=false; done=true;
    var elapsed=Math.round((performance.now()-t0)/10)/100;
    G.times[p]=elapsed;
    G.devs[p]=Math.round(Math.abs(elapsed-G.target)*100)/100;
    var st=P(p).stats;
    if(st.best===null || G.devs[p]<st.best) st.best=G.devs[p];
    bump(p,"roundsPlayed");
    if(G.devs[p]<=0.10){ bump(p,"sharp"); award(p,COIN_SHARP,"Inside 0.10s"); }
    save();

    sfx.stop(); buzz([16,26,12]);
    btn.disabled=true; btn.classList.remove("running"); btnTxt.textContent="Locked";
    winEl.innerHTML='<div class="layer"><div class="locked">'
      + '<svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12.5 5.2 5.2L20 7"/></svg>'
      + '<span class="lbl">Time recorded</span></div></div>';

    later(function(){ if(G.turnIdx===0){ G.turnIdx=1; screenPass(); } else screenReveal(); }, 760);
  }

  btn.addEventListener("click",function(){
    if(done) return;
    if(!running) begin(); else if(armed) end();
  });
  btn.focus({preventScroll:true});
}

function screenReveal(){
  accent(null); enterGame(); chromeGame(true);
  var d0=G.devs[0], d1=G.devs[1];
  if(d0>VOID_LIMIT&&d1>VOID_LIMIT){ G.outcome="void"; G.winner=null; }
  else if(d0===d1){ G.outcome="tie"; G.winner=null; }
  else { G.outcome="win"; G.winner=d0<d1?0:1; }

  function pinPos(i){
    var delta=G.times[i]-G.target;
    return 50 + (Math.max(-VOID_LIMIT,Math.min(VOID_LIMIT,delta))/VOID_LIMIT)*50;
  }
  function card(i){
    return '<div class="card" id="c'+i+'" style="--pc:'+phex(i)+'">'
      + '<span class="nm">'+esc(pname(i))+" &middot; "+pmark(i)+"</span>"
      + '<span class="time masked" id="t'+i+'">&mdash;.&mdash;&mdash;</span>'
      + '<span class="off" id="o'+i+'">&mdash;</span></div>';
  }
  show('<div class="screen reveal">'
     + '<div class="rev-head"><span class="lbl">Target was</span><span class="t">'+fx2(G.target)+"s</span></div>"
     + '<div class="cards">'+card(0)+'<div class="vs"><span>VS</span></div>'+card(1)+"</div>"
     + '<div class="finish">'
     +   '<div class="pin" id="p0" data-mk="X" style="--pc:'+phex(0)+'; left:50%"></div>'
     +   '<div class="pin p2" id="p1" data-mk="O" style="--pc:'+phex(1)+'; left:50%"></div>'
     +   '<div class="axis"><div class="bound l"></div><div class="zero"></div><div class="bound r"></div>'
     +     '<span class="cap l">&minus;1.50 early</span><span class="cap c">Target</span><span class="cap r">+1.50 late</span></div>'
     + "</div>"
     + '<div class="banner" id="banner" aria-live="polite"><div class="dots"><i></i><i></i><i></i></div></div>'
     + '<div class="foot" id="foot"></div></div>');

  var banner=document.getElementById("banner"), foot=document.getElementById("foot");

  function drop(i,instant){
    var el=document.getElementById("t"+i), off=document.getElementById("o"+i), pin=document.getElementById("p"+i);
    var v=G.times[i], delta=v-G.target;
    el.classList.remove("masked");
    off.textContent=(G.devs[i]>VOID_LIMIT?"VOID • ":"")+(delta<0?"−":"+")+fx2(Math.abs(delta))+"s "+(delta<0?"early":"late");
    if(G.devs[i]>VOID_LIMIT) off.style.color="var(--void)";
    pin.style.left=pinPos(i)+"%"; pin.classList.add("on");
    sfx.ping(i); buzz(10);
    if(instant){ el.textContent=fx2(v); off.classList.add("on"); return; }
    var t0=performance.now(), dur=420;
    (function roll(now){
      var k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);
      el.textContent=fx2(v*e);
      if(k<1) frame(roll); else { el.textContent=fx2(v); off.classList.add("on"); }
    })(t0);
  }
  function tension(instant){
    if(instant) return;
    document.getElementById("c0").classList.add("shiver");
    document.getElementById("c1").classList.add("shiver");
    sfx.tense();
  }
  function settle(){
    document.getElementById("c0").classList.remove("shiver");
    document.getElementById("c1").classList.remove("shiver");
    var head,sub,label,tint;
    if(G.outcome==="win"){
      var w=G.winner;
      document.getElementById("c"+w).classList.add("hero");
      document.getElementById("c"+(1-w)).classList.add("dim");
      head=pname(w)+" takes the square";
      sub="Off by "+fx2(G.devs[w])+"s versus "+fx2(G.devs[1-w])+"s.";
      label="Place your "+pmark(w); tint=phex(w); accent(phex(w));
      sfx.win(); buzz([28,44,64]);
      P(w).stats.roundsWon++; bump(w,"roundsWon");
      if(G.target>6) bump(w,"longWins");
      award(w,COIN_ROUND,"Round won");
      save();
    } else if(G.outcome==="tie"){
      document.getElementById("c0").classList.add("hero");
      document.getElementById("c1").classList.add("hero");
      head="Dead heat"; sub="Both off by exactly "+fx2(G.devs[0])+"s. Sudden death — replay for a new target.";
      label="Replay round"; tint="#EDEFF5"; sfx.tie(); buzz([20,60,20]);
    } else {
      document.getElementById("c0").classList.add("dim");
      document.getElementById("c1").classList.add("dim");
      head="Round void"; sub="Both players missed by more than "+fx2(VOID_LIMIT)+"s. Nobody marks the board.";
      label="New target"; tint="var(--void)"; sfx.voided(); buzz([50]);
    }
    banner.innerHTML='<div class="head" style="color:'+tint+'">'+esc(head)+'</div><div class="sub">'+esc(sub)+"</div>";
    foot.innerHTML='<button class="act accent" id="next" type="button">'+esc(label)+"</button>";
    document.getElementById("next").addEventListener("click",function(){
      sfx.tap();
      if(G.outcome==="win") screenPlace(); else startRound(G.outcome);
    });
  }

  var steps=[[300,drop.bind(null,0)],[1200,drop.bind(null,1)],[2000,tension],[2800,settle]], at=0;
  steps.forEach(function(s,i){ later(function(){ if(i>=at){ at=i+1; s[1](false); } }, s[0]); });
  stage.querySelector(".reveal").addEventListener("click",function(e){
    if(at>=steps.length||e.target.closest("button")) return;
    haltAll();
    while(at<steps.length){ steps[at][1](true); at++; }
  });
}

function screenPlace(){
  var w=G.winner; accent(phex(w)); enterGame(); chromeGame(true);
  show('<div class="screen place">'
     + '<div class="head"><span class="lbl">Round won by</span><span class="who">'+esc(pname(w))+"</span>"
     +   '<span class="sub">Choose a square for your '+pmark(w)+".</span></div>"
     + '<div id="boardWrap">'+boardHTML("lg",w)+"</div></div>");
  document.getElementById("boardWrap").addEventListener("click",function(e){
    var cell=e.target.closest(".cell.live"); if(!cell) return;
    commit(parseInt(cell.dataset.i,10), w);
  });
}

function commit(i,w){
  G.board[i]=pmark(w); G.lastPlaced=i;
  sfx.place(); buzz(14);
  G.result=judge();
  document.getElementById("boardWrap").innerHTML=boardHTML("lg",null);
  chromeGame(true);
  if(G.result){
    if(G.result.winner!==null){
      var v=G.result.winner;
      DB.series[v]++;
      P(v).stats.wins++; P(v).stats.streak++;
      if(P(v).stats.streak>P(v).stats.bestStreak) P(v).stats.bestStreak=P(v).stats.streak;
      P(1-v).stats.streak=0;
      bump(v,"matchesWon");
      later(function(){ sfx.game(); award(v,COIN_MATCH,"Match won"); },420);
    } else later(sfx.draw,320);
    P(0).stats.matches++; P(1).stats.matches++; save();
    later(screenOver, G.result.line?1500:900);
  } else later(function(){ startRound(null); },860);
}

function judge(){
  for(var i=0;i<LINES.length;i++){
    var L=LINES[i], a=G.board[L[0]];
    if(a && a===G.board[L[1]] && a===G.board[L[2]]) return { winner:a==="X"?0:1, line:L };
  }
  if(G.board.every(Boolean)) return { winner:null, line:null };
  return null;
}

function screenOver(){
  var w=G.result.winner; accent(w===null?null:phex(w)); enterGame(); chromeGame(false);
  show('<div class="screen over">'
     + '<div class="head"><span class="lbl">'+(w===null?"Stalemate":"Match")+"</span>"
     +   '<span class="who">'+esc(w===null?"Draw":pname(w)+" wins")+"</span>"
     +   '<span class="sub">'+(w===null?"Board full, no line. Honours even.":"Three in a row with "+pmark(w)+".")+"</span></div>"
     + boardHTML("lg",null)
     + '<div class="series"><span class="sc" style="color:'+phex(0)+'">'+DB.series[0]+"</span>"
     +   '<span class="vlabel">Series</span><span class="sc" style="color:'+phex(1)+'">'+DB.series[1]+"</span></div>"
     + '<div class="foot"><button class="act hero" id="again" type="button">Play again</button>'
     +   '<button class="act" id="toHub" type="button">Back to hub</button></div></div>');
  document.getElementById("again").addEventListener("click",function(){ sfx.tap(); newMatch(); });
  document.getElementById("toHub").addEventListener("click",function(){ sfx.tap(); tab="home"; showHub(); });
}

/* ============================================================
   Flow
   ============================================================ */

function newMatch(){
  G.board=new Array(9).fill(null); G.lastPlaced=-1; G.result=null;
  G.first=Math.random()<.5?0:1;
  startRound(null,true);
}
function startRound(reason,keepFirst){
  G.target=Math.round((TARGET_MIN+Math.random()*(TARGET_MAX-TARGET_MIN))*100)/100;
  G.times=[null,null]; G.devs=[null,null];
  G.turnIdx=0; G.outcome=null; G.winner=null; G.replay=reason;
  if(!keepFirst) G.first=1-G.first;
  screenPass();
}

load();
showHub();

})();
</script>
